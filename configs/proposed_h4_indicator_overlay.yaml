PROPOSED_H4_OVERLAY_META:
  version: 2026-07-08-r1
  status: proposed_inactive
  import_into_live_config: false
  live_behavior_changed_by_this_file: false
  evidence_source:
  - tools/h4_tuning_experiment.py
  ranking_policy: h4_tuned_vs_h1_baseline_sl_rate_and_r_multiple
  scaling_rules:
    ema_trend: H1 value x 0.5
    ema_momentum: H1 value x 0.25
    ema_long: unchanged at 200
    rsi: H1 value x 0.5
    atr_adx: unchanged at 14/14
    macd: unchanged at 12/26/9
    sweep_lookback: 5 -> 2 bars on H4
