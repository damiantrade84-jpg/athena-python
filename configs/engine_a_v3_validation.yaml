schemaVersion: 1

limits:
  H1: 12000
  H4: 6000
  D1: 1500

groups:
  crypto_btc:
    horizons: [intraday, swing]
    validationEnabled: true
    requiredProvider: bybit
    costsVerified: true
    pairs:
      - display: BTC/USDT
        symbol: BTCUSDT
        type: crypto
        dataSymbol: BTC/USDT
    costs:
      spreadBps: 2.0
      # commissionBps/slippageBps are PER LEG: the v3 cost model charges them on
      # both entry and exit. Bybit taker 5.5 bps/leg -> 11 bps round trip,
      # matching FEE_PCT.crypto. (Was 11.0, which double-counted to 22 bps RT.)
      commissionBps: 5.5
      slippageBps: 2.0
      swapBpsPerDay: 1.0
    purgeBars: 5
    maxHoldBars:
      intraday: 24
      swing: 30

  crypto_eth:
    horizons: [intraday, swing]
    validationEnabled: true
    requiredProvider: bybit
    costsVerified: true
    pairs:
      - display: ETH/USDT
        symbol: ETHUSDT
        type: crypto
        dataSymbol: ETH/USDT
    costs:
      spreadBps: 2.5
      commissionBps: 5.5  # per leg (see crypto_btc note)
      slippageBps: 2.5
      swapBpsPerDay: 1.0
    purgeBars: 5
    maxHoldBars:
      intraday: 24
      swing: 30

  crypto_doge:
    horizons: [intraday, swing]
    validationEnabled: true
    requiredProvider: bybit
    costsVerified: true
    pairs:
      - display: DOGE/USDT
        symbol: DOGEUSDT
        type: crypto
        dataSymbol: DOGE/USDT
    costs:
      spreadBps: 5.0
      commissionBps: 5.5  # per leg (see crypto_btc note)
      slippageBps: 5.0
      swapBpsPerDay: 1.5
    purgeBars: 5
    maxHoldBars:
      intraday: 24
      swing: 30

  forex_majors:
    horizons: [intraday, swing]
    validationEnabled: true
    requiredProvider: mt5
    costsVerified: true
    pairs:
      - display: EUR/USD
        symbol: EURUSD
        type: forex
        dataSymbol: EUR/USD
      - display: GBP/USD
        symbol: GBPUSD
        type: forex
        dataSymbol: GBP/USD
      - display: USD/JPY
        symbol: USDJPY
        type: forex
        dataSymbol: USD/JPY
      - display: AUD/USD
        symbol: AUDUSD
        type: forex
        dataSymbol: AUD/USD
      - display: USD/CAD
        symbol: USDCAD
        type: forex
        dataSymbol: USD/CAD
      - display: USD/CHF
        symbol: USDCHF
        type: forex
        dataSymbol: USD/CHF
      - display: NZD/USD
        symbol: NZDUSD
        type: forex
        dataSymbol: NZD/USD
    costs:
      spreadBps: 1.5
      commissionBps: 2.0
      slippageBps: 1.0
      swapBpsPerDay: 0.2
    purgeBars: 5
    maxHoldBars:
      intraday: 24
      swing: 30

  forex_crosses:
    horizons: [intraday, swing]
    validationEnabled: true
    requiredProvider: mt5
    costsVerified: true
    pairs:
      - display: EUR/GBP
        symbol: EURGBP
        type: forex
        dataSymbol: EUR/GBP
      - display: EUR/JPY
        symbol: EURJPY
        type: forex
        dataSymbol: EUR/JPY
      - display: GBP/JPY
        symbol: GBPJPY
        type: forex
        dataSymbol: GBP/JPY
      - display: AUD/JPY
        symbol: AUDJPY
        type: forex
        dataSymbol: AUD/JPY
      - display: EUR/AUD
        symbol: EURAUD
        type: forex
        dataSymbol: EUR/AUD
      - display: GBP/AUD
        symbol: GBPAUD
        type: forex
        dataSymbol: GBP/AUD
      - display: EUR/CHF
        symbol: EURCHF
        type: forex
        dataSymbol: EUR/CHF
      - display: USD/SGD
        symbol: USDSGD
        type: forex
        dataSymbol: USD/SGD
      - display: AUD/CHF
        symbol: AUDCHF
        type: forex
        dataSymbol: AUD/CHF
      - display: AUD/NZD
        symbol: AUDNZD
        type: forex
        dataSymbol: AUD/NZD
    costs:
      spreadBps: 2.0
      commissionBps: 2.0
      slippageBps: 1.5
      swapBpsPerDay: 0.3
    purgeBars: 5
    maxHoldBars:
      intraday: 24
      swing: 30

  forex_exotics: &unvalidated_lane
    horizons: [intraday, swing]
    validationEnabled: false
    requiredProvider: unverified
    costsVerified: false
    pairs: [{display: USD/ZAR, symbol: USDZAR, type: forex, dataSymbol: USD/ZAR}]
  forex_other:
    <<: *unvalidated_lane
    pairs: [{display: USD/ILS, symbol: USDILS, type: forex, dataSymbol: USD/ILS}]
  # crypto_alt_majors/crypto_other enabled 2026-07: both are Bybit linear perps,
  # so the venue is verifiable. Commission is the published Bybit taker rate
  # (5.5 bps/leg, same as the BTC/ETH/DOGE lanes); spread/slippage are
  # deliberately conservative (wider than majors) for thinner books.
  crypto_alt_majors:
    horizons: [intraday, swing]
    validationEnabled: true
    requiredProvider: bybit
    costsVerified: true
    pairs:
      - display: SOL/USDT
        symbol: SOLUSDT
        type: crypto
        dataSymbol: SOL/USDT
    costs:
      spreadBps: 4.0
      commissionBps: 5.5  # per leg (see crypto_btc note)
      slippageBps: 3.0
      swapBpsPerDay: 1.0
    purgeBars: 5
    maxHoldBars:
      intraday: 24
      swing: 30
  crypto_other:
    horizons: [intraday, swing]
    validationEnabled: true
    requiredProvider: bybit
    costsVerified: true
    pairs:
      - display: AAVE/USDT
        symbol: AAVEUSDT
        type: crypto
        dataSymbol: AAVE/USDT
    costs:
      spreadBps: 8.0
      commissionBps: 5.5  # per leg (see crypto_btc note)
      slippageBps: 5.0
      swapBpsPerDay: 1.0
    purgeBars: 5
    maxHoldBars:
      intraday: 24
      swing: 30
  precious_trackers:
    <<: *unvalidated_lane
    pairs: [{display: XAU/USD, symbol: XAUUSD, type: commodity, dataSymbol: XAU/USD}]
  energy_oil:
    <<: *unvalidated_lane
    pairs: [{display: WTI Oil, symbol: USOIL, type: commodity, dataSymbol: WTI Oil}]
  nat_gas:
    <<: *unvalidated_lane
    pairs: [{display: Nat Gas, symbol: NATGAS, type: commodity, dataSymbol: Nat Gas}]
  copper:
    <<: *unvalidated_lane
    pairs: [{display: Copper, symbol: COPPER, type: commodity, dataSymbol: Copper}]
  pgm_metals:
    <<: *unvalidated_lane
    pairs: [{display: XPT/USD, symbol: XPTUSD, type: commodity, dataSymbol: XPT/USD}]
  base_metals:
    <<: *unvalidated_lane
    pairs: [{display: Aluminium, symbol: ALUMINIUM, type: commodity, dataSymbol: Aluminium}]
  softs:
    <<: *unvalidated_lane
    pairs: [{display: Coffee, symbol: COFFEE, type: commodity, dataSymbol: Coffee}]
  commodity_other:
    <<: *unvalidated_lane
    pairs: [{display: Uranium, symbol: URANIUM, type: commodity, dataSymbol: Uranium}]
  us_indices_trackers:
    <<: *unvalidated_lane
    pairs: [{display: S&P 500, symbol: US500, type: index, dataSymbol: S&P 500}]
  eu_indices:
    <<: *unvalidated_lane
    pairs: [{display: DAX, symbol: GER40, type: index, dataSymbol: DAX}]
  asian_indices:
    <<: *unvalidated_lane
    pairs: [{display: Nikkei 225, symbol: JP225, type: index, dataSymbol: Nikkei 225}]
  index_other:
    <<: *unvalidated_lane
    pairs: [{display: SA40, symbol: SA40, type: index, dataSymbol: SA40}]
  us_stock_single:
    <<: *unvalidated_lane
    pairs: [{display: AAPL, symbol: AAPL.US, type: stock, dataSymbol: AAPL}]
  bond_tlt:
    <<: *unvalidated_lane
    pairs: [{display: TLT, symbol: TLT.US, type: etf_bond, dataSymbol: TLT}]
  smallcap_em_etf:
    <<: *unvalidated_lane
    pairs: [{display: EEM, symbol: EEM.US, type: etf, dataSymbol: EEM}]
  stock_other:
    <<: *unvalidated_lane
    pairs: [{display: JSE:NPN, symbol: NPN.JO, type: stock, dataSymbol: NPN.JO}]
  unknown:
    <<: *unvalidated_lane
    pairs: [{display: UNKNOWN, symbol: UNKNOWN, type: other, dataSymbol: UNKNOWN}]
