  ranking_policy: robust_metrics_not_raw_pnl
  engines_merged: false
  final_threshold_decision: "no threshold promotions supported"
  final_threshold_reason: >
    r2 cycle (2026-06-26, period sweep): 0 of 25 Engine A score groups cleared all gates
    simultaneously (n>=30 LONG, n>=30 SHORT, SQN>2.0 per direction, L/S symmetry,
    Bonferroni correction). Key new findings from r2: (1) XAU/XAG LONG edges confirmed
    strong (XAU LONG SQN=2.679, XAG LONG SQN=2.149 at baseline) but SHORT direction is
    structurally near-zero/negative across all variants (XAU SHORT SQN=-0.573, XAG SHORT
    SQN=-0.098 at n=42-53) — the precious metals SHORT block is a REGIME problem (2023-2026
    bull market), NOT a sample-size problem; collecting more SHORT trades from this same
    window will not clear the gate. (2) DOGE LONG shows robust edge (SQN=2.38 current
    periods, 2.26 baseline) but SHORT SQN=0.87-0.94 < 2.0 blocks symmetry gate.
    (3) AAPL LONG SQN=2.0 (baseline) but SHORT SQN=-1.08 strongly negative. (4) BTC
    baseline SHORT SQN=2.228 passes but LONG SQN=1.08 fails — asymmetric, no promotion.
    (5) ALL forex groups: negative or near-zero alpha regardless of period variant;
    period change does not fix the forex alpha deficit. (6) Period variants compared to
    baseline: current unvalidated crypto periods (18/40/RSI12) NOT demonstrably better
    than baseline (21/50/RSI14) by SQN — both fail the gate. No period change justified.
    r1 and r7 conclusions confirmed and extended by r2.
