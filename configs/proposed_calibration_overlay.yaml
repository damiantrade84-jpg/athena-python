      - "crypto_doge (DOGE/USDT — first coverage in any cycle)"
      - "crypto_alt_majors (SOL/USDT, XRP/USDT — first coverage)"
      - "us_indices_trackers (NDX/SPX/DJI — first coverage)"
      - "eu_indices (DAX — first coverage)"
      - "energy_oil (WTI/Oil — first coverage)"
      - "us_stock_single (AAPL/NVDA/TSLA added to MSFT)"
      - "forex_majors (USD/JPY added; GBP/JPY as forex_crosses first coverage)"
  evidence_date_range_r7: "2026-03-29..2026-05-19"
  evidence_date_range_r1: "2026-05-30-frozen-backtest"
  evidence_date_range_r2: "2026-05-30-frozen-backtest-full-pair-sweep (H4 bar-by-bar, warmup 220 bars)"
