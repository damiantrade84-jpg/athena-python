  forex: []

  commodity: ["DEAD RANGING", "RANGING"]

  stock: ["DEAD RANGING", "RANGING"]

  index: ["DEAD RANGING", "RANGING"]

AUTO_TRADE_BLOCKED_REGIMES:

  default: ["RANGING"]

  crypto: []

  forex: []

  commodity: ["RANGING"]

  stock: ["RANGING"]

  index: ["RANGING"]

# Demo/testing: 1.0 = up to 100% of balance in simultaneous stop-risk (cap effectively off).
# For live/paper discipline use ~0.06–0.12 (validated max 1.0 in config.py).
MAX_PORTFOLIO_HEAT: 1.0

MAX_OPEN_POSITIONS: 10

MAX_CORRELATED_POSITIONS: 10

SIGNAL_MAX_AGE_SEC: 300       # 5 min freshness window

# ── ATR freshness observability (F3/F5, default disabled) ────────────────────
# Per-TF maximum age (seconds) for the ATR window that produced SL/TP/RR.
# When ENABLED is true and an ATR is older than its TF threshold, the signal
# carries `atrFreshness.stale=true` (additive — observability only).
#
# BLOCK_EXECUTION_ON_STALE_ATR is the optional fail-closed enforcement switch.
# When false (default), nothing is blocked; the diagnostic surface is the only
# effect. When true, risk_engine and executors reject orders whose `atrFreshness.would_block`
# is true. Defaults are deliberately disabled — flipping this gate is a real
# behavior change and must be done deliberately per the audit invariants.
ATR_FRESHNESS:
  ENABLED: true
  BLOCK_EXECUTION_ON_STALE_ATR: true
  MAX_AGE_SECONDS:
    M1: 180
    M5: 600
    M15: 1800
    M30: 3600
    H1: 7200
    # Confirmed H4 candles retain their opening timestamp; allow the full
    # four-hour forming interval before treating the ATR input as stale.
    H4: 28800
    D1: 172800


# Refresh candleFetchMeta via fetch_candles immediately before risk/guardian on execute/
# quick-execute/scalp-execute so long AI-review waits do not block on stale embedded H1/H4 flags.
QUICK_EXEC_PREFETCH_CANDLE_META: true

# Execution: rebuild candle freshness/consistency + dataFreshness before risk_engine (recommended).
EXECUTION_HYDRATE_CANDLE_QUALITY: true

# MT5 D1: treat small calendar/session gaps (e.g. weekend) as non-blocking for scoring/execution gates.
# Applies to forex, commodities, indices, stocks on MT5; excluded types (default: crypto) stay strict.
MT5_D1_CALENDAR_GAP_GRACE_BUCKETS: 4
MT5_D1_CALENDAR_GAP_EXCLUDE_TYPES: [crypto]

# Deprecated alias (still read if MT5_D1_CALENDAR_GAP_GRACE_BUCKETS removed from YAML merge).
FOREX_D1_MULTI_BUCKET_CALENDAR_GAP_GRACE_BUCKETS: 4

FOREX_SESSION_FILTER: true    # true = London+NY+Asian only; false = 24h (disable for testing)

# Central session contract (session_contract.py) — when true, legacy session
# functions in scoring/forex_scoring/scalp_engine/auto_trader/market_structure
# delegate to classify_session(). When false (default), all legacy paths run
# unchanged.  Flip to true to activate SAST-based multi-asset session windows.
SESSION_QUALITY_ENABLED: false

# Block execution when session_contract classifies quality as "closed" or "avoid".
# Only effective when SESSION_QUALITY_ENABLED is true.
SESSION_EXECUTION_BLOCK_CLOSED: true
SESSION_EXECUTION_BLOCK_AVOID: false

SERVER_TZ_OFFSET_HOURS: 2    # Your local timezone UTC offset - SAST = 2 (GMT+2)


# Forex scoring engine (merged into CONFIG["FOREX_ENGINE"] - see config.py for full defaults)

FOREX_ENGINE:

  # Session multipliers - read by factor_scoring._session_mult() (live) and forex_scoring._session_state() (legacy).

  session_mode: "soft"               # forex_scoring legacy: "soft" = off-session active at reduced mult

  session_soft_multiplier: 0.75      # Off-session (Asian / off-hours) score multiplier

  session_shoulder_enabled: true

  session_shoulder_multiplier: 0.90  # Shoulder hour (±1h of core) score multiplier

  session_shoulder_hours: 1          # Hours either side of core sessions treated as shoulder

MAX_RISK_PER_TRADE: 0.03      # Hard cap 3% per trade

# Keep the base commodity SL cap at config.py's 4%. These narrow overrides are
# for paper-testing volatile commodity subgroups that otherwise reject before
# sizing, while still leaving all unmapped commodities on the stricter cap.
MAX_SL_PCT_SCORE_GROUP_OVERRIDES:
  precious_trackers: 0.10   # XAU/XAG can need wider ATR/structure stops
  base_metals: 0.055        # Zinc/Nickel/Lead/Aluminium slightly above 4%
  energy_oil: 0.08          # WTI/Brent style energy swings
  nat_gas: 0.10
  softs: 0.12               # Cocoa/Coffee/Sugar/Cotton/Corn/Wheat/Soybeans/Cattle:
                            # high-vol softs whose swing-horizon sigma stops run
                            # well past the 4% default. risk_check still sizes
                            # volume from SL distance, so dollar-risk stays capped.
MAX_SL_PCT_SYMBOL_OVERRIDES:
  Gasoline: 0.08

DRAWDOWN_REDUCE_THRESHOLD: 0.10   # Halve size at 10% drawdown

DRAWDOWN_STOP_THRESHOLD: 0.15     # Stop all trading at 15% drawdown from peak equity

# Master switch for drawdown stop + reduce (both off when false). Paper/debug only — not for live.
DRAWDOWN_STOP_ENABLED: true   # fail-closed for broker-capable execution paths

# ── Live-quote freshness observability (Fix #1) ─────────────────────────────
# Per-asset-type maximum live-quote age in seconds. When set, the scanner
# attaches `quoteAgeEval.stale=true` to signals whose live-quote age exceeds
# the threshold. This is observability ONLY — it does NOT block scoring or
# execution. All values null by default (gate disabled per asset type).
# Paper fail-closed live-quote ages (seconds). Scan may still score; risk_engine
# blocks execution when LIVE_PRICE_BLOCK_EXECUTION is true and quote is stale/unknown.
LIVE_PRICE_MAX_AGE_SEC:
  forex: 60
  commodity: 60
  index: 60
  stock: 90
  etf: 90
  crypto: 15
LIVE_PRICE_BLOCK_EXECUTION: true
# UNKNOWN-age blocking OFF 2026-07-09: no producer attaches quoteAgeSec/quoteAgeEval
# to signals yet (ageSec only exists on /api/prices entries), so unknown-age blocking
# rejected 100% of executions (STALE_LIVE_QUOTE:AGE_UNKNOWN, e.g. Dow Jones 10:09).
# Re-enable only after the scan/execution path measures and attaches quote age.
LIVE_PRICE_BLOCK_EXECUTION_ON_UNKNOWN_AGE: false

# ── Broker-side tick age check (Fix #3) ─────────────────────────────────────
# Hard execution guard. When set, mt5_execute / bybit_execute reject the order
# BEFORE order_send / create_market_order if the broker tick timestamp is older
# than the limit. Distinct from LIVE_PRICE which inspects signal quote age.
MAX_BROKER_TICK_AGE_SEC:
  mt5: 5
  bybit: 3

# Per-asset-type MT5 overrides for the gate above. Share CFDs quote far slower
# than forex: measured on ATFX 2026-07-29 inside the HK cash session, #HK0005
# inter-tick gaps ran median 22s / p90 68s / max 78s (80% of gaps > 5s), so the
# flat 5s limit rejected essentially every share-CFD execution
# (BROKER_TICK_STALE). 90s matches LIVE_PRICE_MAX_AGE_SEC.stock and still
# fail-closes on a closed/frozen feed (HK lunch break 1h, overnight ~17h).
# Asset types not listed keep MAX_BROKER_TICK_AGE_SEC.mt5.
MAX_BROKER_TICK_AGE_SEC_BY_ASSET_TYPE:
  stock: 90

# ── Execution-time spread cap (Fix #4) ──────────────────────────────────────
# Per-asset-type ask-bid spread ceiling as a fraction of mid (e.g. 0.001 = 10 bps).
MAX_EXECUTION_SPREAD_PCT:
  forex: 0.0005
  commodity: 0.0015
  index: 0.001
  stock: 0.002
  etf: 0.002
  crypto: 0.002

