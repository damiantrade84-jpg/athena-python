# Athena v3.0 — Tunable thresholds (override CONFIG defaults)
# Edit this file and restart to apply changes — no code deploy needed.

# Per-class D1 ADX trend minimum
ADX_TREND_MIN_CLASS:
  crypto: 15
  forex: 22
  commodity: 25
  stock: 25
  index: 25

# Per-class counter-trend penalty (standardized — Trend Gate already handles direction)
COUNTER_TREND_PEN:
  crypto: -1.0
  forex: -1.0
  commodity: -1.0
  stock: -1.0
  index: -1.0

# Per-class RSI bounds
RSI_BOUNDS:
  crypto:    { ob: 78, os: 22 }
  forex:     { ob: 78, os: 22 }
  commodity: { ob: 78, os: 22 }
  stock:     { ob: 78, os: 22 }
  index:     { ob: 78, os: 22 }

# Per-class backtest macro lookback (D1 bars)
MACRO_LOOKBACK:
  crypto: 15
  forex: 30
  commodity: 50
  stock: 50
  index: 50

# Per-class Weinstein lookback (D1 bars)
WEINSTEIN_LOOKBACK:
  crypto: 60
  forex: 100
  commodity: 150
  stock: 150
  index: 150

# Per-class backtest minimum score (~45% of per-class max)
BT_MIN:
  crypto: 4.0
  commodity: 4.0
  forex: 4.0
  stock: 4.5
  index: 4.0

# Backtest must not alter live pair enable/disable state
BT_AUTO_TOGGLE: false
BT_PERCENTILE_FILTER: false

# Per-class live scan minimum confluence (~55% of per-class max)
MIN_CONFLUENCE_CLASS:
  crypto: 5.0
  commodity: 5.0
  forex: 5.0
  stock: 5.5
  index: 5.0

# Risk settings
RISK_PCT: 0.01
MIN_CONFLUENCE: 7.0
VOLUME_THRESHOLD: 1.5
VOLUME_THRESHOLD_BACKTEST: 1.2

# ── Execution Engine ──────────────────────────────────────
EXECUTION_ENABLED: true       # Enable manual execution via dashboard
AUTO_EXECUTE: false            # Manual click only (no auto-fire)

# ── Auto-Trader ────────────────────────────────────────────
AUTO_TRADE_ENABLED: true           # Start auto-trader on server boot
AUTO_TRADE_MIN_SCORE: 5.5          # Match MIN_CONFLUENCE_CLASS (was 7.0 — too strict)
AUTO_TRADE_MAX_DAILY: 3            # Max auto-executions per day
AUTO_TRADE_MAX_PER_SCAN: 1         # Max per scan cycle
AUTO_TRADE_SCAN_INTERVAL_MIN: 30   # Scan every 30 minutes
MAX_PORTFOLIO_HEAT: 0.06      # 6% total risk across all positions
MAX_OPEN_POSITIONS: 5
MAX_CORRELATED_POSITIONS: 2
SIGNAL_MAX_AGE_SEC: 300       # 5 min freshness window
MAX_RISK_PER_TRADE: 0.03      # Hard cap 3% per trade
DRAWDOWN_REDUCE_THRESHOLD: 0.10   # Halve size at 10% drawdown
DRAWDOWN_STOP_THRESHOLD: 0.15     # Stop all trading at 15% drawdown
# Ranging penalties — halved (ADX vote=0 already penalises, one penalty per condition)
RANGING:
  crypto:
    dead: 14
    dead_pen: 1.5
    choppy: 18
    choppy_pen: 0.5
  forex:
    dead: 16
    dead_pen: 1.5
    choppy: 20
    choppy_pen: 0.5
  commodity:
    dead: 18
    dead_pen: 1.5
    choppy: 23
    choppy_pen: 0.5
  stock:
    dead: 16
    dead_pen: 1.5
    choppy: 21
    choppy_pen: 0.5
  index:
    dead: 16
    dead_pen: 1.5
    choppy: 21
    choppy_pen: 0.5

# Per-class vote weight routing — each indicator weighted where it's strongest
VOTE_WEIGHTS:
  crypto:    { d1_trend: 2.0, h1_ema: 1.0, d1_adx: 1.0, h4_macd: 1.0, h4_oscillator: 0.75, volume: 1.0, funding: 1.0, session: 0.0, h4_fib: 0.5, h1_bb: 1.0, weinstein: 0.0, divergence: 1.0 }
  forex:     { d1_trend: 2.0, h1_ema: 1.0, d1_adx: 1.0, h4_macd: 1.0, h4_oscillator: 1.0, volume: 0.0, funding: 0.0, session: 1.0, h4_fib: 1.0, h1_bb: 0.5, weinstein: 0.0, divergence: 1.0 }
  stock:     { d1_trend: 2.0, h1_ema: 1.0, d1_adx: 1.0, h4_macd: 1.0, h4_oscillator: 1.0, volume: 1.0, funding: 0.0, session: 0.0, h4_fib: 1.0, h1_bb: 1.0, weinstein: 1.0, divergence: 1.0 }
  commodity: { d1_trend: 2.0, h1_ema: 1.0, d1_adx: 1.0, h4_macd: 1.0, h4_oscillator: 1.0, volume: 1.0, funding: 0.0, session: 0.0, h4_fib: 1.0, h1_bb: 1.0, weinstein: 0.5, divergence: 1.0 }
  index:     { d1_trend: 2.0, h1_ema: 1.0, d1_adx: 1.0, h4_macd: 1.0, h4_oscillator: 1.0, volume: 1.0, funding: 0.0, session: 0.0, h4_fib: 1.0, h1_bb: 1.0, weinstein: 0.5, divergence: 1.0 }

# Pair-specific routing. Use this to disable filters that do not help a pair,
# zero out weak votes, or tighten thresholds without touching the whole asset class.
# Valid vote keys: d1_trend, h1_ema, d1_adx, h4_macd, h4_oscillator, volume,
# funding, session, h4_fib, h1_bb, weinstein, divergence
# Valid filter keys: weinstein, session, regime_transition, obv, funding,
# squeeze, mean_revert, btc_bias, divergence_warning
# PAIR_PROFILES:
#   XAU/USD:
#     disable_filters: [obv, session]
#     weight_overrides:
#       h4_fib: 1.5
#       h1_bb: 0.5
#     min_confluence: 5.8
#     bt_min: 4.6
#   EUR/USD:
#     disabled_votes: [volume]
#     disable_filters: [obv]
#     weight_overrides:
#       session: 1.25
#       h1_bb: 0.75
#   BTC/USDT:
#     disable_filters: [mean_revert, squeeze]
#     weight_overrides:
#       funding: 1.25
#       divergence: 0.5
