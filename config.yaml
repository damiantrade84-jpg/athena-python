    disable_filters: [mean_revert]
    weight_overrides:
      funding: 1.25
  SUI/USDT:
    disable_filters: [mean_revert]
  APT/USDT:
    disable_filters: [mean_revert]
  LTC/USDT:
    disable_filters: [mean_revert]
  USD/CHF:
    disable_filters: [obv]
