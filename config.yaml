ENGINE_A_SCAN_A_ONLY_AUTO_GATE_ENABLED: false

AUTO_TRADE_MAX_DAILY: 2            # Live-safe default: max auto-executions per day

AUTO_TRADE_MAX_PER_SCAN: 1         # Max per scan cycle; raise to 2 only with >10 active pairs

