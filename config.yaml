NAKED_ENGINE:

  bos_volume_multiplier: 1.3

  # Order Block displacement lookforward bars per timeframe
  ob_displacement_bars:
    D1: 10
    H4: 6
    H1: 5

  # Zone proximity threshold as multiple of ATR
  zone_proximity_atr_mult:
    default: 0.5

  # D1 PD-array conflict scan distance as a multiple of D1 ATR.
  # Reduced from 3.0 to 1.5 to prevent persistent score drag — 3.0 ATR window
  # caught nearly every pair's opposing D1 OB/FVG, creating a constant -0.25 penalty.
  d1_pd_array_conflict_window_atr_mult: 1.5

  # Rejection trigger wick/body requirement.
  # Default preserves current behavior; lower only after backtest/shadow validation.
  rejection_wick_body_ratio: 1.2

  # D1 PD-array conflict penalty (points deducted from score)
  d1_pd_array_penalty: 0.25

  # Overlay observability (logs / engine_b_overlay / calculate_confidence.engine_b_diagnostics):

  # stable reason codes in market_structure - resistance_too_close, support_too_close,

  # adverse_dxy_correlation, structural_sl_rejected_hard_cap (no extra alpha weights).

  # Per-style min_score thresholds - tune here after backtesting.

  # These override the hardcoded defaults in _naked_scan_style_profile().

  # Hold limits (H4 bars): scalp=12 (48h), intraday=24 (4d), swing=60 (10d)

  # Dashboard: Backtest tab → ENGINE B THRESHOLDS → saves via POST /api/naked-style-thresholds (no restart).

  style_profiles:

    scalp:

      min_score: 4.0

      min_rr: 1.5

      fallback_rr: 2.0

    intraday:

      min_score: 4.0

      min_rr: 1.5

      fallback_rr: 2.0

    swing:

      min_score: 4.0

      min_rr: 2.0

      fallback_rr: 3.0

      require_macro_align:

        forex: false

        crypto: false

        stock: false

        index: false

        commodity: true



  zone_multipliers:

    TRENDING:        {upper: 0.3, lower: 1.0, sl: 1.5}

    RANGING:         {upper: 0.5, lower: 1.2, sl: 1.0}

    HIGH_VOLATILITY: {upper: 0.4, lower: 1.5, sl: 1.8}

    LOW_VOLATILITY:  {upper: 0.2, lower: 0.8, sl: 1.0}


  # ATR buffer inside opposing zones for structural TP selection.
  # Kept separate from zone_multipliers.*.sl so stop width does not suppress tight targets.
  structural_tp_buffer_atr_mult: 0.25


  # Order Block minimum strength (0-100) to count as valid confluence

  # Strength = 60% displacement + 40% volume. Below this = weak/ignored.

  ob_min_strength: 50



  score_group_overrides:

    # min_score is intentionally omitted from every override below — all groups
    # currently calibrate to the base 4.0 floor in style_profiles.* above. Only
    # min_rr and min_room_atr need per-group differentiation here.
