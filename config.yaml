# ── Auto-Trader ────────────────────────────────────────────

AUTO_TRADE_ENABLED: false          # Start auto-trader on server boot

# AUTO_TRADE_MIN_SCORE is informational operator metadata. Engine A scan gates
# are resolved by ENGINE_A_SCORE_GROUP_THRESHOLDS/get_score_threshold(), and
# live auto-execution uses AUTO_TRADE_MIN_CONVICTION on combinedConviction.

# Factor engine (crypto/stock/commodity/index) outputs 0-3.0.

AUTO_TRADE_MIN_SCORE:

  crypto:    2.0

  forex:     2.1

  commodity: 1.8

  stock:     1.8

  index:     1.8    # scan tier remains 1.5; auto score floor adds confirmation gap

# AUTO_TRADE_MIN_CONVICTION is the real live gate used inside auto_trader.py.

# Metric: executionConvictionEffective on a 0-1 scale. When Engine A + B align, the live

# gate gets a 15% discount (effective min = configured min * 0.85).

AUTO_TRADE_MIN_CONVICTION:

  default: 0.50

AUTO_TRADE_A_ONLY_WEIGHT:

  default: 0.60

  crypto: 0.60

# false = scan trade tier means Engine A cleared scan floor and scan blockers.
