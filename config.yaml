# ── External API Keys ────────────────────────────────────────────────
# Legacy vendor key removed.

# ── Auto-Exit ────────────────────────────────────────────────────────
# Automatically close passing trades if their confluence score decays significantly (e.g. drop from 3.0 to 0.0)
AUTO_EXIT_ON_DECAY: false

# ── Engine B (Naked Scalp) ───────────────────────────────────────────
NAKED_ENGINE:
  # Overlay observability (logs / engine_b_overlay / calculate_confidence.engine_b_diagnostics):
  # stable reason codes in market_structure — resistance_too_close, support_too_close,
  # adverse_dxy_correlation, structural_sl_rejected_hard_cap (no extra alpha weights).
  # Per-style min_score thresholds — tune here after backtesting.
  # These override the hardcoded defaults in _naked_scan_style_profile().
  # Hold limits (H4 bars): scalp=12 (48h), intraday=24 (4d), swing=60 (10d)
  # Dashboard: Backtest tab → ENGINE B THRESHOLDS → saves via POST /api/naked-style-thresholds (no restart).
  style_profiles:
    scalp:
      min_score: 3.0
      min_rr: 1.5
      fallback_rr: 2.0
    intraday:
      min_score: 4.0
      min_rr: 1.5
      fallback_rr: 2.0
    swing:
      min_score: 5.0
      min_rr: 2.0
      fallback_rr: 3.0
      require_macro_align:
        forex: false
        crypto: false
        stock: false
        index: false
        commodity: true

  zone_multipliers:
    TRENDING:        {upper: 0.3, lower: 1.0, sl: 1.5}
    RANGING:         {upper: 0.5, lower: 1.2, sl: 1.0}
    HIGH_VOLATILITY: {upper: 0.4, lower: 1.5, sl: 1.8}
    LOW_VOLATILITY:  {upper: 0.2, lower: 0.8, sl: 1.0}

  # Order Block minimum strength (0-100) to count as valid confluence
  # Strength = 60% displacement + 40% volume. Below this = weak/ignored.
  ob_min_strength: 50

  score_group_overrides:
    forex_majors:
      scalp: {min_rr: 1.2}
      intraday: {min_rr: 1.3}
      swing: {min_rr: 1.8}
    forex_crosses:
      scalp: {min_rr: 1.2}
      intraday: {min_rr: 1.3}
      swing: {min_rr: 1.8}
    forex_exotics:
      scalp: {min_room_atr: 0.5, min_rr: 1.2}
      intraday: {min_room_atr: 0.85, min_rr: 1.35}
      swing: {min_room_atr: 1.2, min_rr: 1.8}
    nat_gas:
      scalp: {min_score: 3.0, min_rr: 1.4}
      intraday: {min_score: 4.0, min_rr: 1.6}
      swing: {min_score: 5.0, min_rr: 2.0}
    crypto_doge:
      scalp: {min_score: 3.0, min_room_atr: 0.5, min_rr: 1.3}
      intraday: {min_score: 4.0, min_room_atr: 0.9, min_rr: 1.5}
      swing: {min_score: 5.0, min_room_atr: 1.2, min_rr: 1.9}
    crypto_btc:
      scalp: {min_score: 3.0}
      intraday: {min_score: 4.0}
      swing: {min_score: 5.0}
    crypto_eth:
      scalp: {min_score: 3.0}
      intraday: {min_score: 4.0}
      swing: {min_score: 5.0}
    crypto_alt_majors:
      scalp: {min_score: 3.0}
      intraday: {min_score: 4.0}
      swing: {min_score: 5.0}
    crypto_other:
      scalp: {min_score: 3.0}
      intraday: {min_score: 4.0}
      swing: {min_score: 5.0}
    energy_oil:
      scalp: {min_score: 3.0}
      intraday: {min_score: 4.0}
      swing: {min_score: 5.0}
    precious_trackers:
      scalp: {min_score: 3.0}
