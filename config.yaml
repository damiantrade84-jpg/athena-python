# Athena v3.0 - Tunable thresholds (override CONFIG defaults)

# Edit this file and restart to apply changes - no code deploy needed.



# ── Paper/Demo Soak Mode ────────────────────────────────────────────────────────

# When ENABLED is true, managed execution never calls the broker (paper-only)
# and returns PAPER_SOAK_BLOCKED_REAL_ORDER from run_managed_execution / lifecycle.
#
# For Bybit demo / MT5 demo broker orders without editing tracked config.yaml:
#   1. Copy config.local.example.yaml → config.local.yaml (gitignored).
#   2. Set ATHENA_REAL_ORDERS_CONFIRM=I_UNDERSTAND_REAL_ORDER_RISK in the environment
#      (required whenever real/demo orders are enabled — boot will fail without it).
#
# Or override only on this machine via the same keys in config.local.yaml.

PAPER_SOAK:
  ENABLED: false
  REAL_ORDERS_ALLOWED: true
  LOG_ALL_SIGNALS: true
  LOG_BLOCKED_SIGNALS: true
  LOG_EXECUTION_DECISIONS: true
  REQUIRED_FRESHNESS_GATE: true



# ── Candle depth for analyze_pair / scans (Engine A indicators) ─────────────

# Fetched per TF, then last bar dropped (forming). Must satisfy analyze_pair mins:

# len(d1)>=220, len(h4)>=50, len(h1)>=50 after drop.

# H4/H1/D1 default 1001 means after the forming-bar drop scoring still uses ~1000

# closed bars while charts can keep the live bar for visibility.

# Reduce for lighter scans (EMA on chart vs signal.snap will diverge).

D1_CANDLES: 1001

H4_CANDLES: 1001

H1_CANDLES: 1001

# EODHD bulk last-day URL uses /eod-bulk-last-day/{EXCH}; some suffixes (COMM) are not supported → HTTP 404.
# Those pairs still receive D1 via normal EOD candle fetch; CandleBuilder bulk refresh skips them only.
CANDLE_BUILDER_BULK_D1_SKIP_EXCHANGES: ["COMM"]

SCAN_MAX_WORKERS: 8           # Increased scan concurrency for faster Engine A full-universe runs. (Conservative: 8 for i7/16GB)



# ── News / EODHD sentiment background refresh ────────────────────────────────

# Background loop fetches: economic calendar, sentiment batch only.

# Per-pair news + word-weights are fetched ON-DEMAND when AI analysis is requested.

NEWS_BG_INTERVAL_SEC: 3600    # How often the background news loop runs (seconds). Default 3600 = 1 hour.

NEWS_PAIR_CACHE_TTL_SEC: 14400 # How long per-pair news/word-weights are cached after an AI fetch (seconds). Default 14400 = 4 hours.

BACKTEST_MAX_WORKERS: 10      # Parallel workers for backtesting (Engine A & B). (Conservative: 10 for i7/16GB)
BT_VECTORIZED: true           # Speed path: exact-window indicator caching for Engine A/B backtests (parity-safe target).
ENGINE_B_FAST_FVG_DETECTION: true

SCAN_TIMEOUT_SEC: 45          # Per-pair scan timeout in seconds (faster fail for stalled pairs)

SCAN_DEBUG_CANDLE_META: false # Optional scan/debug payload metadata about candle resolution path.

# Pre-scoring freshness gate: skip indicator calculation when any required TF
# (D1/H4/H1) is stale. Prevents wasted CPU and false signal log entries.
PRE_SCORING_FRESHNESS_GATE_ENABLED: true

# MT5 H4/H1 calendar-gap grace for stock/index/commodity confirmed-only scoring.
# Covers weekends and US off-hours when last confirmed bar legitimately lags.
MT5_INTRADAY_CALENDAR_GAP_GRACE_BUCKETS:
  H4: 30
  H1: 120
  default: 24

# Engine A minimum confirmed bars after market-state split (defaults unchanged).
ENGINE_A_MIN_D1_BARS: 220
ENGINE_A_MIN_H4_BARS: 50
ENGINE_A_MIN_H1_BARS: 50

# Per-TF candle freshness diagnostic (stalenessSeverity, bucketLag, etc.).
# Always populated for production visibility (unlike candleMeta which is debug-only).
CANDLE_FRESHNESS_ENABLED: true

# Crypto-specific D1 staleness threshold: max hours since last D1 bar open before
# blocking scoring. Crypto trades 24/7 but Bybit REST can have delays.
CRYPTO_D1_MAX_STALE_HOURS: 25

THRESHOLD_AUDIT:
  ENABLED: true
  SHADOW_THRESHOLDS:
    ENGINE_A:
      - current
      - current_minus_5pct
      - current_minus_10pct
      - current_minus_15pct
    ENGINE_B:
      - current
      - current_minus_5pct
      - current_minus_10pct
      - current_minus_15pct
    ENGINE_C:
      - current
      - current_minus_5pct
      - current_minus_10pct

# Diagnostic-only Engine A/B calibration telemetry. When enabled it appends
# report rows and must not alter thresholds, scores, gates, or execution
# behavior (see calibration_diagnostics.py).
# Enabled 2026-05-19 for demo calibration collection per final_calibration_decision_report.md
# (PC-RES-001). Gate/threshold overlay proposals remain apply:false.
CALIBRATION_DIAGNOSTICS_ENABLED: true
CALIBRATION_DIAGNOSTICS_PATH: "logs/calibration_diagnostics/calibration_events.jsonl"

# Research-only portfolio/position volatility targeting diagnostics. Disabled
# by default and not used by live order sizing.
RESEARCH_VOL_TARGETING_ENABLED: false
RESEARCH_VOL_TARGET_ANNUALIZED: 0.12
RESEARCH_VOL_TARGET_MAX_MULTIPLIER: 1.50
RESEARCH_VOL_TARGET_MIN_MULTIPLIER: 0.25
RESEARCH_VOL_TARGET_LOOKBACK: 20

# MT5 broker server UTC offset. Change when DST shifts (EET=2, EEST=3).
# Used by fetch_mt5() timezone detection and H4 grid offset derivation.
MT5_BROKER_UTC_OFFSET: 3

# MT5 forex H4 policy grid offset (hours). Derived from broker offset: (24 - broker_offset) % 4.
# GMT+3 → 1h offset (01/05/09/13/17/21 UTC). GMT+2 → 2h (02/06/10/14/18/22 UTC).
# Set to "auto" or remove to let market_state.py compute from MT5_BROKER_UTC_OFFSET.
FOREX_H4_RESAMPLE_OFFSET_HOURS: 1.0

# Read-only diagnostic: log raw MT5 copy_rates H4 bar stamps + the chosen time-shift
# decision (shiftTag) for forex into debug NDJSON, to distinguish broker-stamped
# (GMT+3) unshifted bars from a genuinely lagging feed. No behavior change. Toggle off
# once the forex H4 stale_multi_bucket false-positive cause is confirmed.
MT5_H4_ALIGN_DIAG_ENABLED: true

# Forex H4 one-shot refetch: MT5 can briefly omit the just-closed/forming H4 bar right
# after a boundary, which surfaces as a STALE_DATA_PRE_SCORING:H4 false positive. When
# the newest fetched H4 bar lags 2..MAX_LAG buckets, refetch once (after SLEEP_MS) to
# pick up the missing recent bar. The lag cap keeps weekend / dead-feed gaps from being
# retried. Read-only refetch — does not change gates, scoring, or timestamp handling.
MT5_H4_FETCH_RETRY_ENABLED: true
MT5_H4_FETCH_RETRY_MAX_LAG: 3
MT5_H4_FETCH_RETRY_SLEEP_MS: 400

# Broker candle safety: do not turn MT5 error payloads with Polygon/yfinance
# fallback candles into execution-eligible Engine A candles.
MT5_CANDLE_FALLBACK_ENABLED: false

# Bars older than this vs wall-clock skip tick-TZ heuristic in fetch_mt5 (illiquid exotic guard).
# Code default is 129600 (36 hours) if omitted.
MT5_FETCH_STALE_UNSHIFTED_AGE_SEC: 129600

# MT5 D1 bar-start offset (hours UTC). Duplicate under SCALP_ENGINE for Engine D UX; root wins.
D1_RESAMPLE_OFFSET_HOURS: 0.0

# Crypto paper execution is Bybit; use Bybit public data for Engine A live
# SL/TP ATR and derivative context. Binance fallback is off by default so venue
# basis drift cannot silently size Bybit paper trades.
ENGINE_A_CRYPTO_LEVELS_FEED: bybit
ENGINE_A_CRYPTO_LEVELS_SIGNAL_FEED_FALLBACK: false
ENGINE_A_CRYPTO_DERIVATIVES_FEED: bybit
ENGINE_A_CRYPTO_DERIVATIVES_BINANCE_FALLBACK: true
ENGINE_A_OI_MAX_AGE_SEC: 300
ENGINE_A_BT_OI_MAX_AGE_MS: 86400000
ENGINE_A_CRYPTO_BT_LEVEL_ATR_USE_SIGNAL_FEED: false
# Engine A scoring OHLC: Bybit when paper execution is Bybit (chart parity).
ENGINE_A_CRYPTO_SIGNAL_FEED: bybit
# Crypto late-trend continuation: diagnostics + conservative score multiplier when
# full EMA alignment meets weak ADX, stretched VWAP, and sub-MA H4 volume.
ENGINE_A_CRYPTO_LATE_TREND_DIAGNOSTICS_ENABLED: true
ENGINE_A_CRYPTO_LATE_TREND_ADJUSTMENT_ENABLED: true
ENGINE_A_CRYPTO_ADX_STRONG_THRESHOLD: 25
ENGINE_A_CRYPTO_LATE_TREND_MULT: 0.85
ENGINE_A_CRYPTO_VWAP_EXTENSION_ATR_WARN: 3.0
ENGINE_A_CRYPTO_VOLUME_MA_LOOKBACK: 20
ENGINE_AB_CRYPTO_SIGNAL_FEED: bybit
ENGINE_AB_CRYPTO_SIGNAL_FEED_FALLBACK: false
ENGINE_B_CRYPTO_LEVELS_FEED: bybit
ENGINE_B_CRYPTO_LEVELS_SIGNAL_FEED_FALLBACK: true
ENGINE_B_CRYPTO_BT_LEVEL_ATR_USE_SIGNAL_FEED: false
# Engine B: skip forex signals on 22:00–07:00 UTC (Asian); applies to BT + live scan.
ENGINE_B_FOREX_ASIAN_SESSION_SKIP_ENABLED: true

# Engine B forex session diagnostics. ENABLED only enriches structure payloads;
# SCORE_INFLUENCE_ENABLED must also be true before score adjustment can use it.
ENGINE_B_FOREX_SESSION_STRUCTURE_WEIGHTING:
  ENABLED: true
  SCORE_INFLUENCE_ENABLED: true
  HIGH_QUALITY_BONUS: 0.02
  MEDIUM_QUALITY_BONUS: 0.01
  LOW_QUALITY_PENALTY: -0.02
  LONDON_NY_OVERLAP_BONUS: 0.01
  LIQUIDITY_SWEEP_ACTIVE_SESSION_BONUS: 0.01
  MAX_ABS_SCORE_BONUS: 0.04

ENGINE_B_FOREX_RR_CAN_SATISFY_SPACE_GATE: true
ENGINE_B_RR_CAN_SATISFY_SPACE_GATE:
  default: false
  forex: true
  stock: true
  index: true
  commodity: true
  etf: true
  etf_bond: true
  crypto: true

# Engine B asset-class structure tuning for stocks, indices, commodities, ETFs.
# Enabled here for paper/demo testing; config.py defaults remain fail-closed.
ENGINE_B_ASSET_CLASS_ADJUSTMENTS_ENABLED: true
ENGINE_B_ASSET_CLASS_VOLATILITY_AWARE_ENABLED: true
ENGINE_B_ASSET_CLASS_STRUCTURE_MULT:
  stock: 1.10
  index: 1.05
  commodity: 1.15
  etf: 1.08
  etf_bond: 1.05
ENGINE_B_ASSET_CLASS_BOS_MIN_BREAK_ATR:
  forex: 0.05
  stock: 0.06
  index: 0.05
  commodity: 0.08
  etf: 0.05
  etf_bond: 0.04

# US cash-session structure context for stocks/indices/ETFs.
ENGINE_B_EQUITY_SESSION_STRUCTURE_WEIGHTING:
  ENABLED: true
  SCORE_INFLUENCE_ENABLED: true
  HIGH_QUALITY_BONUS: 0.015
  MEDIUM_QUALITY_BONUS: 0.008
  OFF_HOURS_PENALTY: -0.015
  LIQUIDITY_SWEEP_ACTIVE_SESSION_BONUS: 0.008
  MAX_ABS_SCORE_BONUS: 0.03

BINANCE_KLINE_WS_INTERVALS:
  - "1m"
  - "5m"
  - "15m"
  - "1h"
  - "4h"
  - "1d"



# Per-class D1 ADX trend minimum

ADX_TREND_MIN_CLASS:

  crypto: 18    # raised from 15 (2026-05-10): linear ramp 10→18, full credit at ADX≥18
  crypto_btc: 18
  crypto_eth: 18
  crypto_alt_majors: 18
  crypto_doge: 20
  crypto_other: 20

  forex: 20    # ADX 15-20 gets 0.65× soft penalty in factor_scoring; 20 allows developing trends through
  forex_majors: 20
  forex_crosses: 20
  forex_other: 20
  forex_exotics: 18

  commodity: 25
  nat_gas: 27
  softs: 25

  stock: 25

  index: 25

  etf: 25
  etf_bond: 25

# Per-class ADX hard-fail override.  Global default is 15 (from code).
# Crypto class_min=15 collides with global hard_fail=15 leaving zero soft zone;
# setting crypto to 10 creates a genuine 10-15 soft-penalty band.
FACTOR_ADX_HARD_FAIL_CLASS:
  crypto: 10
  crypto_btc: 10
  crypto_eth: 10
  crypto_alt_majors: 10
  crypto_doge: 10
  crypto_other: 12
  forex: 10
  forex_majors: 10
  forex_crosses: 10
  forex_other: 10
  forex_exotics: 9
  commodity: 10
  nat_gas: 12
  softs: 10
  stock: 10
  index: 10
  etf: 10
  etf_bond: 10

# Engine A fail-safe: when both D1 and H4 ADX are unavailable, block the signal
# instead of assigning the old neutral 0.5 multiplier.
ADX_MISSING_BOTH_ABORT: true

# Funding rate addon: baseline (0.01% per 8h) and noise band half-width.
# Narrowed from 0.0002 to 0.0001 so typical Binance/Bybit funding deviations
# are treated as signal rather than noise.
FACTOR_FUNDING_BASELINE: 0.0001
FACTOR_FUNDING_NOISE_BAND: 0.0001
FACTOR_FUNDING_Z_REF: 2.0
FACTOR_FUNDING_SCALE: 0.0005
FACTOR_OI_REF_PCT: 5.0
FACTOR_OI_USE_SMOOTHED: true

# ── Multi-Exchange Funding Composite (Binance + Bybit) ───────────────────────
# When enabled, fetches funding rates from both Binance and Bybit and composites
# them using a weighted average. This provides a more robust market-wide funding
# signal by reducing single-exchange anomalies. Disabled by default — uses
# Bybit-only with Binance fallback when disabled.
ENGINE_A_MULTI_EXCHANGE_FUNDING:
  ENABLED: true
  BINANCE_WEIGHT: 0.5  # Weight for Binance rate in composite
  BYBIT_WEIGHT: 0.5    # Weight for Bybit rate in composite

# Multiplicative floor inside compute_factor_scores: final_score *= eff_floor + (1-eff_floor)*conviction.
# Not the scanner combinedConviction field (that uses scoreNorm × AUTO_TRADE_A_ONLY_WEIGHT / blend weights).
FACTOR_CONVICTION_FLOOR: 0.20

# Engine A forex session scaler — off by default. When ENABLED, multiplies base_score
# by BY_QUALITY using scoring.get_session() UTC buckets (high/medium/low).
FACTOR_FOREX_SESSION_MULT:
  ENABLED: false
  BY_QUALITY:
    high: 1.0
    medium: 0.95
    low: 0.85

# When the asset class has no addon (stock/index), redistribute the addon's
# weight rather than collapsing it onto momentum.  0.5 splits 50/50 between
# base and momentum, so stock/index conviction becomes 0.35 base + 0.65
# momentum instead of 0.20 base + 0.80 momentum (which made H4 RSI+MACD the
# sole driver).  Code default is 0.0 for backward compat; this YAML override
# is the documented design.
ADDON_UNSUPPORTED_SPLIT_TO_BASE: 0.5

# Engine A score_group/class differentiation. Enabled here for paper/demo
# testing; config.py defaults remain fail-closed.
ENGINE_A_SCORE_GROUP_ADJUSTMENTS_ENABLED: true
ENGINE_A_FACTOR_WEIGHTS_BY_CLASS:
  us_stock_single: { momentum: 0.45, addon: 0.20, base: 0.35 }
  stock_other: { momentum: 0.48, addon: 0.20, base: 0.32 }
  us_indices_trackers: { momentum: 0.50, addon: 0.15, base: 0.35 }
  index_other: { momentum: 0.50, addon: 0.15, base: 0.35 }
  commodity_other: { momentum: 0.45, addon: 0.35, base: 0.20 }
  precious_trackers: { momentum: 0.40, addon: 0.35, base: 0.25 }
  energy_oil: { momentum: 0.40, addon: 0.35, base: 0.25 }
  nat_gas: { momentum: 0.35, addon: 0.35, base: 0.30 }
  # #2 (2026-05-28): crypto/forex previously fell back to code defaults
  # 0.50 / 0.30 / 0.20 (momentum/addon/base) — the addon (crypto funding, forex
  # carry) sat at an unreviewed 0.30. These are asset_type-level entries (caught via
  # _resolve_class_keyed asset_type fallback when no score_group key matches).
  # UNVALIDATED judgment values (NOT n>=30 outcome-backed): cut the slow/weak
  # funding/carry addon 0.30 -> 0.20 and shift it to the trend base (0.20 -> 0.30),
  # mirroring the low-addon stance equities already take. Reversible: delete these
  # two rows to restore the 0.50 / 0.30 / 0.20 code defaults.
  crypto: { momentum: 0.50, addon: 0.20, base: 0.30 }
  forex:  { momentum: 0.50, addon: 0.20, base: 0.30 }

# -- Orthogonal-factor vote vector (v13) --------------------------------------
# Replaces the single capped _asset_addon scalar with independent weighted votes.
# Each factor outputs a vote in [-1,+1]; votes are weighted-summed then squashed
# ONCE (tanh) into the conviction's orthogonal term. Master flag falls back to the
# legacy single-addon behaviour when false (for A/B backtesting).
# WEIGHTS ARE UNVALIDATED JUDGMENT VALUES (NOT n>=30 outcome-backed). Reversible.
ENGINE_A_ORTHO_VOTE_ENABLED: false   # flip to true only for the A/B backtest run

# Per-asset-class factor weights. Missing factor => weight 0 (factor not voted).
# Sum need NOT equal 1; the squash handles magnitude. Tune individually.
ENGINE_A_ORTHO_FACTOR_WEIGHTS:
  forex:
    carry: 0.35        # FRED rate differential (get_carry_z)
    cot: 0.40          # CFTC speculator positioning (get_cot_z) - NEW for forex
    vol_skew: 0.00     # n/a for forex (no listed-option skew feed)
  crypto:
    funding: 0.45      # perp funding extreme (mean-reverting fade)
    oi_divergence: 0.35 # OI vs price divergence (conviction/exhaustion)
    carry: 0.00        # n/a
    cot: 0.10          # BTC/ETH CME COT (light - already in cot_feed)
  # Per-crypto score-group weights are UNVALIDATED starting points for A/B only.
  # BTC improved at the v13 crypto weights; SOL/alt-majors regressed, so dial down.
  crypto_btc:
    funding: 0.45
    oi_divergence: 0.35
    cot: 0.15          # BTC has real CME COT
  crypto_eth:
    funding: 0.45
    oi_divergence: 0.35
    cot: 0.15
  crypto_alt_majors:
    funding: 0.25
    oi_divergence: 0.20
    cot: 0.00          # no CME COT for alts
  crypto_doge:
    funding: 0.20
    oi_divergence: 0.20
    cot: 0.00
  crypto_other:
    funding: 0.25
    oi_divergence: 0.20
    cot: 0.00
  commodity:
    cot: 0.45          # managed-money positioning (gold/silver crowded-long)
    carry: 0.00
    vol_skew: 0.30     # GVZ / term-structure (NEW - gold)
  index:
    cot: 0.30          # futures-proxy positioning
    carry: 0.20        # 10Y yield risk signal (existing inverted carry)
    vol_skew: 0.30     # VIX term structure (NEW)
  stock:
    cot: 0.20
    vol_skew: 0.25     # options skew proxy if available, else 0 at runtime

# Squash steepness for the weighted vote sum -> [-1,+1]. Higher = more saturating.
ENGINE_A_ORTHO_VOTE_TANH_K: 1.0

# Optional per-bar orthogonal vote diagnostics. Debug only; never enable by default.
ENGINE_A_ORTHO_VOTE_DEBUG: false
ENGINE_A_ORTHO_VOTE_DEBUG_PATH: tmp/ortho_votes.jsonl

# The orthogonal block's contribution weight inside conviction (replaces addon_w
# ONLY when ortho enabled). Keep modest; trend/momentum still dominate.
ENGINE_A_ORTHO_CONVICTION_WEIGHT_BY_CLASS:
  forex: 0.22
  crypto: 0.25
  commodity: 0.35
  index: 0.22
  stock: 0.20

# FRED-backed options/volatility regime feed for vol_skew orthogonal vote.
# Positive z = elevated/backwardated vol (risk-off), used only as confluence.
ENGINE_A_VOL_SKEW_Z_WINDOW: 252
ENGINE_A_VOL_SKEW_TERM_WEIGHT: 0.3
ENGINE_A_VOL_SKEW_REFRESH_TTL_HOURS: 24

ENGINE_A_DIRECTIONAL_RAMP_BY_CLASS:
  crypto_btc: { min_directional: 0.20, soft_span: 0.30 }
  crypto_eth: { min_directional: 0.20, soft_span: 0.30 }
  crypto_alt_majors: { min_directional: 0.20, soft_span: 0.30 }
  crypto_doge: { min_directional: 0.22, soft_span: 0.28 }
  crypto_other: { min_directional: 0.24, soft_span: 0.26 }
  forex_majors: { min_directional: 0.25, soft_span: 0.20 }
  forex_crosses: { min_directional: 0.25, soft_span: 0.20 }
  forex_other: { min_directional: 0.25, soft_span: 0.20 }
  forex_exotics: { min_directional: 0.22, soft_span: 0.22 }
  stock: { min_directional: 0.30, soft_span: 0.20 }
  index: { min_directional: 0.28, soft_span: 0.18 }
  commodity: { min_directional: 0.28, soft_span: 0.25 }
  us_stock_single: { min_directional: 0.32, soft_span: 0.18 }
  nat_gas: { min_directional: 0.25, soft_span: 0.30 }
ENGINE_A_ADDON_UNSUPPORTED_SPLIT_BY_CLASS:
  stock: 0.55
  index: 0.60
ENGINE_A_CONVICTION_FLOOR_BY_CLASS:
  # Forex uses the 0-3 Engine A scale with strict 2.1 majors/crosses floors.
  # Keep the threshold strict, but restore the old forex score reachability by
  # applying the conviction-floor blend only for forex groups.
  forex: 0.60
  forex_majors: 0.60
  forex_crosses: 0.60
  forex_other: 0.60
  forex_exotics: 0.55
  stock: 0.22
  index: 0.24
  commodity: 0.20
  # #5 (2026-05-28): explicit crypto floor so the one previously-implicit floor is
  # auditable. UNVALIDATED judgment value (not n>=30 evidence-backed): set below
  # equities (0.20-0.24) because crypto momentum is noisier, above the pure-regime
  # 0.10 default. crypto is regime-sensitive (below) so noisy regimes still reduce it.
  crypto: 0.15

# #4 (2026-05-28): classes whose explicit conviction floor still yields to the
# RANGING / HIGH_VOLATILITY reduction (see factor_scoring._apply_regime_floor_sensitivity).
# Forex is intentionally absent: its strict flat floor (0.55-0.60) is kept for score
# reachability. This restores noisy-regime skepticism for stock/index/commodity/crypto
# whose flat floor previously clobbered it. Reversible: empty the list to revert to
# the pre-2026-05-28 "explicit floor always wins" behavior.
ENGINE_A_CONVICTION_FLOOR_REGIME_SENSITIVE_CLASSES:
  - crypto
  - stock
  - index
  - commodity

ENGINE_A_ADX_SOURCE_BY_CLASS:
  # Forex H4 trends frequently lead D1 ADX. Use the stronger D1/H4 ADX value
  # for Engine A forex scoring while preserving d1_first default elsewhere.
  forex: max
  forex_majors: max
  forex_crosses: max
  forex_other: max
  forex_exotics: max

ENGINE_A_DI_ALIGNMENT_MULT_BY_CLASS:
  # DI is a lagging H4 pressure check. Keep it as a forex penalty, but do not
  # let a normal pullback cut Engine A scores by 50-70% after the trend gate
  # already passed.
  forex:
    missing: 1.0
    balanced: 0.85
    opposed: 0.65

# ── 2026 Engine A Group Calibration Review — Indicator Periods ────────────────
# These maps extend the proven ENGINE_A_*_BY_CLASS resolver pattern (see
# factor_scoring.py _resolve_class_keyed + _engine_a_group_adjustments_enabled)
# to the core periods that feed Factor 1 (EMA trend) and Factor 2 (RSI/MACD momentum).
#
# #1 (2026-05-28): EMA trend/momentum + RSI periods are now velocity-TIERED.
# These are UNVALIDATED judgment values (NOT n>=30 outcome-backed) — directional
# starting points, not fitted optima. Rationale:
#   FAST  (crypto, 24/7 high velocity): shorter EMA 18/40 + RSI 12 → fresher signal.
#   SLOW  (forex majors/crosses/other): longer EMA 26/60 + RSI 18 → smoother, fewer
#         range whipsaws; forex_exotics a touch faster (24/55, RSI 16).
#   SLOW+ (bond_tlt): EMA 34/80, RSI 21 (RSI 21 was the one pre-existing tuned value).
#   STANDARD (equities, indices, most commodities): historical 21/200/50, RSI 14.
# DELIBERATELY HELD UNIVERSAL (too high-interaction / least justified to guess):
#   - EMA "long" anchor stays 200 everywhere (structural reference, not a tuning knob).
#   - ENGINE_A_MACD_PARAMS_BY_CLASS stays 12/26/9 for every group.
# Promote evidence-backed values via tools/vectorbt_research_lab.py + the overlay.
# Reversible: reset a row to the STANDARD values to revert that group.
#
# Every get_pair_score_group() result must have an explicit entry.
# "default" is only for forward-compat unknown groups.
ENGINE_A_EMA_PERIODS_BY_CLASS:
  default:               { trend: 21, long: 200, momentum: 50 }
  forex_majors:          { trend: 26, long: 200, momentum: 60 }
