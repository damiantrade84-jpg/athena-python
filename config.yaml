    RANGING:
      fvg_confluence: 1.15
      ob_confluence: 1.10
      bos_followthrough: 0.95
    TRENDING:
      bos_followthrough: 1.15
      volume_confirmation: 1.10
      fvg_confluence: 0.95
    HIGH_VOLATILITY:
      liquidity_proximity: 1.10
      ob_confluence: 1.05
    LOW_VOLATILITY:
      bos_followthrough: 0.90

