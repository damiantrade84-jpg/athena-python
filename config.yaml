# ── Crypto Engine B Target Selection Model ───────────────────────────────────

# Crypto-specific target selection to improve RR by using major H4 liquidity zones.

# Default false to preserve existing behavior until explicitly enabled.

# Legacy ENGINE_B_CRYPTO_* keys (target_v2, trigger_profile, M15/M5 entry,
# taker pressure) were dormant for the entire history of this codebase and
# have been removed along with their gated code paths. Engine B now uses the
# unified asset+style TF matrix (resolve_engine_b_tfs) for every asset class.

# ── Engine B Breakout Follow-Through Factor ────────────────────────────────
# Detects false breakouts by checking if price continues in the breakout
# direction for 2-3 bars after BOS/CHoCH/Sweep.
# +1.5 = strong follow-through | -0.5 = suspected liquidity trap
ENGINE_B_FOLLOW_THROUGH:
  ENABLED: true
  DIAGNOSTICS_ENABLED: true
  BLOCK_ENTRY_ON_TRAP: true
  MAX_BONUS: 1.5
  MIN_PENALTY: -0.5
# When trigger series may include a forming bar, evaluate follow-through/trap
# on confirmed bars only (drop newest bar). Default true — edge protection.
ENGINE_B_FOLLOW_THROUGH_CONFIRMED_ONLY: true

# Structure gate: when micro+macro both oppose, require MTF BOS (not lone sweep/BOS).
ENGINE_B_STRUCTURE_REQUIRE_ALIGN_OR_BOS_MTF: true
# Open-air room (no opposing wall): require H1+H4 trend alignment + BOS.
ENGINE_B_ROOM_NO_WALL_REQUIRE_MTF: true
# Shared pre-score volatility gate used by full scan, naked scan, and Engine C.
ENGINE_B_LOW_VOLATILITY_GATE_ENABLED: true
ENGINE_B_LOW_VOLATILITY_LOOKBACK: 50
ENGINE_B_LOW_VOLATILITY_MIN_ATR_RATIO: 0.6
# DXY gate is wired but opt-in. A group override with macro_required also activates it.
ENGINE_B_DXY_MACRO_GATE_ENABLED: false
ENGINE_B_MACRO_CORRELATION_WINDOW: 60
# Macro correlation short history fails closed when macro_required for the group.
ENGINE_B_MACRO_SHORT_HISTORY_FAIL_CLOSED: true
ENGINE_B_CHOCH_INVALIDATION_BARS: 5
# Independent-direction vote threshold (|score_ratio| must exceed this).
ENGINE_B_INDEPENDENT_DIRECTION_SCORE_THRESHOLD: 0.15
# Zone peak find_peaks distance by structure TF (was hardcoded 5).
ENGINE_B_ZONE_PEAK_DISTANCE:
  H1: 3
  H4: 5
  D1: 5

# ── Lower-TF Shadow Diagnostics (Engine B + ASE) ────────────────────────────
# DIAGNOSTIC ONLY. When enabled, Engine B and ASE report read-only M30/M15/M5
# trend/alignment/freshness context on their signal payloads. These fields NEVER
# affect signal direction, confidence, eligibility, ranking, SL/TP, sizing,
# autotrade, or execution — the production scan engines still consume D1/H4/H1
# only. A missing lower TF is reported (BLOCKED), never substituted with H1.
# Forming candles are reported, never treated as closed. See lower_tf_shadow.py.
# Default OFF: when disabled, scan output is byte-for-byte identical.
LOWER_TF_SHADOW:
  enabled: false
  tfs: ["M30", "M15", "M5"]
  apply_to: ["engine_b", "ase"]
  diagnostic_only: true

# ── Engine D Volume Divergence Detection ────────────────────────────────────
# Detects hidden institutional positioning via tick volume divergence.
# Bearish: price new high + volume declining = distribution
# Bullish: price new low + volume holding/rising = accumulation



# Engine B BT level resolution: BT now consumes conf_data.execution_sl /
# execution_tp directly (live parity), via market_structure.resolve_engine_b_execution_levels.
# Legacy ENGINE_B_BT_SL_MODE flag removed.

# ENGINE_B_BT_STRUCTURE_GATE_ENABLED removed: the structure gate is mandatory
# in live and the backtest must not have a private bypass that breaks parity.

# Engine B live scan structure gate:
# false = disable the structure_ok gate in live calculate_confidence() (same as BT experiment).
# Live scan, AI review, and execution all consume this key.
ENGINE_B_STRUCTURE_GATE_ENABLED: true
# false = space/room gate is non-blocking (still computed for diagnostics).
# Does not bypass freshness, structure, location, trigger, or SL/TP side checks.
ENGINE_B_SPACE_GATE_ENABLED: true
# false = Engine B min-RR (rr_ok) is non-blocking at scan; risk_engine also
# skips RR_BELOW_MINIMUM for Engine B execution signals. SL/TP must still exist.
ENGINE_B_RR_GATE_ENABLED: true
# false = risk_engine skips RR_BELOW_MINIMUM for non-Engine-B (Engine A) signals.
ENGINE_A_RR_GATE_ENABLED: false
# Diagnostic-only: retarget Engine B trigger detection onto style_profile.entry_tf
# (H1/M30/M15/M5) when true. Default false — production trigger stays matrix H1.
# Does not change struct/zone TFs. Experiment harness bypasses this flag.
ENGINE_B_DIAGNOSTIC_TRIGGER_TF_ENABLED: false
# Conditional M5 (timeframe_policy M5Policy.CONDITIONAL) requires the setup rung
# to have armed a direction-aligned trigger before the M5 entry event counts.
# false grants bare M5 authority, which the policy contract does not permit.
ENGINE_B_M5_REQUIRE_SETUP_ARMED: true
# VOLATILITY_SCALER_BANDS is calibrated on H4 ATR%; rescale structural (H1/H4)
# and D1 ATR% to that reference before banding. false = raw comparison (legacy).
ENGINE_B_VOLATILITY_BAND_TF_NORMALIZATION: true
# Diagnostic-only: retarget Engine A V3 entry TF onto H1/M15/M30 when true.
# Default false — production entry stays H1/H4/D1. Experiment harness bypasses.
ENGINE_A_DIAGNOSTIC_ENTRY_TF_ENABLED: false
# Under an authoritative timeframe policy, Engine A's trend-layer weights come
# from ENGINE_A_SCORING_PROFILE (per-group/per-style, D1-led) while the policy
# decides only which timeframe fills each role slot. false restores the flat
# policy-role table (regime .18 / bias .37 / structure .45), which inverts every
# configured stack and discards per-group weighting.
ENGINE_A_POLICY_TREND_WEIGHTS_FROM_PROFILE: true
# Momentum anchor under an authoritative policy. "profile" keeps the configured
# momentum_tf (H4; D1 for bond_tlt). "policy_trigger" anchors momentum and the
# ADX hard-abort gate on the policy trigger rung (M5/M15/M30). Either way the
# trigger rung's momentum is reported as factorDiagnostics.triggerEvidence.
ENGINE_A_MOMENTUM_ANCHOR: profile
# When true, Engine A full-scan *trade* tier requires Engine B confirmation (enginesAligned).
# Default false: Engine A and B are independent on scan; use Engine C for combined verdict.
ENGINE_B_SCAN_CONFIRMATION_GATE_ENABLED: false
# Scan-only engine isolation: Engine B selects direction from its own structure
# evidence before Engine A/B alignment is calculated.
ENGINE_B_SCAN_INDEPENDENT_DIRECTION_ENABLED: true
# When both LONG and SHORT pass gates, require this score gap before emitting.
# 0.0 = disabled (legacy max-score pick).
ENGINE_B_DIRECTION_MIN_SCORE_GAP: 0.5
# Block emit when independent structural opinion strongly opposes chosen side.
ENGINE_B_DIRECTION_INDEPENDENT_CONFLICT_GUARD_ENABLED: true
ENGINE_B_DIRECTION_INDEPENDENT_CONFLICT_MIN_CONFIDENCE: HIGH
# Scan-only paper/demo diagnostics: passed B-only setups surface as watchlist
# rows instead of disappearing behind Engine A's scan tier. No execution bypass.
ENGINE_B_SCAN_B_ONLY_WATCHLIST_ENABLED: true
ENGINE_B_STRUCTURE_READY_WATCHLIST:
  ENABLED: true
  MIN_SCORE_RATIO: 0.85
  REQUIRE_TRIGGER_MISSING: true
  REQUIRE_STRUCTURE_OK: true
  REQUIRE_LOCATION_CONTEXT: true
  FOREX_GATE_NEAR_MISS_ENABLED: true
  ASSET_GATE_NEAR_MISS_ENABLED: true
  FOREX_MIN_GATE_CONFIRMATIONS: 3
# Default OFF — Engine A scan rows always keep their Engine A SL/TP1/TP2.
# Engine B execution levels are kept in engine_b_execution_* overlay fields.
# Even when set to true, scanner._apply_engine_b_scan_levels only writes
# generic SL/TP for Engine B-only rows (or Engine C rows that explicitly
# select B execution levels).
ENGINE_B_USE_EXECUTION_LEVELS_FOR_SCAN_SIGNALS: false

# Engine A minimum stop width in ATR. When true, ENGINE_A_V3_STRUCTURAL_SL_FLOOR_ATR_MULT
# participates in the minimum stop distance in engine_a_v3/levels.py; the binding
# value is max(ENGINE_A_V3_STRUCTURAL_GEOMETRY.SL_MIN_ATR_MULT, that floor). With
# the shipped 0.8 vs 0.35 the floor never binds — set a BY_ASSET SL_MIN_ATR_MULT
# below 0.35 to make it active. False removes the floor from that maximum.
#
# NOTE: this key was once documented as controlling an Engine B structural-SL
# overlay on Engine A rows. That overlay (indicators.select_overlay_sl) had no
# production caller and was removed 2026-07-25 — Engine A V3 builds its own stop
# and never reads an Engine B structural SL. This key only does the above.
ENGINE_A_STRUCTURAL_SL_FLOOR_ATR: true


