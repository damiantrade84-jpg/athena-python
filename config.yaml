ENGINE_B_WEIGHTED_SCORING:
  ENABLED: true
  # COMPONENT_WEIGHTS sums to 1.0 and is the weight table. Subscores are already
  # 0-1, so multiplying by COMPONENT_MAX applied a second, undeclared weight:
  # bos_followthrough (0.16 declared x 1.5 max) became 23.2% effective, above
  # structure_alignment's 21.3%, while session_context (0.05 x 0.5) fell to 2.4%.
  # false = COMPONENT_WEIGHTS alone. Reversible: set true for legacy behaviour.
  APPLY_COMPONENT_MAX: false
  # Drop quality components no feed can supply for the asset class (orderflow on
  # stock/index/ETF, session_context outside forex/equity, volume on spot FX)
  # instead of scoring them 0 with their weight still in the denominator.
  # Components that are merely zero this bar are NOT pruned. Reversible: false.
  PRUNE_INAPPLICABLE_COMPONENTS: true
  # Retained for APPLY_COMPONENT_MAX: true only; ignored otherwise.
  COMPONENT_MAX:
    structure_alignment: 1.0
    ob_confluence: 1.0
    fvg_confluence: 1.0
    liquidity_proximity: 0.75
    bos_followthrough: 1.5
    volume_confirmation: 1.0
    profile_reaction: 1.0
    session_context: 0.5
    orderflow: 1.0
  COMPONENT_WEIGHTS:
    structure_alignment: 0.22
    ob_confluence: 0.14
    fvg_confluence: 0.12
    liquidity_proximity: 0.08
    bos_followthrough: 0.16
    volume_confirmation: 0.08
    profile_reaction: 0.10
    session_context: 0.05
    orderflow: 0.05
