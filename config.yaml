MAX_SIGNAL_DRIFT_ATR_MULT:
  forex: 0.25
  commodity: 0.25
  index: 0.25
  stock: 0.25
  etf: 0.25
  crypto: 0.25

DATA_FRESHNESS_GATES:
  WARN_ON_STALE_SCAN: true
  BLOCK_EXECUTION_ON_STALE: true
  BLOCK_TIMEFRAMES:
    - M5
    - M15
    - M30
    - H1
    - H4
    - D1
  BLOCK_SEVERITIES:
    - missing_current_bucket
    - stale_1_bucket
    - stale_multi_bucket
    - error_path_mismatch
    - error_offset_mismatch

# When true, analyze_pair / Engine D set signal["executable"]=false if data freshness blocks execution.
SIGNAL_EXECUTABLE_FALSE_WHEN_FRESHNESS_BLOCKS: true

# Engine B forming-bar policy (intentional split — not a bug):
# - ENGINE_B_STRIP_FORMING_STRUCT: strips the live/forming bar from structure TF candles
#   (BOS/CHoCH/sequence) via market_structure._engine_b_confirmed_only_struct_candles.
# - ENGINE_B_USE_FORMING_FOR_TRIGGER: when true, include the live forming bar in
#   freshness/advisory entry context. Production trigger-pattern detection still
#   receives the separate confirmed-only series. Gate current_price remains
#   live-quote based and independently freshness-checked.
# - ENGINE_B_FOLLOW_THROUGH_CONFIRMED_ONLY: when true, follow-through/trap scoring drops the
#   newest (forming) bar even if trigger series includes it — confirmed-only FT policy.
# - ENGINE_B_USE_FORMING_FOR_STRUCTURE: chart-overlay label only (routes_market_data); does NOT
#   control structure stripping — use ENGINE_B_STRIP_FORMING_STRUCT for that.
ENGINE_B_STRIP_FORMING_STRUCT: true
# Fail-closed: skip Engine B structure scoring when role TF candles are stale (mirrors Engine A pre-scoring gate).
ENGINE_B_SCAN_FRESHNESS_GATE: true
# MT5 equity CFDs (stock/etf/etf_bond) lag ~1 M15 bucket on the broker feed, so
# under the M15 trigger TF the whole US equity/ETF universe was hard-blocked on
# the entry-TF freshness gate every scan. The executable price is guarded
# separately by the live-quote gate (LIVE_PRICE_MAX_AGE_SEC stock/etf = 90s), so
# a one-bucket-stale signal bar is tolerated for these MT5 groups only.
# stale_multi_bucket / missing still fail closed. Set false to restore the strict
# entry-TF gate for equities.
ENGINE_B_ENTRY_TF_ALLOW_MT5_EQUITY_STALE_1: true
ENGINE_B_STRUCT_CONFIRMED_MIN_BARS: 20
ENGINE_B_SWEEP_LOOKBACK_BARS: 5
ENGINE_B_ALLOW_SYNTHETIC_FALLBACK_RR_TP: true
ENGINE_B_ENFORCE_MAX_SL_PCT: true
# Bybit linear perps: TP trigger must be >= ~10% of mark (retCode 10001 otherwise).
BYBIT_MIN_TP_PCT_OF_MARK: 0.10
MAX_TP_PCT:
