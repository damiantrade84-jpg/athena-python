# Athena v3.0 — Tunable thresholds (override CONFIG defaults)
# Edit this file and restart to apply changes — no code deploy needed.

# ── Candle depth for analyze_pair / scans (Engine A indicators) ─────────────
# Fetched per TF, then last bar dropped (forming). Must satisfy analyze_pair mins:
# len(d1)>=220, len(h4)>=50, len(h1)>=50 after drop.
# H4/H1/D1 default 1001 means after the forming-bar drop scoring still uses ~1000
# closed bars while charts can keep the live bar for visibility.
# Reduce for lighter scans (EMA on chart vs signal.snap will diverge).
D1_CANDLES: 1001
H4_CANDLES: 1001
H1_CANDLES: 1001
SCAN_MAX_WORKERS: 3           # Match the code default; higher values on this machine have caused UI/browser lag during scans.

# ── News / EODHD sentiment background refresh ────────────────────────────────
# Background loop fetches: economic calendar, sentiment batch only.
# Per-pair news + word-weights are fetched ON-DEMAND when AI analysis is requested.
NEWS_BG_INTERVAL_SEC: 3600    # How often the background news loop runs (seconds). Default 3600 = 1 hour.
NEWS_PAIR_CACHE_TTL_SEC: 14400 # How long per-pair news/word-weights are cached after an AI fetch (seconds). Default 14400 = 4 hours.
BACKTEST_MAX_WORKERS: 8       # Parallel workers for backtesting (Engine A & B). Increase for faster backtests.
SCAN_DEBUG_CANDLE_META: false # Optional scan/debug payload metadata about candle resolution path.
FOREX_H4_RESAMPLE_OFFSET_HOURS: 1   # EURAUD/TradingView-aligned forex H4 grid: 01/05/09/13/17/21 UTC

# Per-class D1 ADX trend minimum
ADX_TREND_MIN_CLASS:
  crypto: 15
  forex: 25    # Wilder (1978): ADX > 25 = trending; was 40 (too strict, missed most trends)
  commodity: 25
  stock: 25
  index: 25

# Per-class counter-trend penalty (standardized — Trend Gate already handles direction)
COUNTER_TREND_PEN:
  crypto: -1.0
  forex: -1.0
  commodity: -1.0
  stock: -1.0
  index: -1.0

# Per-class RSI bounds
# Crypto: 80/20 — PMC9920669 (2023) + practitioner consensus; BTC/alts regularly sustain
#   RSI 70–90 in bull markets — standard 70/30 causes premature false-reversal warnings.
# Commodity: 80/20 — gold/silver specific research (Metalorix, Kinesis, OpoFinance);
#   precious metals frequently hold RSI 70–80 during trending phases; 70/30 over-signals.
# Forex/stock/index: 70/30 — Wilder standard; well-supported by backtesting literature.
RSI_BOUNDS:
  crypto:    { ob: 80, os: 20 }
  forex:     { ob: 70, os: 30 }
  commodity: { ob: 80, os: 20 }
  stock:     { ob: 70, os: 30 }
  index:     { ob: 70, os: 30 }

# Per-class backtest macro lookback (D1 bars)
MACRO_LOOKBACK:
  crypto: 15
  forex: 30
  commodity: 50
  stock: 50
  index: 50

# Per-class Weinstein lookback (D1 bars)
WEINSTEIN_LOOKBACK:
  crypto: 60
  forex: 100
  commodity: 150
  stock: 150
  index: 150

# Engine A backtest score gate (get_score_threshold in scoring.py).
# BACKTEST_USE_BT_MIN_THRESHOLDS true = backtest uses pair bt_min → BT_MIN_GROUP → BT_MIN.
# false = backtest mirrors live MIN_CONFLUENCE_* (parity). Live scans always use live gates.
# RESEARCH_MODE also enables the BT chain (legacy); prefer BACKTEST_USE_BT_MIN_THRESHOLDS.
RESEARCH_MODE: false
BACKTEST_USE_BT_MIN_THRESHOLDS: false
BT_MIN:
  crypto:    0.95
  commodity: 0.90
  forex:     0.85      # was 1.50; scaled to match live 0.95 (BT/live ~89%)
  stock:     0.90
  index:     0.85

BT_MIN_GROUP:
  # Values proportionally scaled to match MIN_CONFLUENCE_GROUP restore (maintains BT/live ratio).
  # Dormant while BACKTEST_USE_BT_MIN_THRESHOLDS: false — future-proofed for re-enable.
  forex:
    forex_majors: 0.75     # was 1.50; scaled with live (0.85 × ~89%)
    forex_crosses: 0.85     # was 1.55; scaled with live (0.95 × ~89%)
    forex_exotics: 0.95     # was 1.65; scaled with live (1.05 × ~90%)
  crypto:
    crypto_btc: 0.94      # was 0.81 × 1.167 (maintains ~74% BT/live ratio)
    crypto_eth: 0.98      # was 0.84 × 1.167
    crypto_alt_majors: 1.05  # was 0.90 × 1.167
    crypto_doge: 0.96     # unchanged — no MIN_CONFLUENCE_GROUP counterpart
    crypto_other: 1.05    # was 0.90 × 1.167
  commodity:
    nat_gas: 0.87
    pgm_metals: 0.84
    copper: 0.81
    precious_trackers: 1.00  # was 0.78 × 1.273 (precious_trackers live gate restored)
    energy_oil: 0.75
    commodity_other: 0.85
  index:
    asian_indices: 0.87
    us_indices_trackers: 0.81
    eu_indices: 0.78
    index_other: 0.80
  stock:
    us_stock_single: 1.25  # was 0.90 × 1.409 (maintains ~81% BT/live ratio)
    smallcap_em_etf: 1.13  # was 0.80 × 1.409
    bond_tlt: 1.00         # was 0.70 × 1.409
    stock_other: 1.20      # was 0.85 × 1.409

# Backtest must not alter live pair enable/disable state
BT_AUTO_TOGGLE: false
BT_PERCENTILE_FILTER: false

# ── Engine B (Naked Market Structure) thresholds ──────────────────────────────
# Engine B min_score per style is set in NAKED_ENGINE.style_profiles below (scalp/intraday/swing).
# Both backtest and live scan read from _naked_scan_style_profile() — single source of truth.
# NAKED_MAX_DAILY: Max Engine B trades per pair per day (live auto-trade cap)
NAKED_MAX_DAILY: 3


# ── Engine C Backtest Exit Controls ─────────────────────────────────────────────
# PHASE 3: Explicit config for Engine C BT MAX_HOLD and BE parameters (was hardcoded)
# Defaults match current hardcoded behavior in backtest_runner.py
ENGINE_C_BT_EXIT:
  forex:
    intraday:
      max_hold_bars: 30      # H4 bars for intraday style
      be_arm_rr: 1.5         # BE triggers at 1.5R
      be_min_target_rr: 2.0  # BE only arms if target RR >= this
    swing:
      max_hold_bars: 60      # H4 bars for swing style
      be_arm_rr: 1.5
      be_min_target_rr: 2.0
    scalp:
      max_hold_bars: 12      # H4 bars for scalp style
      be_arm_rr: 1.5
      be_min_target_rr: 2.0
  crypto:
    intraday:
      max_hold_bars: 40
      be_arm_rr: 1.5
      be_min_target_rr: 2.0
    swing:
      max_hold_bars: 80
      be_arm_rr: 1.5
      be_min_target_rr: 2.0
    scalp:
      max_hold_bars: 12
      be_arm_rr: 1.5
      be_min_target_rr: 2.0
  stock:
    intraday:
      max_hold_bars: 24
      be_arm_rr: 1.5
      be_min_target_rr: 1.5
    swing:
      max_hold_bars: 50
      be_arm_rr: 1.5
      be_min_target_rr: 1.5
    scalp:
      max_hold_bars: 8
      be_arm_rr: 1.5
      be_min_target_rr: 1.5
  commodity:
    intraday:
      max_hold_bars: 24
      be_arm_rr: 1.5
      be_min_target_rr: 1.8
    swing:
      max_hold_bars: 50
      be_arm_rr: 1.5
      be_min_target_rr: 1.8
    scalp:
      max_hold_bars: 10
      be_arm_rr: 1.5
      be_min_target_rr: 1.8
  index:
    intraday:
      max_hold_bars: 24
      be_arm_rr: 1.5
      be_min_target_rr: 1.8
    swing:
      max_hold_bars: 50
      be_arm_rr: 1.5
      be_min_target_rr: 1.8
    scalp:
      max_hold_bars: 10
      be_arm_rr: 1.5
      be_min_target_rr: 1.8


# Per-class live scan minimum confluence — execute / tradeSignals tier threshold.
# Forex: forex_scoring 0–2.0 (true max ~1.97). Non-forex: factor engine (true bounded 0–3.0).
MIN_CONFLUENCE_CLASS:
  forex:     1.0      # forex engine max=2.0; was 1.60 (80%!) — unreachable without rare SMC bonuses
  crypto:    1.4      # was 1.20, restore to 1.40
  commodity: 1.4      # was 1.10, restore to 1.40
  stock:     1.55      # was 1.10, restore to 1.55
  index:     1.35      # was 1.05, restore to 1.35

# Forex scan threshold — forex_scoring engine outputs 0–2.0 (not 0–3.0 factor scale)
# MIN_CONFLUENCE_CLASS.forex must match this — keep in sync

# Optional subgroup thresholds (used when score_group is available on a pair)
# NOTE: get_score_threshold() uses GROUP value directly — no class floor check.
# Group values must be proportionally in line with MIN_CONFLUENCE_CLASS.
MIN_CONFLUENCE_GROUP:
  forex:
    forex_majors: 0.85     # was 1.50 — unreachable; majors most liquid, lower bar
    forex_crosses: 0.95     # was 1.55
    forex_exotics: 1.05     # was 1.65; exotics need higher conviction
  crypto:
    crypto_btc: 1.28      # was 1.10 (old lowered-class era) × 1.167
    crypto_eth: 1.34      # was 1.15 × 1.167
    crypto_alt_majors: 1.40  # was 1.20 × 1.167 = class floor
    crypto_other: 1.40    # was 1.20 × 1.167 = class floor
  commodity:
    nat_gas: 1.45
    pgm_metals: 1.40
    copper: 1.35
    precious_trackers: 1.40  # was 1.10 (old lowered-class value) — restored to class floor
    energy_oil: 1.25
    commodity_other: 1.35
  index:
    asian_indices: 1.45
    us_indices_trackers: 1.35
    eu_indices: 1.30
    index_other: 1.35
  stock:
    us_stock_single: 1.55  # was 1.10 (old lowered-class era) × 1.409 = class floor
    smallcap_em_etf: 1.40  # was 1.00 × 1.409
    bond_tlt: 1.25         # was 0.90 × 1.409; slight allowance below class for bond ETFs
    stock_other: 1.50      # was 1.05 × 1.409

# Per-scan cross-sectional quantile gate (optional). When enabled, effective threshold =
# max(static MIN_CONFLUENCE_*, percentile cut) per asset class so only ~top fraction of
# that scan’s scores can clear trade tier (self-scales with regime).
SCAN_QUANTILE_ENABLED: false
SCAN_QUANTILE_MIN_SAMPLES: 5
# Asset types that skip quantile (static MIN_CONFLUENCE_* only). Crypto often fails when
# max(static, percentile_cut) lifts the bar above tight subgroup floors after a few high scores.
SCAN_QUANTILE_EXCLUDE_TYPES:
  - crypto
SCAN_QUANTILE_TOP_FRACTION:
  default: 0.20
  crypto: 0.18
  forex: 0.22
  stock: 0.15
  index: 0.15
  commodity: 0.18

# Risk settings
RISK_PCT: 0.01
MIN_CONFLUENCE: 1.0
VOLUME_THRESHOLD: 1.5
VOLUME_THRESHOLD_BACKTEST: 1.2

# Round-trip fee per trade as fraction of notional (entry + exit commission)
# Bybit taker 0.055% × 2 sides = 0.11%; forex ECN ~0.02% × 2 = 0.04%
FEE_PCT:
  crypto:    0.0011
  forex:     0.0004
  commodity: 0.0004
  stock:     0.0006
  index:     0.0004

# ── Execution Engine ──────────────────────────────────────
# Indicator correlation filter — expensive O(n²) operation, disable for backtest speed
# Enable only when doing deep live analysis; backtest accuracy unaffected without it
INDICATOR_CORRELATION_ENABLED: false

EXECUTION_ENABLED: true       # Enable manual execution via dashboard
AUTO_EXECUTE: false            # Manual click only (no auto-fire)

# ── Auto-Trader ────────────────────────────────────────────
AUTO_TRADE_ENABLED: true          # Start auto-trader on server boot
# AUTO_TRADE_MIN_SCORE is the scan floor that decides which signals reach the
# auto-trader candidate list. It is not the final live execute gate.
# Factor engine (crypto/stock/commodity/index) outputs 0–3.0.
AUTO_TRADE_MIN_SCORE:
  crypto:    1.40   # factor 0–3: align with MIN_CONFLUENCE_CLASS.crypto
  commodity: 1.40   # factor 0–3: align with MIN_CONFLUENCE_CLASS.commodity
  stock:     1.55   # factor 0–3: align with MIN_CONFLUENCE_CLASS.stock
  index:     1.35   # factor 0–3: align with MIN_CONFLUENCE_CLASS.index
  forex:     1.0    # forex 0–2: align with MIN_CONFLUENCE_CLASS.forex
# AUTO_TRADE_MIN_CONVICTION is the real live gate used inside auto_trader.py.
# Metric: combinedConviction on a 0–1 scale. When Engine A + B align, the live
# gate gets a 15% discount (effective min = configured min * 0.85).
AUTO_TRADE_MIN_CONVICTION:
  default: 0.50
AUTO_TRADE_MAX_DAILY: 10           # Demo mode: max auto-executions per day
AUTO_TRADE_MAX_PER_SCAN: 1         # Max per scan cycle; raise to 2 only with >10 active pairs
AUTO_TRADE_SCAN_INTERVAL_MIN: 30   # Scan every 30 minutes
MAX_PORTFOLIO_HEAT: 0.06      # 6% total risk across all positions
MAX_OPEN_POSITIONS: 5         # Demo/testing — revert to 5 before live
MAX_CORRELATED_POSITIONS: 3   # Allow up to 3 correlated positions (e.g. 3 USD pairs)
SIGNAL_MAX_AGE_SEC: 300       # 5 min freshness window
FOREX_SESSION_FILTER: true    # true = London+NY+Asian only; false = 24h (disable for testing)
SERVER_TZ_OFFSET_HOURS: 2    # Your local timezone UTC offset — SAST = 2 (GMT+2)
FOREX_H4_RESAMPLE_OFFSET_HOURS: 1.0  # Align H4 grid to 01/05/09/13/17/21 UTC (matches TV NY-aligned brokers)

# Forex scoring engine (merged into CONFIG["FOREX_ENGINE"] — see config.py for full defaults)
FOREX_ENGINE:
  hurst_gate_enabled: true      # Block trend signals when Hurst <= threshold
  hurst_gate_threshold: 0.40   # Only block strong mean-reversion (H < 0.40); allows neutral/random-walk markets
  h1_ema_entry_filter: true   # H1 ema21/50 alignment modifier on RSI entry quality; false = RSI only
  trend_gate_adx_min: 25   # Match ADX_TREND_MIN_CLASS.forex — must stay in sync
  trend_gate_adx_hard_fail_min: 15.0
  trend_gate_adx_soft_full_at: 25.0
  trend_gate_adx_soft_enabled: true
  session_mode: "strict"        # strict, soft, off
  session_soft_multiplier: 0.75
  session_shoulder_enabled: true
  session_shoulder_multiplier: 0.90
  session_shoulder_hours: 1
  trend_support_weights:
    momentum: 0.30  # H4 momentum contribution to trend score
    adx: 0.20       # H4 ADX contribution to trend score
    carry: 0.10     # Carry tilt contribution to trend score
MAX_RISK_PER_TRADE: 0.03      # Hard cap 3% per trade
DRAWDOWN_REDUCE_THRESHOLD: 0.10   # Halve size at 10% drawdown
DRAWDOWN_STOP_THRESHOLD: 0.15     # Stop all trading at 15% drawdown

# ── EODHD Sentiment Gate ──────────────────────────────────
SENTIMENT_GATE_ENABLED: true       # Check news sentiment before auto-trades
SENTIMENT_BLOCK_THRESHOLD: 0.4     # Block if sentiment opposes direction by >0.4
SENTIMENT_ALIGN_THRESHOLD: 0.3     # Mark as aligned when sentiment supports direction beyond this level
SENTIMENT_API_FAIL_CLOSED: false   # If true, blocks auto-execution if the sentiment API fails

# ── EODHD Event Risk Filter ──────────────────────────────
EVENT_RISK_ENABLED: false          # EODHD economic-events calls disabled; do not use economic calendar API
EVENT_RISK_HOURS: 4                # Hours ahead to check for events
EVENT_RISK_API_FAIL_CLOSED: false  # If true, blocks auto-execution if the event calendar API fails

# ── Adaptive factor weights (factor_scoring.py) ─────────────
ADAPTIVE_WEIGHTS_ENABLED: false

# ── Backtest Parity Controls ─────────────────────────
BACKTEST_EVENT_RISK_GATING: false
BACKTEST_SENTIMENT_GATING: false

# ── Adaptive Kelly Position Sizing ────────────────────────
ADAPTIVE_KELLY_ENABLED: true       # Use fractional Kelly for dynamic position sizing
KELLY_FRACTION: 0.5                # Half-Kelly (safety proven)

# ── Signal Debate (Bull/Bear/Judge) ───────────────────────
SIGNAL_DEBATE_ENABLED: true        # Run LLM debate before auto-trades (needs XAI_API_KEY)
XAI_MODEL: "grok-4-1-fast-reasoning"
# Optional: POST /api/lottery/ai-analysis model (defaults to XAI_MODEL). Same OpenAI SDK + https://api.x.ai/v1
# LOTTERY_AI_MODEL: "grok-4-1-fast-reasoning"
DEBATE_MODEL: "grok-4-1-fast-reasoning"
VISION_MODEL: "grok-4-1-fast-reasoning"          # /api/chart-analysis
NEWS_SENTIMENT_MODEL: "grok-4-1-fast-reasoning"  # News AI text; defaults to XAI_MODEL if empty — uses XAI_API_KEY
# Blend News AI into Engine A scan score (EODHD news + Grok). Heavy: uses TTL cache per pair.
NEWS_SENTIMENT_CONFLUENCE_ENABLED: false
NEWS_SENTIMENT_CACHE_TTL_SEC: 900                # seconds; same pair reuses vote until expiry
NEWS_SENTIMENT_SCORE_IMPACT: 0.06               # delta = impact * maxScore * vote (vote ~ -1..1)
NEWS_SENTIMENT_ATTACH_SUMMARY: true             # attach short summary on each signal JSON
NEWS_PAIR_CAP: 40   # Max pairs to fetch per-pair EODHD news and word weights per refresh
AI_STRUCTURED_OUTPUTS: true
AI_TEMPERATURE: 0.3
AI_VISION_TEMPERATURE: 0.2
ENGINE_B_PROFILE_SCORING_ENABLED: true

# ── AI Learning ───────────────────────────────────────────
LEARNING_ENABLED: true             # Enable AI self-learning (outcome extraction + prompt injection)
LEARNING_LOOKBACK_DAYS: 90         # How many days of trade history to use for learning context
LEARNING_MIN_TRADES: 30            # Minimum trades required before injecting learning context into AI prompts
META_ANALYSIS_ENABLED: true        # false = skip auto-trader weekly xAI meta-analysis (manual POST still works)
EODHD_EARNINGS_CALENDAR_ENABLED: false   # false = skip unsupported EODHD earnings calendar endpoint entirely

# ── EODHD Insider / Fundamentals Enrichment ───────────────
INSIDER_TRADING_ENABLED: true      # Check SEC Form 4 insider activity for stock signals
FUNDAMENTALS_ENABLED: true         # Enrich stock signals with fundamental data
# Ranging penalties — halved (ADX vote=0 already penalises, one penalty per condition)
RANGING:
  crypto:
    dead: 18
    dead_pen: 1.0
    choppy: 23
    choppy_pen: 0.5
  forex:
    dead: 18
    dead_pen: 1.5
    choppy: 23
    choppy_pen: 1.0
  commodity:
    dead: 18
    dead_pen: 1.5
    choppy: 23
    choppy_pen: 0.5
  stock:
    dead: 16
    dead_pen: 1.5
    choppy: 21
    choppy_pen: 0.5
  index:
    dead: 16
    dead_pen: 1.5
    choppy: 21
    choppy_pen: 0.5

# Crypto transition penalty — disabled by default (was always-on, adding up to -2.0 only for crypto)
# Enable and tune if crypto signals become too noisy after RANGING recalibration
CRYPTO_TRANSITION_PENALTY:
  enabled: false
  collapsing: 1.5
  exhausting: 0.8
  cap: 2.0

# Live crypto microstructure (WS-injected order book / flow) as an Engine A factor.
# Research validation: enabled — factor_scoring applies FACTOR_WEIGHTS.crypto.microstructure
# and CRYPTO_FACTOR_WEIGHT_CAPS.microstructure when live WS data passes age checks.
CRYPTO_LIVE_MICROSTRUCTURE_SCORING_ENABLED: true

# Factor weights per asset class (base)
# Crypto: VMS stays in momentum; live WS microstructure scores only when the gate above is true.
# Carry zeroed (never fires for crypto). Structure reduced (fib noisy on perps).
# Forex trend raised to 2.0 (primary edge) and momentum to 1.0 (was under-weighted).
FACTOR_WEIGHTS:
  crypto:    { trend: 2.0, momentum: 1.5, volatility: 0.8, volume: 1.0, structure: 0.5, derivatives: 1.2, microstructure: 0.6, carry: 0, trend_strength: 1.0 }
  forex:     { trend: 2.0, momentum: 1.0, volatility: 1.0, volume: 0.3, structure: 0.3, derivatives: 0.8, microstructure: 0.5, carry: 0.7 }  # NOTE: not used — forex routes to forex_scoring.py, not factor_scoring.py
  stock:     { trend: 2.0, momentum: 1.5, volatility: 1.0, volume: 1.5, structure: 1.0, derivatives: 0.5, microstructure: 0.75, carry: 1.0 }
  commodity: { trend: 2.0, momentum: 1.3, volatility: 1.5, volume: 1.0, structure: 1.3, derivatives: 0.7, microstructure: 0.75, carry: 0.5 }
  index:     { trend: 2.0, momentum: 1.4, volatility: 1.2, volume: 0.8, structure: 1.0, derivatives: 1.2, microstructure: 0.75, carry: 1.0 }

# Per-indicator weights WITHIN each factor group.
# These control how individual indicators contribute to their parent factor score.
# Keys must match indicator names in factor_scoring.py directional_factors and nondirectional_factors.
# Missing keys default to 1.0 (equal weight). Set to 0.0 to disable an indicator.
INDICATOR_WEIGHTS:
  # TREND factor: D1 is the tide (dominant), H4 is momentum, H1 is entry timing
  # Equal weighting treats a normal H1 pullback as weak direction — wrong for trend-following.
  # D1-dominant: pullback in strong D1 trend scores 0.60 instead of 0.33.
  trend:
    crypto:
      d1_ema_trend: 0.5
      h4_ema_trend: 0.3
      ema_trend: 0.2
    forex:
      d1_ema_trend: 0.5
      h4_ema_trend: 0.3
      ema_trend: 0.2
    commodity:
      d1_ema_trend: 0.34
      h4_ema_trend: 0.33
      ema_trend: 0.33
    stock:
      d1_ema_trend: 0.4
      h4_ema_trend: 0.35
      ema_trend: 0.25
    index:
      d1_ema_trend: 0.4
      h4_ema_trend: 0.35
      ema_trend: 0.25
  # MOMENTUM: RSI is more responsive for forex; MACD lags but confirms.
  # Crypto: VMS stays here; live WS microstructure is a separate factor (gated).
  momentum:
    default:
      rsi_z: 0.6
      macdLine_z: 0.4
    crypto:
      rsi_z: 0.5
      macdLine_z: 0.3
      volume_momentum_spread: 0.2
  # DERIVATIVES: COT is weekly (lagging), funding is crypto-only
  # Crypto OI sub-indicators (oi_change_z, oi_price_divergence) are small vs funding — conservative.
  # When only one fires (e.g. funding only for crypto), it gets full weight automatically.
  derivatives:
    default:
      cot_z: 0.6
      funding_rate: 0.4
    crypto:
      funding_rate: 0.70
      oi_change_z: 0.15
      oi_price_divergence: 0.15
      cot_z: 0.20
  # MICROSTRUCTURE: For non-crypto (candle proxies), OBI is the strongest signal.
  # OFD and LP are derived from the same OHLC data — correlated, so down-weighted.
  # For crypto (real WS orderbook), liquidity_wall_detection gets meaningful weight.
  microstructure:
    order_book_imbalance: 0.4
    liquidity_wall_detection: 0.25
    orderflow_delta: 0.2
    liquidity_pressure: 0.15
  # VOLATILITY: ATR is the primary vol measure; BB width and realized vol confirm
  volatility:
    atr_z: 0.5
    bbWidth_z: 0.3
    realized_vol_z: 0.2
  # VOLUME: volume_ratio is the primary signal; OBV confirms trend
  volume:
    volume_ratio: 0.7
    obv_trend: 0.3
  # STRUCTURE + TREND_STRENGTH: single indicators, weights don't matter (1.0 default)
  # CARRY: single indicator, weight doesn't matter (1.0 default)
  carry:
    carry_z: 1.0

# Factor scoring gates
# FACTOR_MIN_DIRECTIONAL: if abs(dir_score) < this, score=0 regardless of quality.
# Prevents trades where direction is near-random but volatility/ADX inflates the total score.
FACTOR_MIN_DIRECTIONAL: 0.25
# Soft transition width around FACTOR_MIN_DIRECTIONAL for smooth confidence scaling
# (removes binary cliff while preserving directional preference).
FACTOR_DIRECTIONAL_SOFT_SPAN: 0.20
FACTOR_MIN_DIRECTIONAL_CRYPTO: 0.15
FACTOR_DIRECTIONAL_SOFT_SPAN_CRYPTO: 0.30

# Regime smoothing: number of consecutive H4 bars that must agree on a new regime
# before the committed regime switches. Prevents regime whipsawing from bar to bar.
REGIME_SMOOTHING_BARS: 3

# Regime-aware factor weights
REGIME_WEIGHTS:
  TRENDING:        { trend: 2.0, momentum: 1.5, volatility: 1.0, volume: 1.0, structure: 0.5, derivatives: 1.2, microstructure: 1.5, carry: 1.0, trend_strength: 1.5 }
  RANGING:         { trend: 0.5, momentum: 1.5, volatility: 1.0, volume: 1.0, structure: 2.0, derivatives: 1.0, microstructure: 1.5, carry: 1.0, trend_strength: 0.5 }
  HIGH_VOLATILITY: { trend: 1.0, momentum: 1.0, volatility: 2.0, volume: 1.5, structure: 1.0, derivatives: 1.5, microstructure: 1.5, carry: 1.0, trend_strength: 0.8 }
  LOW_VOLATILITY:  { trend: 1.2, momentum: 1.0, volatility: 0.5, volume: 1.0, structure: 1.0, derivatives: 1.0, microstructure: 1.5, carry: 1.0, trend_strength: 1.0 }

# Crypto subgroup factor behavior (Engine A)
FACTOR_SCORE_GROUP_MULTIPLIERS:
  crypto_btc: { derivatives: 1.1 }
  crypto_eth: { derivatives: 1.05 }
  crypto_doge: { volatility: 1.35 }
  crypto_alt_majors: { trend: 1.05, momentum: 1.05 }
  crypto_other: { trend: 1.05, momentum: 1.05 }

CRYPTO_FACTOR_WEIGHT_CAPS:
  derivatives: 1.2
  microstructure: 0.8
  carry: 0
  structure: 0.8

INTERMARKET_CONFIRMATION:
  enabled: false
  analysis_tf: H4
  windows: [20, 50, 90]
  min_overlap_bars: 100
  max_lag_bars: 5
  lead_lag_enabled: false
  full_scan_time_matrix: true
  max_pairs_per_symbol: 12
  strong_corr: 0.65
  moderate_corr: 0.35
  neutral_corr: 0.20
  broken_stability: 0.45
  flip_lookback_bars: 10
  engine_a_enabled: false
  engine_a_score_cap: 0.18
  engine_c_enabled: false
  engine_c_conviction_cap: 0.08
  severe_contradiction_blocks: false
  asset_class_filters:
    forex: [forex, commodity, index, stock]
    commodity: [forex, commodity, index, stock]
    index: [index, stock, etf, commodity, forex]
    stock: [stock, etf, index, commodity]
    crypto: [crypto, index, stock]
  macro_priors:
    - pair: XAU/USD
      driver: DXY
      relation: inverse
    - pair: XAU/USD
      driver: US10Y_REAL_YIELD_PROXY
      relation: inverse
    - pair: EUR/USD
      driver: DXY
      relation: inverse
    - pair: GBP/USD
      driver: DXY
      relation: inverse
    - pair: USD/JPY
      driver: US10Y_NOMINAL_PROXY
      relation: positive
    - pair: USD/CAD
      driver: WTI_OIL_PROXY
      relation: inverse
    - pair: AUD/USD
      driver: COMMODITY_BASKET_PROXY
      relation: positive
    - pair: AUD/USD
      driver: RISK_SENTIMENT_PROXY
      relation: positive

# Normalization
NORMALIZATION_LOOKBACK:
  crypto:    300
  forex:     400
  commodity: 300
  stock:     350
  index:     350

# Realized volatility
REALIZED_VOL_LOOKBACK: 30
REALIZED_VOL_ANNUALIZATION:
  crypto: 365
  forex: 252
  stock: 252
  index: 252
  commodity: 252

# Microstructure datafeed configuration
MICROSTRUCTURE:
  exchanges:
    - binance
    - bybit
  orderbook_depth:
    binance: 20
    bybit: 50
  update_interval_seconds: 1
  liquidity_wall_threshold: 5

# Indicator correlation
INDICATOR_CORRELATION_WINDOW: 200

# Regime detection overrides
# When false, crypto no longer receives an extra ADX-momentum transition penalty on top of
# the normal ranging penalty.
CRYPTO_TRANSITION_PENALTY_ENABLED: false  # NOTE: no effect on scores currently — see regime.py

# Confidence engine
CONFIDENCE_THRESHOLD: 0.55
POSITION_SIZE_CONFIDENCE_SCALING: true
MICROSTRUCTURE_FEEDS_ENABLED: true

# When true, each ENGINE C scan logs ALIGNED tradeable consensus rows to shadow_signals (audit.db).
SHADOW_LEDGER_ENABLED: true 

# Pair-specific routing. Use this to disable filters that do not help a pair,
# zero out weak votes, or tighten thresholds without touching the whole asset class.
# Valid vote keys: d1_trend, h1_ema, d1_adx, h4_macd, h4_oscillator, volume,
# funding, session, h4_fib, h1_bb, weinstein, divergence
# Valid filter keys: weinstein, session, regime_transition, obv, funding,
# squeeze, mean_revert, btc_bias, divergence_warning
PAIR_PROFILES:
  XAU/USD:
    disable_filters: [obv, session]
    weight_overrides:
