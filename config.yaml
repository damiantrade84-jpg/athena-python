# Engine A trend-state block list - BACKTEST ONLY by default. Live scan tier

# classification is NOT affected unless a "live" scope is explicitly configured.

# Signals in a blocked regime are skipped in backtest entries (funnel["fail_regime"]).

#

# Research 2026-04-18 (factor_dump_intra2.jsonl, n=393 intraday trades,

# 4 crypto + 4 forex):

#   DEAD RANGING - WR 18.5%, avgR -0.59R  (strong block)

#   DEVELOPING   - WR 32.7%, avgR -0.19R  (clear loser)

#   RANGING      - WR 41.3%, avgR +0.12R  (keep)

#   TRENDING     - WR 39.3%, avgR +0.04R  (keep)

#

# Formats accepted:

#   flat list:      applies to backtest only (live untouched) - this is the safe default

#     ENGINE_A_BLOCKED_TREND_STATES: ["DEAD RANGING", "DEVELOPING"]

#   scope dict:     choose scopes explicitly

#     ENGINE_A_BLOCKED_TREND_STATES:

#       backtest: ["DEAD RANGING", "DEVELOPING"]

#       live: []                           # leave live tier classification alone

#   scope + per-class:

#     ENGINE_A_BLOCKED_TREND_STATES:

#       backtest:

#         default: ["DEAD RANGING", "DEVELOPING"]

#         forex: ["DEAD RANGING"]

ENGINE_A_BLOCKED_TREND_STATES:

  - "DEAD RANGING"

  - "DEVELOPING"


# ── Engine A Regime-Dependent Dynamic Thresholds ────────────────────────────
# When enabled, adjusts the score threshold based on market regime to match
# research-backed best practices. TRENDING regimes are easier to pass (lower
# threshold), while RANGING/HIGH_VOLATILITY are harder (higher threshold).
# Disabled by default — enable after backtest validation.
ENGINE_A_REGIME_DYNAMIC_THRESHOLDS:
  ENABLED: false
  TRENDING_MULTIPLIER: 0.90   # 10% easier in trending markets
  RANGING_MULTIPLIER: 1.10    # 10% harder in ranging markets
  HIGH_VOLATILITY_MULTIPLIER: 1.15  # 15% harder in chaotic markets



ENGINE_A_PAIR_THRESHOLDS: {}

ENGINE_A_SCORE_GROUP_THRESHOLDS:

  # Every get_pair_score_group() value must be listed (see scoring.ENGINE_A_KNOWN_SCORE_GROUPS).
  # "default" is only for unknown / forward-compatible groups — not a stand-in for missing keys.

  # Note: forex_exotics (1.7) sits *below* forex_majors (2.1) by design.
  # Exotics rarely score high enough to clear a majors-grade bar, so the
  # tier is loosened to keep them tradable. This intentionally inverts the
  # generic "thin liquidity = stricter" comment in scoring.py's _TIER_*.

  default: 1.5

  # Forex
  forex_majors: 2.1
  forex_crosses: 2.1
  forex_other: 2.1
  forex_exotics: 1.7

  # Crypto
  crypto_btc: 2.0
  crypto_eth: 2.0
  crypto_alt_majors: 2.0
  crypto_doge: 2.0
  crypto_other: 2.2

  # Commodity
  # #7 (2026-05-28): oil/precious previously sat at the equity-grade 1.5 bar despite
  # higher volatility (nat_gas already 2.0). UNVALIDATED judgment values (NOT n>=30
  # outcome-backed): oil 1.8 (between SPY 1.5 and nat_gas 2.0), precious 1.7 (slightly
  # lower vol than oil). The ATR% vol scaler partly compensates, so keep the move
  # modest. copper/pgm/base_metals left at 1.5 (not flagged). Reversible: reset to 1.5.
  precious_trackers: 1.7
  energy_oil: 1.8
  nat_gas: 2.0
