# Detects hidden institutional positioning via tick volume divergence.
# Bearish: price new high + volume declining = distribution
# Bullish: price new low + volume holding/rising = accumulation



# Engine B BT level resolution: BT now consumes conf_data.execution_sl /
# execution_tp directly (live parity), via market_structure.resolve_engine_b_execution_levels.
# Legacy ENGINE_B_BT_SL_MODE flag removed.

# ENGINE_B_BT_STRUCTURE_GATE_ENABLED removed: the structure gate is mandatory
# in live and the backtest must not have a private bypass that breaks parity.

# Engine B live scan structure gate:
# false = disable the structure_ok gate in live calculate_confidence() (same as BT experiment).
# Live scan, AI review, and execution all consume this key.
ENGINE_B_STRUCTURE_GATE_ENABLED: true
# When true, Engine A full-scan *trade* tier requires Engine B confirmation (enginesAligned).
# Default false: Engine A and B are independent on scan; use Engine C for combined verdict.
ENGINE_B_SCAN_CONFIRMATION_GATE_ENABLED: false
# Scan-only paper/demo diagnostics: Engine B may re-check its own independent
# naked-structure direction when the Engine A direction blocks B. config.py
# remains default-off.
ENGINE_B_SCAN_INDEPENDENT_DIRECTION_ENABLED: true
# Scan-only paper/demo diagnostics: passed B-only setups surface as watchlist
# rows instead of disappearing behind Engine A's scan tier. No execution bypass.
ENGINE_B_SCAN_B_ONLY_WATCHLIST_ENABLED: true
ENGINE_B_STRUCTURE_READY_WATCHLIST:
  ENABLED: true
  MIN_SCORE_RATIO: 0.85
  REQUIRE_TRIGGER_MISSING: true
  REQUIRE_STRUCTURE_OK: true
  REQUIRE_LOCATION_CONTEXT: true
  FOREX_GATE_NEAR_MISS_ENABLED: true
  ASSET_GATE_NEAR_MISS_ENABLED: true
  FOREX_MIN_GATE_CONFIRMATIONS: 3
# Default OFF — Engine A scan rows always keep their Engine A SL/TP1/TP2.
# Engine B execution levels are kept in engine_b_execution_* overlay fields.
# Even when set to true, scanner._apply_engine_b_scan_levels only writes
# generic SL/TP for Engine B-only rows (or Engine C rows that explicitly
# select B execution levels).
ENGINE_B_USE_EXECUTION_LEVELS_FOR_SCAN_SIGNALS: false

# Engine A SL overlay floor. When the Engine B structural SL is applied over an
# Engine A signal, the legacy behavior picks the TIGHTER of the ATR stop and the
# structural stop, which can place the stop on swing/sweep liquidity and produce
# false-breakout stop-outs. When true, the structural SL may only WIDEN the ATR
# stop, never tighten it inside the ATR baseline (the ATR distance is a floor).
# TP capping by structure is unchanged. config.py default is false (legacy).
ENGINE_A_STRUCTURAL_SL_FLOOR_ATR: true


# Engine A exit-mode selector (Plan 2). Per-score-group default exit mode + global
# fallback. Ships global=traditional_static and an empty per-group map, so every
# Engine A score group defaults to traditional_static (user-authorized Engine-A
# default flip — see docs/superpowers/specs/2026-05-29-exit-mode-selector-design.md).
# Valid values: traditional_static | adaptive_trail | manual | time_based
ENGINE_A_EXIT_MODE_GLOBAL_DEFAULT: traditional_static
ENGINE_A_EXIT_MODE_BY_SCORE_GROUP: {}        # e.g. {forex_majors: adaptive_trail}

# Engine A advisable-pip guardrail (Plan 2). Per-score-group SL min/max in pips.
# Ships empty = no clamp. Applied to every mode EXCEPT manual.
ENGINE_A_ADVISABLE_PIP_BY_SCORE_GROUP: {}    # e.g. {forex_majors: {min_pip: 8, max_pip: 60}}

# time_based exit: bars of the style timeframe to hold before the timed close.
ENGINE_A_TIME_EXIT_BARS:
  scalp: 12
  intraday: 18
  swing: 10



# AI usage control - when true, AI only runs on explicit user actions

# (manual analysis clicks, compare engines) - NOT on automatic scans

AI_ON_DEMAND_ONLY: true



# Engine C B-side fallback controls:

# Allow strong Engine B setups to be scored/tradeable even when Engine A is missing

# or weakly opposing, instead of hard-discarding on mismatch.

# Engine C: fraction of A/B blend replaced by meta-learner trust (0..1). Code default 0.20.

ENGINE_C_META_BLEND: 0.20

# Minimum reward:risk (geometric from entry/sl/tp1) for consensus signals in risk_check.
ENGINE_C_EXEC_MIN_RR: 1.0

# When Engine A omits maxScore, use this default (see ENGINE_C_A_DEFAULT_MAX_SCORE_BY_TYPE).
ENGINE_C_A_DEFAULT_MAX_SCORE: 3.0

ENGINE_C_A_DEFAULT_MAX_SCORE_BY_TYPE: {}


ENGINE_C_B_ONLY_MULT: 0.65

ENGINE_C_B_CONFLICT_OVERRIDE_ENABLED: true

ENGINE_C_B_CONFLICT_MIN_SCORE: 0.70

ENGINE_C_A_CONFLICT_MAX_SCORE: 0.45

ENGINE_C_B_CONFLICT_PENALTY: 0.85

# Engine C optional xAI A vs B trust verdict (default off). ADJUST may tweak conviction/weights; does not enable trade from false→true alone.
ENGINE_C_AI_WEIGHT_VERDICT_ENABLED: false
ENGINE_C_AI_WEIGHT_ADJUST_ENABLED: false
ENGINE_C_AI_WEIGHT_MIN: 0.20
ENGINE_C_AI_WEIGHT_MAX: 0.80

VISION_MODIFIERS:

  STRONG: {action: "confirm", conviction_mult: 1.30}

  MODERATE: {action: "confirm", conviction_mult: 1.0}

  WEAK: {action: "weaken", conviction_mult: 0.70}

  AVOID: {action: "override", conviction_mult: 0.0}

  CONTRADICTS: {action: "contradict", conviction_mult: 0.0}



# ── Scalp Engine (Engine D) ───────────────────────────────────────────

SCALP_ENGINE:

  enabled: true

  # Default Engine D roster when POST /api/scalp-scan omits pairs.
  # all_active — every ENABLED pair in ACTIVE_PAIRS excluding disabled_pairs (dashboard kill-switch).
  # scalp — legacy narrow universe (get_scalp_pairs / SCALP_PAIRS when set).
  SCALP_SCAN_UNIVERSE: all_active

  # ── Data ──────────────────────────────────────────────────

  M1_CANDLES: 300               # M1 bars for execution / trigger timing

  M15_CANDLES: 500              # M15 bars for zone/profile detection

  M5_CANDLES: 1000              # M5 bars for trigger/entry detection

  H1_CANDLES: 300               # Higher-TF bars for directional bias

  SESSION_FILTER: true          # Enforce SESSION_MODE for non-crypto (forex/indices/commodities/stocks)

  SESSION_MODE: "london_ny"     # Accepted: london | new_york | london_ny | all | disabled (aliases normalized in code).
  SESSION_MODE_BY_ASSET:
    crypto: "asia_london_ny"
    stock: "new_york"
  CRYPTO_SESSION_MODE: "inherit"

  NY_OPEN_SKIP_MINUTES: 30      # Caution window after NY cash open (applies inside london_ny)

  LONDON_OPEN_SKIP_MINUTES: 20  # Avoid first 20 min of London open (07:00-07:20 UTC)

  EXECUTION_TIMEFRAME: "M1"     # 15m structure, 5m context, 1m execution

  MARKET_OPEN_CHECK_ENABLED: true  # Live scan must skip closed/stale MT5 markets even when SESSION_MODE=all

  MARKET_TICK_MAX_AGE_SEC: 900  # Max age for broker tick before non-crypto market is treated as closed/stale

  MARKET_CANDLE_MAX_AGE_SEC: 900  # Max age for execution candles before live scan treats data as stale

  ALLOW_TIMELESS_SCALP_CANDLES: false # Live scan blocks candles without parseable timestamps

  USE_FORMING_FOR_STRUCTURE: false # Use confirmed M15 bars for VP/market-state/location

  USE_FORMING_FOR_TRIGGER: true    # Keep forming M1/M5 bars available for trigger timing

  USE_FORMING_FOR_BIAS: false      # Use confirmed H1 bars for trend-bias confirmation

  # ── Directional Filter ────────────────────────────────────

  WITH_TREND_ONLY: true         # Reject counter-trend scalp setups

  BIAS_TIMEFRAME: "H1"          # Higher-TF direction gate for scalp signals

  BIAS_REQUIRE_CONFIRMATION: false  # false = allow setup when H1 bars insufficient for EMA stack rather than skip

  # ── Watchlist / Execution Filter ─────────────────────────

  WATCHLIST_GRADE_C_ENABLED: true    # Allow grade C setups on watchlist (overrides EXECUTION_MIN_GRADE)

  WATCHLIST_REQUIRES_TREND: true    # Watchlist setups must align with HTF bias trend

  WATCHLIST_MIN_RR: 1.2              # Minimum R:R for watchlist setups (aligned with SCALP_ENGINE.MIN_RR)

  WATCHLIST_LOCATION_REQUIRED: true  # Watchlist setups must be at VAH/VAL/POC or LVN

  EXECUTION_MIN_GRADE: "B"           # Minimum grade for auto-execution (non-watchlist)

  # Live +1R partial close and SL tighten on runner (Bybit/MT5 outcome monitor).
  LIVE_MILESTONE_MANAGEMENT: true
  SL_AFTER_PARTIAL: tp_partial

  # Sub-+1R giveback protection via timed_exit pre_activation path (Engine D only).
  LIVE_PROFIT_PROTECT: true

  GRADE_THRESHOLDS:
    A: 80
    B: 60
    C: 40

  WORKBENCH_CHART:
    NEAR_LVN_HVN_COUNT: 3
    ENGINE_B_PRICE_WINDOW_ATR_K: 1.5
    RENDER_READY_TIMEOUT_MS: 3000

  WORKBENCH_ORDERFLOW:
    LARGE_TRADE_PERCENTILE: 95
    MIN_NOTIONAL_USD: 10000
    MAX_EVENTS_PER_TYPE: 20

  # ── Spread Limits ─────────────────────────────────────────

  MAX_SPREAD_PIPS:

    forex: 4

    commodity: 8

    crypto: 0                   # disabled - spread not applicable for crypto perpetuals

    index: 6

    stock: 5

  # ── Volume Profile (Fabio Valentini methodology) ──────────

  VP_ENABLED: true              # Use previous-session Volume Profile for zone detection

  VP_LOOKBACK_BARS: 50          # Fabio/Pine fixed-range lookback for profile context

  VP_BINS: 64                   # Price level granularity for Volume Profile histogram
  VP_BINS_CLASS:
    forex: 64
    crypto: 64
    commodity: 64
    index: 64
    stock: 64

  VP_VALUE_AREA_PCT: 0.70       # Fraction 0-1 for volume inside VA (use 0.70 not 70 - 70 coerces but avoid confusion).
  VP_VALUE_AREA_PCT_CLASS:
    forex: 0.70
    crypto: 0.70
    commodity: 0.70
    index: 0.70
    stock: 0.70

  VP_LVN_THRESHOLD: 0.15        # Bins below 15% of POC volume are Low Volume Nodes

  VP_SESSION_AWARE: true        # For forex/indices/stocks/commodities: prefer prior-session candles for VP (avoids overnight dilution)

  VP_PROXIMITY_PCT: 0.30        # % of price to classify as "at" VAH/VAL/POC (0.30 = ±0.30%)
  VP_PROXIMITY_ATR_K: 0.50      # ATR multiplier for VP proximity when ATR mode is enabled
  VP_PROXIMITY_ATR_K_CLASS:
    forex: 0.50
    crypto: 0.50
    commodity: 0.50
    index: 0.50
    stock: 0.50

  TRADE_BUCKET_VP_ENABLED: true   # Crypto: prefer Binance aggTrade price buckets for VP when fresh

  TRADE_BUCKET_CVD_ENABLED: true  # Crypto: prefer Binance aggTrade price buckets for CVD when fresh
  REQUIRE_AGGTRADE_FOR_CRYPTO_STRICT: true
  # F3: when REQUIRE_AGGTRADE_FOR_CRYPTO_STRICT trips because trade-bucket VP/CVD fell back to
  # candle volume, skip the pair entirely (BT-parity) instead of emitting a Not-executable card.
  # Strict gate semantics preserved — candle-VP signals still cannot pass execution. Set to
  # false to revert to the legacy "Not executable" candidate-card behaviour for debugging.
  SKIP_CRYPTO_ON_AGGTRADE_UNAVAILABLE: true
  REQUIRE_REAL_VOLUME_FOR_STOCKS: true

  # ── Volume Divergence Detection ───────────────────────────
  # Detects hidden institutional positioning via tick volume divergence.
  # Bearish: price new high + volume declining = distribution
  # Bullish: price new low + volume holding/rising = accumulation
  VOLUME_DIVERGENCE_ENABLED: true
  VOLUME_DIVERGENCE_STRONG_PCT: 0.25    # Volume change % to count as "strong" divergence
  VOLUME_DIVERGENCE_MODERATE_PCT: 0.10  # Volume change % to count as "moderate" divergence

  # ── Stop-Run / Liquidity Sweep Detection ──────────────────
  # Detects false breakouts: rapid move beyond level + immediate rejection
  STOP_RUN_DETECTION_ENABLED: true
  STOP_RUN_WICK_PCT: 0.60              # Wick % of range to count as confirmed stop-run
  STOP_RUN_WICK_SUSPECT_PCT: 0.40      # Wick % for suspected stop-run

  # ── Time-of-Day Grading Adjustment ────────────────────────
  # Adjusts signal quality by hour of day (UTC). Reduces false signals
  # during thin periods (lunch, session transitions).
  TIME_OF_DAY_ADJUSTMENT_ENABLED: true

  TRADE_BUCKET_MAX_AGE_SEC: 900   # Max age of live aggTrade buckets before candle fallback (15min window)

  TRADE_BUCKET_MIN_LEVELS: 3      # Minimum price buckets required before using aggTrade VP/CVD (lowered for reliability)

  # Require real volume (EODHD overlay) for VP construction by asset type.
  # When true, blocks VP construction if only tick_volume is available.
  REQUIRE_REAL_VOLUME_FOR_FOREX: false
  REQUIRE_REAL_VOLUME_FOR_COMMODITY: false
  REQUIRE_REAL_VOLUME_FOR_INDEX: false

  # ── Tick Volume Quality Scoring (non-crypto only) ─────────────────────
  # MT5 tick_volume counts price changes, not real trades. These settings
  # measure tick_volume reliability and cap grade components when data is proxy.
  TICK_VOL_QUALITY_GRADING_ENABLED: true     # Enable tick-volume quality scoring in grading
  TICK_VOL_SPIKE_MULT: 2.0                   # Volume multiplier to count as a "spike" event
  TICK_VOL_QUALITY_THRESHOLD: 35             # Minimum quality score (0-100) to consider tick_volume reliable

  # ── Proxy-Aware Grading ───────────────────────────────────────────────
  # When volume data is proxy-based (tick_volume, candle approximation),
  # grade components are capped to prevent Grade A without real volume evidence.
  PROXY_AWARE_GRADING_ENABLED: true
  GRADE_PROXY_ABSORPTION_MAX: 10             # Max absorption points when using proxy volume (default 20)
  GRADE_PROXY_ABSORPTION_MAX_RELIABLE: 14    # Max absorption when tick-vol quality is reliable (≥35)
  GRADE_PROXY_CVD_MAX: 7                     # Max CVD aligned points for proxy CVD (default 15)
  GRADE_PROXY_CVD_NEUTRAL_MAX: 2             # Max CVD neutral points for proxy CVD (default 5)
  GRADE_PROXY_AAA_MAX: 10                    # Max AAA complete points for proxy data (default 15)
  GRADE_PROXY_AAA_ACCUM_MAX: 5               # Max AAA accumulation points for proxy data (default 7)

  # ── Engine D additive grading knobs (audit 2026-05) ─────────────────────────
  # All values below default to current behaviour (legacy preservation) until
  # operators flip them after backtest validation. Empty maps and zeros are no-ops.

  # Per-location point overrides for the 0–25 location component in ai_quality_grade.
  # Defaults match legacy literals; lower outside_va to 20 once backtested if
  # outside-VA setups need to clear a higher quality bar than at_vah/at_val.
  GRADE_LOCATION_POINTS:
    at_vah: 25
    at_val: 25
    outside_va: 25
    at_lvn: 20
    at_poc: 10
    inside_va: 5

  # Cap on the single-bar absorption credit when non-crypto tick volume fails the
  # MT5_ABSORPTION_MIN_COUNT setup-gate filter. Default 12 = legacy. Drop to 6–8 to
  # require multi-bar confirmation before granting the full absorption credit.
  GRADE_TICK_SINGLE_BAR_ABS_MAX: 12

  # Bump A/B grade thresholds when the underlying VP/CVD/absorption are proxy. Both
  # default 0 = legacy. _LOW_TVQ applies the larger lift when tick-volume quality
  # is unreliable (tick_vol_quality is_reliable=false).
  GRADE_PROXY_THRESHOLD_BUMP: 0
  GRADE_PROXY_THRESHOLD_BUMP_LOW_TVQ: 0

  # Delayed-real (eodhd_*, ws_tick_volume) fidelity tier caps. Source is real
  # post-trade volume but with latency, so caps may be set above the pure proxy
  # caps. Each value max(existing_proxy_cap, configured) — i.e. omit/leave equal
  # to the proxy value to keep legacy behaviour.
  GRADE_DELAYED_REAL_ABSORPTION_MAX: 10      # ≥ GRADE_PROXY_ABSORPTION_MAX to take effect
  GRADE_DELAYED_REAL_CVD_MAX: 7              # ≥ GRADE_PROXY_CVD_MAX to take effect
  GRADE_DELAYED_REAL_CVD_NEUTRAL_MAX: 2      # ≥ GRADE_PROXY_CVD_NEUTRAL_MAX to take effect
  GRADE_DELAYED_REAL_AAA_MAX: 10             # ≥ GRADE_PROXY_AAA_MAX to take effect
  GRADE_DELAYED_REAL_AAA_ACCUM_MAX: 5        # ≥ GRADE_PROXY_AAA_ACCUM_MAX to take effect

  # Engine A HTF diagnostics enrichment into Engine D (validated improvement #1).
  # When caller supplies lightweight {"regime", "adx_bucket", "mom_quality"} via pair input,
  # and GRADE_HTF_ENGINE_A_BONUS > 0, adds tiny advisory points (max 5) when A aligns with D's EMA bias.
  # Default 0 preserves exact legacy grading. Data-only; D never invokes Engine A scoring.
  # A and B remain fully non-blocking by design.
  GRADE_HTF_ENGINE_A_BONUS: 0

  # CVD divergence as explicit numeric in Engine D grading (validated improvement #2).
  # When true (default), the small CVD slope vs location contribution is active in ai_quality_grade.
  # Complements the pre-existing volume_divergence path. Proxy caps respected.
  CVD_DIVERGENCE_IN_GRADE_ENABLED: true

  # Per-score-group spread caps (precedence: MAX_SPREAD_*_OVERRIDES per-symbol >
  # _BY_SCORE_GROUP > asset-class default). Empty maps = no group routing (legacy).
  # Keys are score_group strings from scoring.get_pair_score_group()
  # (e.g. forex_majors, forex_crosses, forex_exotics, us_indices_trackers, …).
  MAX_SPREAD_PIPS_BY_SCORE_GROUP: {}         # forex/crypto pips
  MAX_SPREAD_POINTS_BY_SCORE_GROUP: {}       # index/stock/commodity raw MT5 points

  # When true, demote non-crypto setups with proxy volume + unreliable tick-volume
  # quality from PASS to WATCHLIST. Default false = legacy (TVQ informs grading
  # only, never the execution gate).
  TVQ_REQUIRED_FOR_EXEC_NONCRYPTO: false

  TRADE_BUCKET_MIN_VOLUME: 0.0    # Optional minimum total bucket volume before using aggTrade VP

  EODHD_VOLUME_OVERLAY_LIVE_ENABLED: true   # When false in YAML, code default is also false; live overlay off → MT5 tick vol only
  EODHD_VOLUME_OVERLAY_BACKTEST_ENABLED: true # Use audited EODHD intraday volume in Engine D backtests

  # Live V2 US delayed quotes: 0 = off. When >0, skip volume delta injection when quote event time lags wall clock by more than this many seconds.
  EODHD_LIVE_V2_MAX_QUOTE_LAG_SEC: 900

  # Reject VP when volume_profile fell back to range-proxy (zero real volume) for US stocks.
  VP_INVALIDATE_RANGE_PROXY_FOR_STOCKS: true
  # Optional: block stock scalp setups when structure overlay used EODHD 1h source (stale intraday risk).
  BLOCK_STOCK_VP_ON_EODHD_1H_VOLUME: true

  EODHD_VOLUME_WARMER_ENABLED: true         # Background prefetch for live EODHD volume cache

  EODHD_VOLUME_WARMER_INTERVAL_SEC: 60      # Refresh M1/M5/M15 cache once per minute (Engine D fast loop)

  EODHD_VOLUME_WARMER_TIMEFRAMES: ["M1", "M5", "M15"]

  EODHD_VOLUME_WARMER_ENGINE_A_ENABLED: true      # Pre-warm H1/H4/D1 for all non-crypto pairs (Engine A + chart Vision)

  EODHD_VOLUME_WARMER_SLOW_INTERVAL_SEC: 900      # 15 min - H1 TTL=55m, H4 TTL=235m, D1 TTL=23h; API-rate safe

  # ── D1 Session Offset ───────────────────────────────────────────────────────
  # D1 resample offset for MT5 brokers (default 0.0 = UTC 00:00).
  # Some brokers (e.g., Pepperstone) use Sydney roll at 22:00 UTC for D1 candles.
  # Adjust this to match the broker's actual D1 session start time.
  # Resolved via config.get_d1_resample_offset_hours(): top-level D1_RESAMPLE_OFFSET_HOURS
  # (see MT5 block above) overrides this nested value when both are set.
  D1_RESAMPLE_OFFSET_HOURS: 0.0

  # ── Engine B Zone Cache TTL ─────────────────────────────────────────────────
  # Zone pruning TTL by asset type. Crypto trades 24/7 so zones invalidate faster.
  ZONE_CACHE_TTL_HOURS:
    crypto: 72        # 3 days for crypto (24/7 markets, fast invalidation)
    forex: 168        # 7 days for forex (default)
    stock: 168        # 7 days for stocks (default)
    commodity: 168    # 7 days for commodities (default)
    index: 168        # 7 days for indices (default)

  # ── EODHD Stock Exchange Suffix Map ──────────────────────────────────────
  # Maps stock display name → EODHD exchange suffix. Dotless unmapped stocks are skipped
  # for Engine D volume overlay instead of silently querying the wrong exchange.
  # Add entries for non-US stocks before enabling them, e.g. "BARC": "LSE", "9988": "HK".
  EODHD_STOCK_EXCHANGE_SUFFIX_MAP:
    "AAPL": "US"
    "TSLA": "US"
    "NVDA": "US"
    "MSFT": "US"
    "AMZN": "US"
    "META": "US"
    "GOOG": "US"
    "JPM": "US"
    "V": "US"
    "XOM": "US"
    "NFLX": "US"
    "AMD": "US"
    "CRM": "US"
    "DIS": "US"
    "BA": "US"
    "COIN": "US"
    "PYPL": "US"
    "INTC": "US"
    "UBER": "US"
    "PLTR": "US"
    "SPY": "US"
    "QQQ": "US"
    "GLD": "US"
    "TLT": "US"
    "IWM": "US"
    "EEM": "US"
    "DIA": "US"
    "GDX": "US"
    "SOXX": "US"
    "XLE": "US"
    "SLV": "US"
    "USO": "US"

  # ── Spread limits for non-forex (raw MT5 points, not pip-converted) ──────

  MAX_SPREAD_POINTS:

    index: 100                  # NAS100/DAX/S&P: max spread in index points

    stock: 50                   # Stocks: max spread in instrument points

    commodity: 30               # Default commodity spread (instrument points); override per-symbol below

  MAX_SPREAD_POINTS_OVERRIDES:
    "XAU/USD": 60               # Gold: 30-60¢ during news/Asia — allow wider
    "XAG/USD": 80               # Silver: wider spread than gold
    "Nat Gas": 40               # NatGas: volatile, wider spread
    "WTI Oil": 8                # Oil: tight spread (3-5 points typical)
    "Brent Oil": 10             # Brent: slightly wider than WTI
    "Copper": 20                # Copper: moderate

  # ── Absorption Detection ──────────────────────────────────

  ABSORPTION_VOL_MULT: 2.0      # Volume must exceed SMA(20) * this (range: 1.5-3.5)
  ABSORPTION_VOL_MULT_CLASS:
    forex: 2.5
    crypto: 2.0
    commodity: 2.5
    index: 2.5
    stock: 2.5

  ABSORPTION_MAX_MOVE_ATR: 0.3  # Max candle body as fraction of ATR
  ABSORPTION_MAX_MOVE_ATR_CLASS:
    forex: 0.3
    crypto: 0.3
    commodity: 0.3
    index: 0.3
    stock: 0.3

  ABSORPTION_SMA_PERIOD: 20     # SMA period for average volume baseline

  # ── CVD (Cumulative Volume Delta) ─────────────────────────

  CVD_SMOOTH_PERIOD: 5          # Smoothing period for delta signal
  CVD_MIN_SLOPE: 0.0
  CVD_MIN_SLOPE_CLASS:
    forex: 0.0
    crypto: 0.0
    commodity: 0.0
    index: 0.0
    stock: 0.0

  # ── AAA Framework (Absorption → Accumulation → Aggression) ─

  AAA_ENABLED: true             # Enable Triple-A setup detection

  AAA_ACCUMULATION_LOOKBACK: 10 # Bars to measure range contraction

  AAA_CONTRACTION_THRESHOLD: 0.70 # ATR ratio threshold for accumulation (0.70 = 70%) — global fallback

  AAA_CONTRACTION_THRESHOLD_CLASS:
    forex: 0.65
    crypto: 0.55
    commodity: 0.65
    index: 0.60
    stock: 0.60

  AAA_BREAKOUT_VOL_MULT: 1.5   # Breakout bar volume must exceed avg * this
  AAA_BREAKOUT_VOL_MULT_CLASS:
    forex: 1.5
    crypto: 1.5
    commodity: 1.5
    index: 1.5
    stock: 1.5

  # ── VWAP ──────────────────────────────────────────────────

  VWAP_ENABLED: true            # Use VWAP for directional lean

  VWAP_BAND_MULT: 0.5          # ATR multiplier for VWAP bands (default 0.5)

  # ── Setup Types ───────────────────────────────────────────

  SETUP_MEAN_REVERSION: true    # VAL→POC / VAH→POC mean reversion trades

  SETUP_TREND: true             # LVN pullback continuation trades
  STRICT_FABIO_GATE_ENABLED: true
  STRICT_TREND_LOCATION_LVN_ONLY: true

  # When true, fee/RR/Fabio/source mechanical issues surface as advisory soft_warnings
  # (WATCHLIST label retained) so AI chart review can adjudicate A/B candidates.
  ADVISORY_GATES_FOR_AI_REVIEW: true

  # Legacy fallback only when STRICT_FABIO_GATE_ENABLED=false: neutral CVD can count as preliminary confirmation.
  ALLOW_NEUTRAL_CVD_AT_VA_EXTREME: true

  # ── Risk & Grading ────────────────────────────────────────

  MIN_RR: 1.2                   # Global Engine D minimum RR; unified floor (operator-approved).

  score_group_overrides:
    forex_majors:
      scalp: { min_rr: 1.2 }
    forex_crosses:
      scalp: { min_rr: 1.3 }
    forex_exotics:
      scalp: { min_rr: 1.5 }
    forex_other:
      scalp: { min_rr: 1.3 }
    crypto_btc:
      scalp: { min_rr: 1.2 }
    crypto_eth:
      scalp: { min_rr: 1.2 }
    crypto_doge:
      scalp: { min_rr: 1.5 }
    crypto_alt_majors:
      scalp: { min_rr: 1.4 }
    crypto_other:
      scalp: { min_rr: 1.2 }
    indices:
      scalp: { min_rr: 1.5 }
    us_indices_trackers:
      scalp: { min_rr: 1.5 }
    eu_indices:
      scalp: { min_rr: 1.5 }
    asian_indices:
      scalp: { min_rr: 1.5 }
    index_other:
      scalp: { min_rr: 1.5 }
    commodities:
      scalp: { min_rr: 1.3 }
    precious_trackers:
      scalp: { min_rr: 1.3 }
    energy_oil:
      scalp: { min_rr: 1.3 }
    nat_gas:
      scalp: { min_rr: 1.6 }
    copper:
      scalp: { min_rr: 1.3 }
    pgm_metals:
      scalp: { min_rr: 1.3 }
    base_metals:
      scalp: { min_rr: 1.3 }
    softs:
      scalp: { min_rr: 1.3 }
    commodity_other:
      scalp: { min_rr: 1.3 }
    stocks:
      scalp: { min_rr: 1.4 }
    us_stock_single:
      scalp: { min_rr: 1.4 }
    stock_other:
      scalp: { min_rr: 1.4 }
    bond_tlt:
      scalp: { min_rr: 1.3 }
    smallcap_em_etf:
      scalp: { min_rr: 1.5 }

  ATR_SL_ENABLED: true          # Engine D execution SL uses ATR when available; VP levels remain context/runner targets.

  ATR_SL_MULT: 1.5              # ATR multiple for Engine D mechanical scalp stop.
  ATR_SL_MULT_CLASS:
    forex: 1.5
    crypto: 1.5
    commodity: 1.5
    index: 1.5
    stock: 1.5
  BUFFER_USE_ATR: true
  BUFFER_ATR_K: 0.25
  BUFFER_ATR_K_CLASS:
    forex: 0.25
    crypto: 0.25
    commodity: 0.25
    index: 0.25
    stock: 0.25

  TP1_R_MULT: 1.0               # Engine D first take-profit/self-pay target in R.

  TP1_MAX_RR: 4.0               # Cap TP1 to this multiple of SL distance - prevents unrealistically far targets (0 = disabled)

  TREND_EXT_MAX_RR: 0.0         # Optional cap for trend-extension TP1 distance (0 = disabled; preserves current behavior)
  TREND_CONT_SL_ATR_MULT_CLASS:
    forex: 1.5
    crypto: 1.5
    commodity: 1.5
    index: 1.5
    stock: 1.5

  TP2_ENABLED: true             # Second TP at next structural level

  AI_GRADING: true              # Enable A/B/C/D quality grading

  GRADE_SESSIONS: ["london", "new_york"]  # Sessions that can contribute to Engine D quality grading
  GRADE_SESSIONS_BY_ASSET:
    crypto: ["asia", "london", "new_york"]
    stock: ["new_york"]

  MIN_GRADE: "B"                # Deprecated alias / funnel metadata only; use EXECUTION_MIN_GRADE for the executable gate.

  MIN_GRADE_AUTO_EXECUTE: "B"   # Backward-compatible fallback for EXECUTION_MIN_GRADE

  GRADE_STRONG_ABSORPTION_MIN_COUNT: 2  # Two absorption bars is enough for strong absorption credit

  MT5_ABSORPTION_MIN_COUNT: 2   # Non-crypto MT5 tick-volume absorption requires two bars to reduce single-spike false positives.

  ZONE_MIN_CONDITIONS: 2        # Valid zone needs >= N conditions

  CRYPTO_MIN_BUFFER_PIPS: 10    # Absolute fallback floor for crypto stop buffer when entry/feed data is bad

  EQUITY_MIN_BUFFER_PIPS: 10    # Absolute fallback floor for stock/index stop buffer when entry/feed data is bad

  FOREX_BUFFER_PCT: 0.0         # Optional forex percentage buffer floor (0 = disabled; preserves current behavior)

  # ── Grade-Based Position Sizing (Fabio A/B/C system) ──────

  GRADE_SIZING_ENABLED: true    # Scale position size by setup grade

  GRADE_A_SIZE_MULT: 1.0        # Full position on A setups

  GRADE_B_SIZE_MULT: 0.5        # Half position on B setups

  GRADE_C_SIZE_MULT: 0.25       # Quarter position on C setups

  ESTIMATED_FEE_PCT_BY_ASSET:
    crypto: 0.0006
    forex: 0.00005
    commodity: 0.00010
    stock: 0.00010
    index: 0.00010

  ESTIMATED_SLIPPAGE_PCT_BY_ASSET:
    crypto: 0.0002
    forex: 0.00005
    commodity: 0.00010
    stock: 0.00005
    index: 0.00010

  # ── Session Risk Rules ────────────────────────────────────

  MAX_DAILY_LOSSES: 3           # Hard stop after 3 consecutive losses

  SIZE_CUT_AFTER_2R: true       # Cut size 50% after +2R on the day

  CONSECUTIVE_LOSS_HALVE: true  # Halve size after 2 consecutive losses

  # ── Backtest ──────────────────────────────────────────────

  BT_ENABLED: true              # Enable scalp backtesting

  BT_SESSION_MODE: "all"        # Testing: allow Engine D backtests across all sessions
  # When false (default): grading uses BT_SESSION_MODE / BT_* session lists (often wider than live).
  # When true: get_grade_sessions_for_mode uses the same SESSION_MODE path as live scan for pre/post grades.
  # When true: backtest grading uses the same SESSION_MODE path as live scan.
  # When false (legacy): grading uses BT_SESSION_MODE (often "all"), which can inflate
  # backtest win rates with off-hours signals that live would skip.
  BT_GRADE_SESSION_LIVE_PARITY: true
  BT_CRYPTO_SESSION_MODE: "inherit"

  BT_NY_OPEN_SKIP_MINUTES: 30   # Backtest mirrors live NY-open caution window

  BT_WALK_BARS: 20              # Max M15 bars to walk for SL/TP hit (20 bars = 5 h, reduces TIMEOUT rate on mean-reversion)

  BT_MAX_CONCURRENT: 2          # Max concurrent scalp positions in backtest

  BT_COMMISSION_PER_SIDE: 0.0   # Commission per side (set per broker)

  BT_SLIPPAGE_TICKS: 3          # Slippage assumption in ticks

  # Engine D fee / execution guard — backtest parity with live
  ENGINE_D_FEE_GUARD_ENABLED: true
  ENGINE_D_MAX_COST_R: 0.20      # Max (fee+slippage) / risk_distance before reject
  ENGINE_D_MIN_STOP_PCT: 0.0005  # Min stop as fraction of entry price (5bp)

  # Engine D partial-exit model — backtest only (live uses broker TP1/SL)
  ENGINE_D_PARTIAL_EXIT_ENABLED: true
  ENGINE_D_TP1_SIZE: 0.50        # Fraction of position to close at TP1
  ENGINE_D_MOVE_SL_TO_BE_AFTER_TP1: true
  ENGINE_D_RUNNER_ENABLED: true
  ENGINE_D_SAME_CANDLE_POLICY: "conservative_sl_first"  # SL-first on same-bar TP/SL

  BT_SCRATCH_ENABLED: true      # Scratch if there is no early follow-through

  BT_SCRATCH_BARS: 3            # Evaluate follow-through over the next 2-3 bars

  BT_SCRATCH_MIN_R: 0.10        # Minimum favorable excursion before holding



# ── Chart Vision Dataset / V2 Shadow ────────────────────────────────────────

# Default false: opt-in only. Dataset pipeline writes to audit.db

# (vision_samples, vision_labels, vision_predictions) on every /api/chart-analysis

# call; v2 shadow runs ML inference in the hot path. Enable only after validation.

# ── Timed Exit Monitor (Triple-Barrier C-barrier) ────────────────────────────

# Hybrid exit: move SL to breakeven at 50% of window, close at full window if in profit.

# Swing trades at >= tp_progress_exempt of TP distance are exempt from timed close.

# Set enabled: false to disable the entire monitor without removing the config.

TIMED_EXIT:

  enabled: true

  check_interval_sec: 30       # how often the monitor wakes (seconds)

  # Minimum R-fraction of risk_amount needed before BE is armed.

  # Prevents arming BE on $0.01 profit where spread stops out at 0.00R.

  breakeven_min_profit_r: 0.20

  # Fraction of SL distance added as buffer above/below entry for the BE SL level.

  # e.g. 0.05 on a 20-pip SL → 1 pip above entry; ensures close price > 0.00R.

  breakeven_buffer_r: 0.05

  scalp:

    breakeven_min: 5           # move SL to entry after 5 min if in profit

    close_min: 10              # in trailing_atr mode: ignored; in fixed mode: force-close at 10 min

    timed_close_enabled: false # OFF for trailing_atr — SL/TP/trail manages exits

    tp_progress_exempt: 0.40   # skip timed close if >= 40% toward TP (mirrors swing logic)

    # Engine A/B style=scalp staged SL profit-lock — disabled in trailing_atr mode.
    # The chandelier trail supersedes the lock ladder: it tightens monotonically with profit
    # and the lock ladder was clipping winners at +0.10R before the trail could activate.
    # Re-enable only if reverting tp_mode to "fixed".

    profit_lock_enabled: false

    profit_lock_stages:

      - { trigger_r: 0.50, lock_r: 0.10 }

      - { trigger_r: 0.75, lock_r: 0.25 }

      - { trigger_r: 1.00, lock_r: 0.50 }

      - { trigger_r: 1.50, lock_r: 1.00 }

  intraday:

    breakeven_min: 15          # move SL to entry after 15 min if in profit

    close_min: 30              # in trailing_atr mode: ignored; in fixed mode: force-close at 30 min

    timed_close_enabled: false # OFF — never force-close on timer alone; chandelier trail manages exits

    tp_progress_exempt: 0.50   # skip timed close if >= 50% toward TP (only relevant in fixed mode)

  swing:

    breakeven_days: 2.5        # move SL to entry after 2.5 days if in profit

    close_days: 5.0            # in trailing_atr mode: ignored; in fixed mode: force-close at 5 days

    timed_close_enabled: false # OFF — never force-close on timer alone; chandelier trail manages exits

    tp_progress_exempt: 0.50   # skip close if >= 50% toward TP (only relevant in fixed mode)

  # ── Trailing ATR TP (Phase 2) ────────────────────────────────────────────
  # When tp_mode is "trailing_atr", after a trade reaches +trail_activation_r
  # in profit, the fixed TP is replaced by a Chandelier-style ATR trail.
  # The trail only moves in the trade's favour (never widens).
  # Trade closes when price closes below the trail level.

  tp_mode: "trailing_atr"      # "fixed" = legacy behavior | "trailing_atr" = Chandelier trail

  # MT5 Engine A/B entries still attach TP1 as a broker-side hard cap while
  # timed_exit manages SL ratchets and trail closes. Keep false only when a
  # broker explicitly accepts SL-only trailing-ATR entries.
  mt5_attach_broker_tp_when_trailing_atr: true

  # Bybit Engine A/B also keeps TP1 as a broker-side pre-activation failsafe.
  # timed_exit still clears it when the chandelier first activates, so winners
  # can run on the trail after activation.
  bybit_attach_broker_tp_when_trailing_atr: true

  # Per-style activation R-multiple. Below this threshold the trade rides on
  # its original ATR SL; at/above this, the chandelier trail becomes the active
  # exit and the broker SL ratchets with it. Per-style because scalp 1R is hit
  # in minutes while swing 1R can take days. Scalar (e.g. 1.0) still accepted
  # for back-compat — applied to all styles.
  trail_activation_r:
    scalp: 0.7
    intraday: 1.0
    swing: 1.5

  trail_atr_mult:              # ATR multiplier for the trailing distance per style
    scalp: 2.0
    intraday: 2.5
    swing: 3.0

  # Per-venue rope override. Crypto (Bybit) gets a wider rope to absorb noise;
  # MT5 (FX/metals/indices) gets a tighter one. Falls back to trail_atr_mult
  # above when venue or style is missing.
  trail_atr_mult_by_venue:
    bybit:
      scalp: 2.5
      intraday: 3.0
      swing: 3.5
    mt5:
      scalp: 1.8
      intraday: 2.2
      swing: 2.8

  # Pre-activation profit protection. Before the chandelier activates, remember
  # the best R reached after a small profit threshold. If price gives that back
  # to the configured floor, close instead of letting a green trade turn red.
  pre_activation_profit_protect_enabled: true
  pre_activation_profit_arm_r:
    scalp: 0.20
    intraday: 0.25
    swing: 0.35
  pre_activation_profit_close_r:
    scalp: 0.0
    intraday: 0.0
    swing: 0.0
  # Reverted to pre-commit 0.15/0.20/0.30 (was widened to 0.25/0.40/0.50 in
  # 02f1cfa5). Re-diagnosis of closed Engine A trades (tools/diagnose_engine_a_stops.py)
  # showed give-back/round-trip trades peak at a median ~0.28R, not ~0.61R, so the
  # wider budget stopped the early small-profit lock-in (giveback_close) from firing
  # and let modest-peak winners ride back to the break-even round-trip floor (scratch
  # -> small loss after fees). The tighter budget restores the early lock-in.
  pre_activation_profit_giveback_r:
    scalp: 0.15
    intraday: 0.20
    swing: 0.30
  pre_activation_profit_arm_r_by_venue:
    bybit:
      scalp: 0.15
      intraday: 0.20
      swing: 0.30
    mt5:
      scalp: 0.20
      intraday: 0.30
      swing: 0.40
  # Reverted in step with pre_activation_profit_giveback_r above to the
  # pre-commit per-venue values (was widened to bybit 0.20/0.30/0.45,
  # mt5 0.25/0.40/0.50 in 02f1cfa5).
  pre_activation_profit_giveback_r_by_venue:
    bybit:
      scalp: 0.10
      intraday: 0.15
      swing: 0.25
    mt5:
      scalp: 0.15
      intraday: 0.20
      swing: 0.30

  # Peak-R give-back close. Once chandelier is active, track the highest R
  # the trade reaches; if current R drops below peak by giveback_r, close
  # immediately. Independent of the trail-line breach — protects against
  # sharp reversals that haven't yet touched the chandelier level.
  trail_giveback_r:
    scalp: 0.3
    intraday: 0.4
    swing: 0.6

  # Optional per-venue override for give-back. Crypto noisier → slightly
  # larger budget; MT5 tighter to lock profit faster.
  trail_giveback_r_by_venue:
    bybit:
      scalp: 0.4
      intraday: 0.3
      swing: 0.7
    mt5:
      scalp: 0.25
      intraday: 0.35
      swing: 0.5

  # When the chandelier first activates (trade crosses trail_activation_r),
  # clear the fixed broker TP so the trail is the only profit-side exit.
  # Without this the original TP caps the winner before the trail can run.
  # Set to false to revert to legacy behavior (fixed TP stays as a hard cap).
  trail_clear_broker_tp_on_activation: true

  trail_lookback: 14           # bars of execution TF for highest_high/lowest_low lookback

  trail_timeframe:             # candle TF used for trailing computation per style
    scalp: "H1"
    intraday: "H4"
    swing: "D1"

  # ── Indicator confirmation ────────────────────────────────────────────────
  # When false (default here), a trail breach triggers close from price alone.
  # When true, requires RSI / MACD reversal first — fewer wick exits, slower to close.
  trail_indicator_confirm: false   # pure price-vs-trail close; set true to require RSI/MACD

  trail_confirm_rsi_threshold: 40  # LONG close when RSI drops below this; SHORT when above (100 - this)

  trail_confirm_rsi_period: 14     # RSI lookback period

  trail_confirm_macd: true         # also require MACD histogram sign flip

  # ── Timer-tightens-trail ─────────────────────────────────────────────────
  # When a trade exceeds close_min/close_days, instead of force-closing, the
  # chandelier multiplier is multiplied by timer_tighten_factor (e.g. 0.6 →
  # 60% of the configured rope). Stagnating trades get squeezed; healthy
  # trades continue. Only takes effect when tp_mode="trailing_atr".

  timer_tightens_trail: false      # do not tighten chandelier from legacy close_min timers
  timer_tighten_factor: 0.6        # multiplier applied to trail_atr_mult past close_min

CHART_VISION_DATASET_ENABLED: false

CHART_VISION_V2_SHADOW_ENABLED: false


# ── AI Conductor (Deterministic Router) ────────────────────────────────────
# Replaces "always run everything" with explicit rules.
# Zero LLM calls for routing. Fully auditable.
CONDUCTOR:
  ENABLED: true
  # Score thresholds (%)
  HARD_FAIL_SCORE_PCT: 35          # Below this: skip signal entirely
  DEBATE_MIN_SCORE_PCT: 50         # Below this: too weak for debate
  DEBATE_MAX_SCORE_PCT: 75         # Inclusive upper band for borderline debate
  STRONG_SCORE_PCT: 80             # Legacy; skip-debate uses score > DEBATE_MAX + clear B
  # Marcus (/api/analyze): when false, LLM runs only if debate/vision/sentiment routed
  RUN_MARCUS_ON_ANALYZE: true
  LOOKBACK_DAYS: 90                # learning_log lookback for dynamic A/B weights (fallback: LEARNING_LOOKBACK_DAYS)
  # Trigger conditions
  VISION_ON_DIVERGENCE: true       # Volume divergence or stop-run -> vision
  VISION_ON_STOP_RUN: true
  SENTIMENT_ON_NEWS: true          # News risk detected -> sentiment
  # Engine weighting
  DYNAMIC_WEIGHTING_ENABLED: false # Conductor routes AI only; meta_learner owns live adaptive trust
  DIAGNOSTIC_WEIGHTS_ENABLED: false
  DYNAMIC_WEIGHT_BLEND: 0.40      # % empirical vs default (0.4 = 40% empirical, 60% default)
  MIN_SAMPLE_SIZE: 10             # Min trades before using empirical weights
# Display + paper/demo monitoring ONLY. No execution. No real orders.

LIVE_DASHBOARD:
  ENABLED: true
  MAX_SYMBOLS: 8
  DEFAULT_SYMBOLS:
    - NAS100
    - SPY.US
    - XAU/USD
    - BTCUSDT
    - ETHUSDT
  PRICE_UPDATE_MS: 5000          # UI poll interval (5s default; 1s is too heavy for full engine refresh)
  ENGINE_D_UPDATE_SEC: 10        # Engine D cached result max age before DATA_MISSING (seconds)
  ENGINE_AB_UPDATE_ON_CONFIRMED_CANDLE: true
  DEFAULT_TIMEFRAME: H4
  PAPER_MONITOR_ONLY: true       # Safety flag - dashboard never creates execution permission
