# Athena v3.0 - Tunable thresholds (override CONFIG defaults)

# Edit this file and restart to apply changes - no code deploy needed.



# ── Paper/Demo Soak Mode ────────────────────────────────────────────────────────

# Safe paper/demo mode that cannot place real orders.

# All would-be executions must be logged as paper/demo decisions.

PAPER_SOAK:
  ENABLED: true
  REAL_ORDERS_ALLOWED: false
  LOG_ALL_SIGNALS: true
  LOG_BLOCKED_SIGNALS: true
  LOG_EXECUTION_DECISIONS: true
  REQUIRED_FRESHNESS_GATE: true



# ── Candle depth for analyze_pair / scans (Engine A indicators) ─────────────

# Fetched per TF, then last bar dropped (forming). Must satisfy analyze_pair mins:

# len(d1)>=220, len(h4)>=50, len(h1)>=50 after drop.

# H4/H1/D1 default 1001 means after the forming-bar drop scoring still uses ~1000

# closed bars while charts can keep the live bar for visibility.

# Reduce for lighter scans (EMA on chart vs signal.snap will diverge).

D1_CANDLES: 1001

H4_CANDLES: 1001

H1_CANDLES: 1001

SCAN_MAX_WORKERS: 6           # Increased scan concurrency for faster Engine A full-universe runs.



# ── News / EODHD sentiment background refresh ────────────────────────────────

# Background loop fetches: economic calendar, sentiment batch only.

# Per-pair news + word-weights are fetched ON-DEMAND when AI analysis is requested.

NEWS_BG_INTERVAL_SEC: 3600    # How often the background news loop runs (seconds). Default 3600 = 1 hour.

NEWS_PAIR_CACHE_TTL_SEC: 14400 # How long per-pair news/word-weights are cached after an AI fetch (seconds). Default 14400 = 4 hours.

BACKTEST_MAX_WORKERS: 8       # Parallel workers for backtesting (Engine A & B). Increase for faster backtests.
BT_VECTORIZED: true           # Speed path: exact-window indicator caching for Engine A/B backtests (parity-safe target).
ENGINE_B_FAST_FVG_DETECTION: true

SCAN_DEBUG_CANDLE_META: false # Optional scan/debug payload metadata about candle resolution path.

THRESHOLD_AUDIT:
  ENABLED: false
  SHADOW_THRESHOLDS:
    ENGINE_A:
      - current
      - current_minus_5pct
      - current_minus_10pct
      - current_minus_15pct
    ENGINE_B:
      - current
      - current_minus_5pct
      - current_minus_10pct
      - current_minus_15pct
    ENGINE_C:
      - current
      - current_minus_5pct
      - current_minus_10pct

# MT5 forex H4 policy grid: 02/06/10/14/18/22 UTC (2h offset).
# MT5 stocks keep their fixed 3h session offset in market_state.py.
FOREX_H4_RESAMPLE_OFFSET_HOURS: 2.0

# Broker candle safety: do not turn MT5 error payloads with Polygon/yfinance
# fallback candles into execution-eligible Engine A candles.
MT5_CANDLE_FALLBACK_ENABLED: false

# Crypto paper execution is Bybit; use Bybit public data for Engine A live
# SL/TP ATR and derivative context. Binance fallback is off by default so venue
# basis drift cannot silently size Bybit paper trades.
ENGINE_A_CRYPTO_LEVELS_FEED: bybit
ENGINE_A_CRYPTO_LEVELS_SIGNAL_FEED_FALLBACK: false
ENGINE_A_CRYPTO_DERIVATIVES_FEED: bybit
ENGINE_A_CRYPTO_DERIVATIVES_BINANCE_FALLBACK: false
ENGINE_B_CRYPTO_LEVELS_FEED: bybit
ENGINE_B_CRYPTO_LEVELS_SIGNAL_FEED_FALLBACK: false
# Engine B: skip forex signals on 22:00–07:00 UTC (Asian); applies to BT + live scan.
ENGINE_B_FOREX_ASIAN_SESSION_SKIP_ENABLED: true

BINANCE_KLINE_WS_INTERVALS:
  - "1m"
  - "5m"
  - "15m"
  - "1h"
  - "4h"
  - "1d"



# Per-class D1 ADX trend minimum

ADX_TREND_MIN_CLASS:

  crypto: 15

  forex: 20    # ADX 15-20 gets 0.65× soft penalty in factor_scoring; 20 allows developing trends through

  commodity: 25

  stock: 25

  index: 25

# Per-class ADX hard-fail override.  Global default is 15 (from code).
# Crypto class_min=15 collides with global hard_fail=15 leaving zero soft zone;
# setting crypto to 10 creates a genuine 10-15 soft-penalty band.
FACTOR_ADX_HARD_FAIL_CLASS:
  crypto: 10
  forex: 10
  commodity: 10
  stock: 10
  index: 10

# Engine A fail-safe: when both D1 and H4 ADX are unavailable, block the signal
# instead of assigning the old neutral 0.5 multiplier.
ADX_MISSING_BOTH_ABORT: true

# Funding rate addon: baseline (0.01% per 8h) and noise band half-width.
# Narrowed from 0.0002 to 0.0001 so typical Binance/Bybit funding deviations
# are no longer silently absorbed inside the neutral zone.
FACTOR_FUNDING_BASELINE: 0.0001
FACTOR_FUNDING_NOISE_BAND: 0.0001

FACTOR_CONVICTION_FLOOR: 0.20 # Stage 2.1: lowered from 0.60 to allow more signals through

# When the asset class has no addon (stock/index), redistribute the addon's
# weight rather than collapsing it onto momentum.  0.5 splits 50/50 between
# base and momentum, so stock/index conviction becomes 0.35 base + 0.65
# momentum instead of 0.20 base + 0.80 momentum (which made H4 RSI+MACD the
# sole driver).  Code default is 0.0 for backward compat; this YAML override
# is the documented design.
ADDON_UNSUPPORTED_SPLIT_TO_BASE: 0.5

# Per-class ATR% bands for the Engine A volatility-quality scaler.
# Each class defines the ATR/close ratio at which the scaler hits its low
# (boost — precision territory) and high (penalty — noise territory) bounds.
# Linear interpolation between.  Without per-class bands the global default
# (0.005-0.025) was crypto-scale and silently boosted forex on every bar.
# Falls back to VOLATILITY_SCALER_ATR_PCT_LOW/HIGH keys (or code defaults)
# if asset_type missing.
VOLATILITY_SCALER_BANDS:
  forex:     { low: 0.0005, high: 0.0025 }   # EUR/USD H4 ATR ≈ 0.0006-0.0015
  crypto:    { low: 0.010,  high: 0.040 }    # BTC H4 ATR% ~1-2.5% normal, >4% chaotic
  commodity: { low: 0.003,  high: 0.015 }    # XAU/XAG/oil span; nat_gas naturally hits high
  stock:     { low: 0.005,  high: 0.020 }    # US single-name H4 typical 0.5-1.5%
  index:     { low: 0.002,  high: 0.010 }    # SPX/NDX H4 ATR% 0.2-0.6%

ENGINE_A_RESEARCH_LAB_FACTORS:
  ENABLED: true
  BONUS: 0.15
  PENALTY: -0.10
  MAX_ABS: 0.20
  FACTORS:
    - obv_divergence
    - bollinger_touch
    - price_momentum
    - stochastic_cross
  STOCHASTIC_CROSS:
    ENABLED: true
    PAPER_TOOL_ONLY: true
    TIMEFRAME: H4
    ASSET_TYPES:
      - crypto
    SYMBOLS: []   # empty = all crypto pairs; no BTC/ETH block
    K_PERIODS:
      - 5
      - 14
    K_SMOOTH: 3
    D_SMOOTH: 3

# ── Engine A Mean Reversion Factor (config-gated, additive) ─────────────────
# Disabled by default. When enabled, adds a small bounded adjustment (±MAX_ABS)
# based on Bollinger %B, RSI extremes, and price z-score.
ENGINE_A_MEAN_REVERSION:
  ENABLED: false
  MAX_ABS: 0.15
  BB_WEIGHT: 0.40
  RSI_WEIGHT: 0.35
  Z_WEIGHT: 0.25



# Per-class counter-trend penalty (standardized - Trend Gate already handles direction)

COUNTER_TREND_PEN:

  crypto: -1.0

  forex: -1.0

  commodity: -1.0

  stock: -1.0

  index: -1.0



# Per-class RSI bounds

# Crypto: 80/20 - PMC9920669 (2023) + practitioner consensus; BTC/alts regularly sustain

#   RSI 70-90 in bull markets - standard 70/30 causes premature false-reversal warnings.

# Commodity: 80/20 - gold/silver specific research (Metalorix, Kinesis, OpoFinance);

#   precious metals frequently hold RSI 70-80 during trending phases; 70/30 over-signals.

# Forex/stock/index: 70/30 - Wilder standard; well-supported by backtesting literature.

RSI_BOUNDS:

  crypto:    { ob: 80, os: 20 }

  forex:     { ob: 70, os: 30 }

  commodity: { ob: 75, os: 25 }

  stock:     { ob: 70, os: 30 }

  index:     { ob: 70, os: 30 }

  # Score-group overrides — beat asset_type when present.  precious_trackers
  # routes GLD/SLV/XAU/XAG to commodity-style 75/25 even when carried as
  # type=stock; energy_oil routes USO/XLE/CL the same way.  softs (Cocoa,
  # Coffee, Sugar) trend less cleanly so use a tighter 70/30 to avoid
  # premature trend confirmations.
  precious_trackers: { ob: 75, os: 25 }
  energy_oil:        { ob: 75, os: 25 }
  softs:             { ob: 70, os: 30 }



# Per-class backtest macro lookback (D1 bars)

MACRO_LOOKBACK:

  crypto: 15

  forex: 30

  commodity: 50

  stock: 50

  index: 50



# Per-class Weinstein lookback (D1 bars)

WEINSTEIN_LOOKBACK:

  crypto: 60

  forex: 100

  commodity: 150

  stock: 150

  index: 150



# Stage 4.2: BT_MIN / BT_MIN_GROUP / BACKTEST_USE_BT_MIN_THRESHOLDS deleted.
# Single source of truth: scoring.py profile/pair/group resolver plus 3-tier fallback.
# Backtest and live use identical thresholds.

RESEARCH_MODE: false

# Backtest must not alter live pair enable/disable state

BT_AUTO_TOGGLE: false

BT_PERCENTILE_FILTER: false



# ── Engine B (Naked Market Structure) thresholds ──────────────────────────────

# Engine B min_score per style is set in NAKED_ENGINE.style_profiles below (scalp/intraday/swing).

# Both backtest and live scan read from _naked_scan_style_profile() - single source of truth.

# NAKED_MAX_DAILY: Max Engine B trades per pair per day (live auto-trade cap)

NAKED_MAX_DAILY: 3





# ── Engine C Backtest Exit Controls ─────────────────────────────────────────────

# PHASE 3: Explicit config for Engine C BT MAX_HOLD and BE parameters (was hardcoded)

# Defaults match current hardcoded behavior in backtest_runner.py

ENGINE_C_BT_EXIT: &engine_bt_exit_defaults

  forex:

    intraday:

      max_hold_bars: 30      # H4 bars for intraday style

      be_arm_rr: 1.5         # BE triggers at 1.5R

      be_min_target_rr: 2.0  # BE only arms if target RR >= this

    swing:

      max_hold_bars: 60      # H4 bars for swing style

      be_arm_rr: 1.5

      be_min_target_rr: 2.0

    scalp:

      max_hold_bars: 12      # H4 bars for scalp style

      be_arm_rr: 1.5

      be_min_target_rr: 2.0

  crypto:

    intraday:

      max_hold_bars: 40

      be_arm_rr: 1.5

      be_min_target_rr: 2.0

    swing:

      max_hold_bars: 80

      be_arm_rr: 1.5

      be_min_target_rr: 2.0

    scalp:

      max_hold_bars: 12

      be_arm_rr: 1.5

      be_min_target_rr: 2.0

  stock:

    intraday:

      max_hold_bars: 24

      be_arm_rr: 1.5

      be_min_target_rr: 1.5

    swing:

      max_hold_bars: 50

      be_arm_rr: 1.5

      be_min_target_rr: 1.5

    scalp:

      max_hold_bars: 8

      be_arm_rr: 1.5

      be_min_target_rr: 1.5

  commodity:

    intraday:

      max_hold_bars: 24

      be_arm_rr: 1.5

      be_min_target_rr: 1.8

    swing:

      max_hold_bars: 50

      be_arm_rr: 1.5

      be_min_target_rr: 1.8

    scalp:

      max_hold_bars: 10

      be_arm_rr: 1.5

      be_min_target_rr: 1.8

  index:

    intraday:

      max_hold_bars: 24

      be_arm_rr: 1.5

      be_min_target_rr: 1.8

    swing:

      max_hold_bars: 50

      be_arm_rr: 1.5

      be_min_target_rr: 1.8

    scalp:

      max_hold_bars: 10

      be_arm_rr: 1.5

      be_min_target_rr: 1.8


ENGINE_B_BT_EXIT: *engine_bt_exit_defaults





# Engine A trend-state block list - BACKTEST ONLY by default. Live scan tier

# classification is NOT affected unless a "live" scope is explicitly configured.

# Signals in a blocked regime are skipped in backtest entries (funnel["fail_regime"]).

#

# Research 2026-04-18 (factor_dump_intra2.jsonl, n=393 intraday trades,

# 4 crypto + 4 forex):

#   DEAD RANGING - WR 18.5%, avgR -0.59R  (strong block)

#   DEVELOPING   - WR 32.7%, avgR -0.19R  (clear loser)

#   RANGING      - WR 41.3%, avgR +0.12R  (keep)

#   TRENDING     - WR 39.3%, avgR +0.04R  (keep)

#

# Formats accepted:

#   flat list:      applies to backtest only (live untouched) - this is the safe default

#     ENGINE_A_BLOCKED_TREND_STATES: ["DEAD RANGING", "DEVELOPING"]

#   scope dict:     choose scopes explicitly

#     ENGINE_A_BLOCKED_TREND_STATES:

#       backtest: ["DEAD RANGING", "DEVELOPING"]

#       live: []                           # leave live tier classification alone

#   scope + per-class:

#     ENGINE_A_BLOCKED_TREND_STATES:

#       backtest:

#         default: ["DEAD RANGING", "DEVELOPING"]

#         forex: ["DEAD RANGING"]

ENGINE_A_BLOCKED_TREND_STATES:

  - "DEAD RANGING"

  - "DEVELOPING"



# Legacy/admin metadata only. Engine A live/backtest gates use scoring.py's
# resolver: PAIR_PROFILES.*.min_confluence, then ENGINE_A_PAIR_THRESHOLDS /
# ENGINE_A_SCORE_GROUP_THRESHOLDS, then the 3-tier fallback. They do not read this map.
# AUTO_TRADE_MIN_SCORE is a separate auto-trader candidate floor and may be
# higher than the scan/discovery tier.

MIN_CONFLUENCE_CLASS:

  crypto:    2.4

  forex:     2.1

  commodity: 1.8

  stock:     1.8

  index:     1.5

ENGINE_A_PAIR_THRESHOLDS: {}

ENGINE_A_SCORE_GROUP_THRESHOLDS:

  default: 1.5

  crypto_btc: 2.0

  crypto_eth: 2.0

  crypto_alt_majors: 2.0

  crypto_doge: 2.0

  crypto_other: 2.0

  nat_gas: 2.0

  forex_exotics: 1.7

  softs: 1.7

ENGINE_A_ATR_LEVEL_CLASS_BY_DISPLAY:

  SPY: etf

  QQQ: etf

  GLD: etf

  TLT: etf_bond

  IWM: etf

  EEM: etf

  DIA: etf

  GDX: etf

  SOXX: etf

  XLF: etf

  XLE: etf

  SLV: etf

  USO: etf

ENGINE_A_ATR_LEVEL_CLASS_BY_SCORE_GROUP: {}

ENGINE_A_COT_ADDON_ASSET_TYPES:

  - commodity

  - index

  - stock



# Per-scan cross-sectional quantile gate (optional). When enabled, effective threshold =

# max(static MIN_CONFLUENCE_*, percentile cut) per asset class so only ~top fraction of

# that scan's scores can clear trade tier (self-scales with regime).

SCAN_QUANTILE_ENABLED: false

SCAN_QUANTILE_MIN_SAMPLES: 5

# Asset types that skip quantile (static MIN_CONFLUENCE_* only). Crypto often fails when

# max(static, percentile_cut) lifts the bar above tight subgroup floors after a few high scores.

SCAN_QUANTILE_EXCLUDE_TYPES:

  - crypto

SCAN_QUANTILE_TOP_FRACTION:

  default: 0.20

  crypto: 0.18

  forex: 0.22

  stock: 0.15

  index: 0.15

  commodity: 0.18



# Risk settings

RISK_PCT: 0.01

MIN_CONFLUENCE: 1.0

VOLUME_THRESHOLD: 1.5

VOLUME_THRESHOLD_BACKTEST: 1.2



# Backtest statistical reporting and transaction-cost assumptions.
# BT_NUM_VARIANTS_TRIED feeds Deflated Sharpe; increase it when comparing many
# strategy/config variants in a research run.
BT_NUM_VARIANTS_TRIED: 1

BT_BOOTSTRAP_CI_ITERATIONS: 1000

BT_SLIPPAGE_MODEL:

  ENABLED: true

  K1_TICK_MULT: 1.0

  K2_ATR_IMPACT: 0.10

  DEFAULT_QTY_ADV_RATIO: 0.001

  MAX_SLIPPAGE_PCT: 0.01



# Round-trip fee per trade as fraction of notional (entry + exit commission)

# Bybit taker 0.055% × 2 sides = 0.11%; forex ECN ~0.02% × 2 = 0.04%

FEE_PCT:

  crypto:    0.0011

  forex:     0.0004

  commodity: 0.0004

  stock:     0.0006

  index:     0.0004



# ── Execution Engine ──────────────────────────────────────

# Indicator correlation filter - expensive O(n²) operation, disable for backtest speed

# Enable only when doing deep live analysis; backtest accuracy unaffected without it

INDICATOR_CORRELATION_ENABLED: false



EXECUTION_ENABLED: true       # Enable manual execution via dashboard

AUTO_EXECUTE: false            # Manual click only (no auto-fire)

# ── eToro Adapter (scaffold) ─────────────────────────────────────────────
# Default-safe: docs/integration only until explicitly wired into execution routing.
ETORO:
  ENABLED: false
  DEMO_MODE: true
  BASE_URL: "https://public-api.etoro.com"
  REQUEST_TIMEOUT_SEC: 10



# ── Auto-Trader ────────────────────────────────────────────

AUTO_TRADE_ENABLED: false          # Start auto-trader on server boot

# AUTO_TRADE_MIN_SCORE is the scan floor that decides which signals reach the

# auto-trader candidate list. It is not the final live execute gate.

# Factor engine (crypto/stock/commodity/index) outputs 0-3.0.

AUTO_TRADE_MIN_SCORE:

  crypto:    2.4    # align with MIN_CONFLUENCE_CLASS.crypto

  forex:     2.1    # align with MIN_CONFLUENCE_CLASS.forex

  commodity: 1.8    # align with MIN_CONFLUENCE_CLASS.commodity

  stock:     1.8    # align with MIN_CONFLUENCE_CLASS.stock

  index:     1.8    # scan tier remains 1.5; auto score floor adds confirmation gap

# AUTO_TRADE_MIN_CONVICTION is the real live gate used inside auto_trader.py.

# Metric: combinedConviction on a 0-1 scale. When Engine A + B align, the live

# gate gets a 15% discount (effective min = configured min * 0.85).

AUTO_TRADE_MIN_CONVICTION:

  default: 0.50

AUTO_TRADE_MAX_DAILY: 10           # Demo mode: max auto-executions per day

AUTO_TRADE_MAX_PER_SCAN: 1         # Max per scan cycle; raise to 2 only with >10 active pairs

AUTO_TRADE_SCAN_INTERVAL_MIN: 30   # Scan every 30 minutes

MAX_PORTFOLIO_HEAT: 0.06      # 6% total risk across all positions

MAX_OPEN_POSITIONS: 20        # Testing only - revert before live

MAX_CORRELATED_POSITIONS: 3   # Allow up to 3 correlated positions (e.g. 3 USD pairs)

SIGNAL_MAX_AGE_SEC: 300       # 5 min freshness window

FOREX_SESSION_FILTER: true    # true = London+NY+Asian only; false = 24h (disable for testing)

SERVER_TZ_OFFSET_HOURS: 2    # Your local timezone UTC offset - SAST = 2 (GMT+2)


# Forex scoring engine (merged into CONFIG["FOREX_ENGINE"] - see config.py for full defaults)

FOREX_ENGINE:

  # Session multipliers - read by factor_scoring._session_mult() (live) and forex_scoring._session_state() (legacy).

  session_mode: "soft"               # forex_scoring legacy: "soft" = off-session active at reduced mult

  session_soft_multiplier: 0.75      # Off-session (Asian / off-hours) score multiplier

  session_shoulder_enabled: true

  session_shoulder_multiplier: 0.90  # Shoulder hour (±1h of core) score multiplier

  session_shoulder_hours: 1          # Hours either side of core sessions treated as shoulder

MAX_RISK_PER_TRADE: 0.03      # Hard cap 3% per trade

DRAWDOWN_REDUCE_THRESHOLD: 0.10   # Halve size at 10% drawdown

DRAWDOWN_STOP_THRESHOLD: 0.15     # Stop all trading at 15% drawdown

DATA_FRESHNESS_GATES:
  WARN_ON_STALE_SCAN: true
  BLOCK_EXECUTION_ON_STALE: true
  BLOCK_TIMEFRAMES:
    - H1
    - H4
    - D1
  BLOCK_SEVERITIES:
    - missing_current_bucket
    - stale_1_bucket
    - stale_multi_bucket
    - error_path_mismatch
    - error_offset_mismatch



# ── EODHD Sentiment Gate ──────────────────────────────────

SENTIMENT_GATE_ENABLED: true       # Check news sentiment before auto-trades

SENTIMENT_BLOCK_THRESHOLD: 0.4     # Block if sentiment opposes direction by >0.4

SENTIMENT_ALIGN_THRESHOLD: 0.3     # Mark as aligned when sentiment supports direction beyond this level

SENTIMENT_API_FAIL_CLOSED: false   # If true, blocks auto-execution if the sentiment API fails



# ── EODHD Event Risk Filter ──────────────────────────────

EVENT_RISK_ENABLED: false          # EODHD economic-events calls disabled; do not use economic calendar API

EVENT_RISK_HOURS: 4                # Hours ahead to check for events

EVENT_RISK_API_FAIL_CLOSED: false  # If true, blocks auto-execution if the event calendar API fails



# ── Adaptive factor weights (factor_scoring.py) ─────────────

ADAPTIVE_WEIGHTS_ENABLED: false



# ── Backtest Parity Controls ─────────────────────────

BACKTEST_EVENT_RISK_GATING: false

BACKTEST_SENTIMENT_GATING: false

BACKTEST_DISABLE_HURST_GATE: false  # Measurement complete 2026-04-18: disabling added +2 trades / +1.6pp WR on GBP/USD - within noise. Hurst gate is not the edge problem.



# ── Adaptive Kelly Position Sizing ────────────────────────

ADAPTIVE_KELLY_ENABLED: true       # Use fractional Kelly for dynamic position sizing

KELLY_FRACTION: 0.5                # Half-Kelly (safety proven)



# ── Signal Debate (Bull/Bear/Judge) ───────────────────────

SIGNAL_DEBATE_ENABLED: true        # Run LLM debate before auto-trades (needs XAI_API_KEY)

AI_BASE_URL: "https://api.x.ai/v1"

AI_MODEL: "grok-4.3"

XAI_MODEL: "grok-4.3"  # Legacy alias kept aligned with AI_MODEL for compatibility.

# Optional: POST /api/lottery/ai-analysis model (defaults to AI_MODEL). Same OpenAI SDK + xAI base URL.

# LOTTERY_AI_MODEL: "grok-4.3"

DEBATE_MODEL: "grok-4.3"

VISION_MODEL: "grok-4.3"          # /api/chart-analysis

NEWS_SENTIMENT_MODEL: "grok-4.3"  # News AI text; defaults to AI_MODEL if empty - uses XAI_API_KEY

# Default OpenAI-compatible SDK read timeout is much longer; keep advisory AI bounded.
AI_REQUEST_TIMEOUT_SEC: 30
MARCUS_AI_TIMEOUT_SEC: 90
# Keep Marcus manual reviews bounded; SDK default retries can multiply the timeout.
MARCUS_AI_SDK_MAX_RETRIES: 0
# Retry loop inside run_ai() for transient timeouts (independent of SDK retries).
MARCUS_AI_MAX_RETRIES: 2
MARCUS_AI_RETRY_BACKOFF_SEC: 3.0

# Prompt-store janitor is conservative: recent files are preserved even when size cap is exceeded.
AI_PROMPT_STORE_CLEANUP_ENABLED: true
AI_PROMPT_STORE_RETENTION_DAYS: 90
AI_PROMPT_STORE_MIN_DELETE_AGE_DAYS: 7
AI_PROMPT_STORE_MAX_BYTES: 1073741824  # 1 GiB
AI_PROMPT_STORE_CLEANUP_INTERVAL_SEC: 86400

# Blend News AI into Engine A scan score (EODHD news + Kimi). Heavy: uses TTL cache per pair.

NEWS_SENTIMENT_CONFLUENCE_ENABLED: false

NEWS_SENTIMENT_CACHE_TTL_SEC: 900                # seconds; same pair reuses vote until expiry

NEWS_SENTIMENT_SCORE_IMPACT: 0.06               # delta = impact * maxScore * vote (vote ~ -1..1)

NEWS_SENTIMENT_ATTACH_SUMMARY: true             # attach short summary on each signal JSON

NEWS_PAIR_CAP: 40   # Max pairs to fetch per-pair EODHD news and word weights per refresh

AI_STRUCTURED_OUTPUTS: true

AI_TEMPERATURE: 0.3

AI_VISION_TEMPERATURE: 0.2

AI_VISION_CAN_UPGRADE_TRADE: false  # Vision CONFIRM cannot create trade=True; downgrade only by default

ENGINE_B_PROFILE_SCORING_ENABLED: true



# ── AI Learning ───────────────────────────────────────────

LEARNING_ENABLED: true             # Enable AI self-learning (outcome extraction + prompt injection)

LEARNING_LOOKBACK_DAYS: 90         # How many days of trade history to use for learning context

LEARNING_MIN_TRADES: 30            # Minimum trades required before injecting learning context into AI prompts

META_ANALYSIS_ENABLED: true        # false = skip auto-trader weekly AI meta-analysis (manual POST still works)

EODHD_EARNINGS_CALENDAR_ENABLED: false   # false = skip unsupported EODHD earnings calendar endpoint entirely



# ── EODHD Insider / Fundamentals Enrichment ───────────────

INSIDER_TRADING_ENABLED: true      # Advisory stock enrichment; Engine A reports diagnostic only

FUNDAMENTALS_ENABLED: true         # Advisory stock enrichment; Engine A reports diagnostic only

