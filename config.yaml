AUTO_TRADE_SCHEDULER_MODE: confirmed_close

AUTO_TRADE_EXECUTION_GRACE_MIN: 120

AUTO_TRADE_ALLOW_INTRABAR_REVIEW: true

AUTO_TRADE_ALLOW_INTRABAR_EXECUTION: false

AUTO_TRADE_BLOCKED_TREND_STATES:

