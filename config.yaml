# ── Engine A VWAP Direction Quality Filter ──────────────────────────────────
# Adds a small multiplier (0.95–1.05) based on whether price is on the
# institutionally-favoured side of session VWAP. Price above VWAP favours
# longs; price below favours shorts. Disabled by default — enable after
# backtest validation.
ENGINE_A_VWAP_FILTER:
  ENABLED: false
  MAX_BOOST: 0.03     # max score boost when price is on the right side of VWAP
  MAX_PENALTY: -0.03  # max score penalty when price is on the wrong side
  CANDLE_LOOKBACK: 96 # H4 bars for session VWAP (96 × 4h = 16 days)


# ── Engine A Stochastic RSI (experimental, config-gated) ───────────────────
# Adds Stochastic RSI as an additional momentum quality filter. Stochastic RSI
# applies the Stochastic oscillator formula to RSI values, providing more
# sensitive overbought/oversold signals. Disabled by default — enable after
# backtest validation.
ENGINE_A_STOCHASTIC_RSI:
  ENABLED: false
  RSI_PERIOD: 14      # RSI calculation period
  STOCH_PERIOD: 14   # Stochastic period applied to RSI
  K_SMOOTH: 3         # %K smoothing period
  D_SMOOTH: 3         # %D smoothing period
  OVERBOUGHT: 80      # Overbought threshold
  OVERSOLD: 20        # Oversold threshold



