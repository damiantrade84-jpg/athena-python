# Ranging ADX bucket boundaries used by regime.py.

RANGING:

  crypto:

    dead: 18

    choppy: 23

  forex:

    dead: 18

    choppy: 23

  commodity:

    dead: 18

    choppy: 23

  stock:

    dead: 16

    choppy: 21

  index:

    dead: 16

    choppy: 21


# ── Per-class TRENDING / DEVELOPING ADX cutoffs (regime classifier) ───────────
# Mirrors the per-class RANGING.dead/choppy structure above so the TRENDING /
# DEVELOPING regime label (scoring._resolve_trend_state) is class-aware like the
# ADX *gate* (ADX_TREND_MIN_CLASS) already is. The universal 35 / 25 cutoffs
# mislabelled crypto/forex trends the gate fully credits at ADX 18-20.
#
# #3 completion (2026-05-28) — values now DIFFERENTIATED (no longer the universal
# placeholder). Derivation (internal coherence, NOT n>=30 outcome evidence):
#   DEVELOPING = the class ADX gate-min (ADX_TREND_MIN_CLASS: crypto 18 / forex 20 /
#                equities-commodity 25) — a bar the gate fully credits is at least
#                DEVELOPING, no longer mislabelled RANGING.
#   TRENDING   = gate-min + the universal 10-pt band (35-25), so crypto 28 / forex 30;
#                equities/commodity keep the historical 35.
# Live impact is minimal (ENGINE_A_REGIME_DYNAMIC_THRESHOLDS is OFF and
# AUTO_TRADE_BLOCKED_TREND_STATES blocks only DEAD RANGING for crypto / nothing for
# forex). BACKTEST impact is real: crypto/forex ADX in the new DEVELOPING band are
# blocked by ENGINE_A_BLOCKED_TREND_STATES (DEVELOPING). Reversible: reset all to
# 35 / 25 to restore the universal classifier. Unlisted classes fall back to the
# universal TRENDING_ADX / DEVELOPING_ADX scalars.
TRENDING_ADX_CLASS:
  crypto: 28
  forex: 30
  commodity: 35
  stock: 35
  index: 35
DEVELOPING_ADX_CLASS:
  crypto: 18
  forex: 20
  commodity: 25
  stock: 25
  index: 25


# Live crypto microstructure (WS-injected order book / flow) as an Engine A factor.

# Research validation: enabled. Live WS microstructure remains separately gated in factor_scoring.

CRYPTO_LIVE_MICROSTRUCTURE_SCORING_ENABLED: true



# Per-indicator weights WITHIN each factor group.

# These control how individual indicators contribute to their parent factor score.

# Keys must match indicator names in factor_scoring.py directional_factors and nondirectional_factors.

# Missing keys default to 1.0 (equal weight). Set to 0.0 to disable an indicator.

INDICATOR_WEIGHTS:

  # TREND factor: D1 is the tide (dominant), H4 is momentum, H1 is entry timing

  # Equal weighting treats a normal H1 pullback as weak direction - wrong for trend-following.

  # D1-dominant: pullback in strong D1 trend scores 0.60 instead of 0.33.

  trend:

    crypto:

      d1_ema_trend: 0.5

      h4_ema_trend: 0.3

      ema_trend: 0.2

    forex:

      d1_ema_trend: 0.5

      h4_ema_trend: 0.3

      ema_trend: 0.2

    commodity:

      d1_ema_trend: 0.5

      h4_ema_trend: 0.3

      ema_trend: 0.2

    stock:

      d1_ema_trend: 0.4

      h4_ema_trend: 0.35

      ema_trend: 0.25

    index:

      d1_ema_trend: 0.4

      h4_ema_trend: 0.35

      ema_trend: 0.25

  # MOMENTUM: RSI is more responsive for forex; MACD lags but confirms.

  # Crypto: VMS stays here; live WS microstructure is a separate factor (gated).

  momentum:

    default:

      rsi_z: 0.6

      macdLine_z: 0.4

    crypto:

      rsi_z: 0.5

      macdLine_z: 0.3

      volume_momentum_spread: 0.2



# Factor scoring gates

