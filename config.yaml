  crypto_doge:       { trigger_atr: 11, rejection_wick_body: 1.0, engulfing_body_atr: 0.35, strong_close_pct: 0.75 }
  crypto_alt_majors: { trigger_atr: 11, rejection_wick_body: 1.0, engulfing_body_atr: 0.35, strong_close_pct: 0.75 }
  crypto_other:      { trigger_atr: 11, rejection_wick_body: 1.0, engulfing_body_atr: 0.35, strong_close_pct: 0.75 }
  precious_trackers: { trigger_atr: 10, rejection_wick_body: 1.3, engulfing_body_atr: 0.25, strong_close_pct: 0.70 }
  copper:            { trigger_atr: 10, rejection_wick_body: 1.3, engulfing_body_atr: 0.25, strong_close_pct: 0.70 }
  pgm_metals:        { trigger_atr: 10, rejection_wick_body: 1.3, engulfing_body_atr: 0.25, strong_close_pct: 0.70 }
  energy_oil:        { trigger_atr: 12, rejection_wick_body: 1.2, engulfing_body_atr: 0.30, strong_close_pct: 0.70 }
