ENGINE_B_REGIME_MULTIPLIERS:
  TRENDING: 0.85
  RANGING: 1.15
  HIGH_VOLATILITY: 1.20
  LOW_VOLATILITY: 1.00

# Engine B AI news context — feeds news into AI advisory review (not checklist)
ENGINE_B_NEWS_CONTEXT_ENABLED: true
ENGINE_B_ZONE_PERSISTENCE: false

# Forex structure timeframe for Engine B naked trading.
# "D1" = use daily candles for swing/BOS/CHoCH detection (filters H1 noise).
# "H1" = original behaviour (noisier on forex, fine for crypto/stocks).
# H4 is always used for zones and entry triggers regardless of this setting.
ENGINE_B_FOREX_STRUCTURE_TF: "D1"

# Engine B backtest SL/TP mode:
# "atr" = use Engine A calc_levels (ATR × multiplier) — proven, matches bar resolution
# "structural" = use Engine B naked zone placement (behind swing lows) — wider stops
ENGINE_B_BT_SL_MODE: "atr"

# AI usage control — when true, AI only runs on explicit user actions
# (manual analysis clicks, compare engines) — NOT on automatic scans
AI_ON_DEMAND_ONLY: true

# Engine C B-side fallback controls:
# Allow strong Engine B setups to be scored/tradeable even when Engine A is missing
# or weakly opposing, instead of hard-discarding on mismatch.
ENGINE_C_B_ONLY_MULT: 0.65
ENGINE_C_B_CONFLICT_OVERRIDE_ENABLED: true
ENGINE_C_B_CONFLICT_MIN_SCORE: 0.70
ENGINE_C_A_CONFLICT_MAX_SCORE: 0.45
ENGINE_C_B_CONFLICT_PENALTY: 0.85
VISION_MODIFIERS:
  STRONG: {action: "confirm", conviction_mult: 1.15}
  MODERATE: {action: "confirm", conviction_mult: 1.0}
  WEAK: {action: "weaken", conviction_mult: 0.70}
  AVOID: {action: "override", conviction_mult: 0.0}
  CONTRADICTS: {action: "contradict", conviction_mult: 0.0}

# ── Scalp Engine (Engine D) ───────────────────────────────────────────
SCALP_ENGINE:
  enabled: true
  M15_CANDLES: 500
  M5_CANDLES: 1000
  H1_CANDLES: 300
  SESSION_FILTER: true          # London/NY only
  WITH_TREND_ONLY: true         # Reject counter-trend scalp setups
  BIAS_TIMEFRAME: "H1"          # Higher-TF direction gate for scalp signals
  MAX_SPREAD_PIPS:              # Per asset class
    forex: 4
    commodity: 8
    crypto: 0                   # disabled — spread not applicable for crypto perpetuals
    index: 6
    stock: 5
  MIN_RR: 1.5
  TP2_ENABLED: true             # Second TP at next M15 swing
  AI_GRADING: true              # Enable rule-based AI quality score
  MIN_GRADE_AUTO_EXECUTE: "B"   # Don't auto-execute below B grade
  ZONE_MIN_CONDITIONS: 2        # Valid zone needs >= N conditions
  # SCALP_PAIRS: []             # Uncomment + list pairs to restrict scan to specific pairs only
  #                             # Leave commented/empty to scan ALL pairs (default full set)
