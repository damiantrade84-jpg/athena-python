# Athena v3.0 - Tunable thresholds (override CONFIG defaults)

# Edit this file and restart to apply changes - no code deploy needed.



# ── Paper/Demo Soak Mode ────────────────────────────────────────────────────────

# When ENABLED is true, managed execution never calls the broker (paper-only)
# and returns PAPER_SOAK_BLOCKED_REAL_ORDER from run_managed_execution / lifecycle.
#
# For Bybit demo / MT5 demo broker orders without editing tracked config.yaml:
#   1. Copy config.local.example.yaml → config.local.yaml (gitignored).
#   2. Set ATHENA_REAL_ORDERS_CONFIRM=I_UNDERSTAND_REAL_ORDER_RISK in the environment
#      (required whenever real/demo orders are enabled — boot will fail without it).
#
# Or override only on this machine via the same keys in config.local.yaml.

PAPER_SOAK:
  ENABLED: true
  REAL_ORDERS_ALLOWED: false
  LOG_ALL_SIGNALS: true
  LOG_BLOCKED_SIGNALS: true
  LOG_EXECUTION_DECISIONS: true
  REQUIRED_FRESHNESS_GATE: true



# ── Candle depth for analyze_pair / scans (Engine A indicators) ─────────────

# Fetched per TF, then last bar dropped (forming). Must satisfy analyze_pair mins:

# len(d1)>=220, len(h4)>=50, len(h1)>=50 after drop.

# H4/H1/D1 default 1000 avoids Bybit pagination while retaining ~999 closed bars

# closed bars while charts can keep the live bar for visibility.

# Reduce for lighter scans (EMA on chart vs signal.snap will diverge).

D1_CANDLES: 1000

H4_CANDLES: 1000

H1_CANDLES: 1000
M30_CANDLES: 500  # Active Engine A forex intraday entry/setup bars.
M15_CANDLES: 500  # Active Engine B forex intraday trigger bars.
M5_CANDLES: 1000  # Policy-driven execution/refinement bars; never a higher-TF fallback.

# EODHD bulk last-day URL uses /eod-bulk-last-day/{EXCH}; some suffixes (COMM) are not supported → HTTP 404.
# Those pairs still receive D1 via normal EOD candle fetch; CandleBuilder bulk refresh skips them only.
CANDLE_BUILDER_BULK_D1_SKIP_EXCHANGES: ["COMM"]

SCAN_MAX_WORKERS: 8           # Increased scan concurrency for faster Engine A full-universe runs. (Conservative: 8 for i7/16GB)



# ── News / EODHD sentiment background refresh ────────────────────────────────

# Background loop fetches: economic calendar, sentiment batch only.

# Per-pair news + word-weights are fetched ON-DEMAND when AI analysis is requested.

NEWS_BG_INTERVAL_SEC: 3600    # How often the background news loop runs (seconds). Default 3600 = 1 hour.

NEWS_PAIR_CACHE_TTL_SEC: 14400 # How long per-pair news/word-weights are cached after an AI fetch (seconds). Default 14400 = 4 hours.

BACKTEST_MAX_WORKERS: 10      # Parallel workers for backtesting (Engine A & B). (Conservative: 10 for i7/16GB)
BACKTEST_LOOKBACK_DAYS: 365   # Calendar days of history for Engine A/B/C backtests (was hardcoded 730).
BT_VECTORIZED: true           # Speed path: exact-window indicator caching for Engine A/B backtests (parity-safe target).
BACKTEST_DATA_AS_OF: null     # Optional YYYY-MM-DD frozen dataset manifest. Null = normal live/cache-backed backtest data.
ENGINE_A_STRUCTURAL_SHADOW_ENABLED: false  # Research-only attachment; never executable.
ENGINE_B_FAST_FVG_DETECTION: true

SCAN_TIMEOUT_SEC: 45          # Per-pair scan timeout in seconds (faster fail for stalled pairs)

SCAN_DEBUG_CANDLE_META: false # Optional scan/debug payload metadata about candle resolution path.

# Pre-scoring freshness gate: skip indicator calculation when any required TF
# (D1/H4/H1) is stale. Prevents wasted CPU and false signal log entries.
PRE_SCORING_FRESHNESS_GATE_ENABLED: true

# MT5 H4/H1 calendar-gap grace for stock/index/commodity confirmed-only scoring.
# Covers weekends and US off-hours when last confirmed bar legitimately lags.
MT5_INTRADAY_CALENDAR_GAP_GRACE_BUCKETS:
  H4: 30
  H1: 120
  default: 24

# Engine A minimum confirmed bars after market-state split (defaults unchanged).
ENGINE_A_MIN_D1_BARS: 220
# H4/H1 minimums are 60: V3 setup candidates (breakout/ORB/london_open) need
# >=60 confirmed bars; the old 50-bar floor let setups compute on insufficient
# history (evaluator hard reject stays at <50).
ENGINE_A_MIN_H4_BARS: 60
ENGINE_A_MIN_H1_BARS: 60
ENGINE_A_V3_BACKTEST:
  SPREAD_BPS: 2.0
  COMMISSION_BPS: 1.0
  SLIPPAGE_BPS: 1.0
  SWAP_BPS_PER_DAY: 0.5
  MAX_HOLD_BARS: 24
  # Per-asset-class overrides so everyday backtests carry exchange-grade
  # crypto costs instead of the flat forex-grade base. COMMISSION_BPS and
  # SLIPPAGE_BPS are PER LEG (the v3 cost model doubles them round trip):
  # Bybit taker 5.5 bps/leg -> 11 bps round trip, matching FEE_PCT.crypto.
  BY_ASSET:
    crypto:
      COMMISSION_BPS: 5.5
      SLIPPAGE_BPS: 2.0
      SWAP_BPS_PER_DAY: 1.0

# Demo-only activation for deterministic V3 specialists without promoted artifacts.
# This does not force TRADE decisions and cannot pass the V3 live/autopilot guards.
ENGINE_A_V3_DEMO_UNVALIDATED_ENABLED: true
ENGINE_A_V3_PROFILE_TTL_DAYS: 90

# Run the pre-policy V3 evaluation as a shadow alongside the policy-authoritative
# evaluation. The shadow feeds legacyScore/legacyDirection (rollback diagnostics in
# timeframe_policy.apply_authoritative_policy_result and the signal-card UI).
# Default ON; set false to skip the second scoring pass. Ignored when no
# authoritative policy is active (the legacy evaluation is then the primary one).
ENGINE_A_V3_LEGACY_SHADOW_ENABLED: true

# Per-group thesis for the v3 forex specialist: "trend" (default, unchanged) or
# "mean_reversion" (range-fade, counter-trend). Reversible via this key.
ENGINE_A_V3_FOREX_THESIS: trend
# Forex setup selector: "trend" (breakout/pullback) or "london_open" (Asian IB breakout).
ENGINE_A_V3_FOREX_SETUP: trend
# Adds the range-fade specialist (fx_range_mean_reversion) to the forex setup
# candidates alongside the trend specialists (2026-07-28). The fade can only fire
# in a ranging regime (low efficiency + momentum-anchor ADX below the class gate)
# — exactly the regime where good-scoring forex trend signals systematically
# lost. Direction opposition stays blocked by ENGINE_A_V3_SETUP_QUANT_CONFLICT_GUARD.
# Reversible: false.
ENGINE_A_V3_FOREX_MR_OVERLAY_ENABLED: true
# V3 setup overlay may only upgrade WATCH -> TRADE; when a setup fires TRADE in the
# OPPOSITE direction of the quant scorer, fall back to the quant path instead of
# flipping direction (rejection reason: setup_direction_conflicts_quant).
ENGINE_A_V3_SETUP_QUANT_CONFLICT_GUARD: true
ENGINE_A_V3_SETUP_UPGRADE:
  ENABLED: true
  MIN_CONFLUENCE_FRAC: 0.75
  # Mean-reversion upgrades are exempt from the quant confluence floor (2026-07-28):
  # the fade only exists in ranging regimes, where the trend-aligned quant score
  # is structurally near zero, so a trend-side floor can never be met. Directional
  # opposition is still blocked by ENGINE_A_V3_SETUP_QUANT_CONFLICT_GUARD.
  # Raise toward 0.75 to re-tighten without a code change.
  MR_MIN_CONFLUENCE_FRAC: 0.0
ENGINE_A_V3_SESSION_SCORING:
  ENABLED: true
  MIN_SCORE: 0.40  # raised with quant session gate (was 0.35)
ENGINE_A_V3_MEAN_REVERSION:
  Z_ENTRY: 1.5
  EFF_MAX: 0.35
  LOOKBACK: 20
  # MR fade stop geometry (build_mean_reversion_levels). SL_BUFFER_ATR is the
  # buffer beyond the local swing; MIN_RISK_ATR floors the TOTAL stop distance
  # (0.0 = legacy swing+buffer only). 2026-07-28: forex floor 1.0x ATR — the
  # bare ~0.5x ATR buffer on the M30 setup rung put the stop inside the ATFX
  # spread band, and the spread-to-SL gate blocked every fade. Wider stops
  # shrink rr2, so min_rr 1.0 still decides which fades are worth taking.
  SL_BUFFER_ATR: 0.5
  MIN_RISK_ATR: 0.0
  BY_ASSET:
    forex: { MIN_RISK_ATR: 1.0 }
  # The MR regime switch reads ADX + Bollinger state from the entry/setup rung and
  # then overrides the multi-timeframe consensus direction outright. Require the
  # momentum-anchor rung to be non-trending too, so a low-ADX pocket on a fast rung
  # (M30 ADX 15) cannot flip a signal whose anchor is genuinely trending (H4 ADX 28
  # with aligned DI) into a counter-trend fade. Reversible: set false.
  REQUIRE_HIGHER_TF_ADX_CONFIRMATION: true
# V3 directional ramp — uses dir_sum (weighted signal×quality), NOT V2 trend_score.
# Thresholds live in ENGINE_A_V3_DIRECTIONAL_RAMP_BY_CLASS (~0.04–0.06 min).
# Do not point V3 at ENGINE_A_DIRECTIONAL_RAMP_BY_CLASS (V2 scale ~0.20–0.25).
ENGINE_A_V3_DIRECTIONAL_RAMP:
  ENABLED: true
  APPLY_TO_CONFLUENCE: true
ENGINE_A_V3_DIRECTIONAL_RAMP_BY_CLASS:
  crypto_btc: { min_directional: 0.04, soft_span: 0.06 }
  crypto_eth: { min_directional: 0.04, soft_span: 0.06 }
  crypto_alt_majors: { min_directional: 0.04, soft_span: 0.06 }
  crypto_doge: { min_directional: 0.045, soft_span: 0.055 }
  crypto_other: { min_directional: 0.05, soft_span: 0.05 }
  forex_majors: { min_directional: 0.05, soft_span: 0.07 }
  forex_crosses: { min_directional: 0.05, soft_span: 0.07 }
  forex_other: { min_directional: 0.05, soft_span: 0.07 }
  forex_exotics: { min_directional: 0.045, soft_span: 0.065 }
  us_stock_single: { min_directional: 0.06, soft_span: 0.08 }
  stock_other: { min_directional: 0.06, soft_span: 0.08 }
  us_indices_trackers: { min_directional: 0.05, soft_span: 0.07 }
  eu_indices: { min_directional: 0.05, soft_span: 0.07 }
  asian_indices: { min_directional: 0.05, soft_span: 0.07 }
  index_other: { min_directional: 0.05, soft_span: 0.07 }
  precious_trackers: { min_directional: 0.05, soft_span: 0.08 }
  energy_oil: { min_directional: 0.05, soft_span: 0.08 }
  nat_gas: { min_directional: 0.05, soft_span: 0.08 }
  copper: { min_directional: 0.05, soft_span: 0.08 }
  pgm_metals: { min_directional: 0.05, soft_span: 0.08 }
  base_metals: { min_directional: 0.05, soft_span: 0.08 }
  softs: { min_directional: 0.05, soft_span: 0.08 }
  commodity_other: { min_directional: 0.05, soft_span: 0.08 }
# Forex quant TRADE must also pass session scoring (not only setup upgrades).
ENGINE_A_V3_QUANT_SESSION_GATE:
  ENABLED: true
  MIN_SCORE: 0.40
# Mean-reversion: block forced fade when trend+momentum violently oppose location.
ENGINE_A_V3_MR_OPPOSITION_GUARD:
  ENABLED: true
  MIN_OPPOSE_QUALITY: 0.55
  # Both trend AND momentum must oppose the fade at >= MIN_OPPOSE_QUALITY before the
  # consensus direction is restored. Kept as-is (true): loosening it to "either"
  # makes mean reversion unreachable whenever the EMA stack is cleanly aligned,
  # which it often is even inside a range. The narrower problem — the MR regime
  # being decided on the entry rung alone — is handled by
  # ENGINE_A_V3_MEAN_REVERSION.REQUIRE_HIGHER_TF_ADX_CONFIRMATION instead.
  REQUIRE_BOTH: true

# Engine A location component. Trend-mode location measures entry *timing*
# (distance from the trend EMA), not side. TREND_TIMING_ONLY: true stops the
# aggregator from discarding it when price sits on the pullback side of the EMA
# — previously a LONG half an ATR above ema21 was credited in full while a LONG
# half an ATR below ema21 (the higher-quality pullback entry) contributed zero,
# and location also nudged direction toward whichever side price was extended to.
# Reversible: set false to restore the directional behaviour.
ENGINE_A_V3_LOCATION:
  TREND_TIMING_ONLY: true
# Structural SL must be at least this many ATRs from entry (noise-stop floor).
ENGINE_A_V3_STRUCTURAL_SL_FLOOR_ATR_MULT: 0.35
# Structural trend geometry (Engine A V3). Global defaults = historical contract
# (0.8×ATR min stop, TP1=1.0R, ATR from entry TF). Set BY_ASSET.forex to try
# wider stops / higher TP1 / structure-TF ATR without touching other classes.
ENGINE_A_V3_STRUCTURAL_GEOMETRY:
  ENABLED: true
  SL_MIN_ATR_MULT: 0.8
  TP1_RR: 1.0
  LEVELS_ATR_TF: entry
  BY_ASSET:
    # 2026-07-28 (UNVALIDATED judgment values, not outcome-backed): TP1 1.0R ->
    # 1.5R for forex now that live regime gating keeps trend trades out of
    # ranging markets; continuation regimes support a further first target.
    # SL_MIN 0.8 -> 1.2x ATR: the 0.8x floor put pullback-entry stops inside the
    # ATFX spread band on the M30 setup rung (spread-to-SL gate blocked the
    # whole class); pairs with the raised MAX_EXECUTION_SPREAD_TO_SL_RATIO
    # forex 0.20. Reversible: remove this block to restore the globals.
    forex: { TP1_RR: 1.5, SL_MIN_ATR_MULT: 1.2 }
# Port selected V2 expectancy filters into V3 (multipliers / WATCH demotion).
# BLOCKED_TREND_STATES only demotes when ENGINE_A_BLOCKED_TREND_STATES explicitly
# configures a "live" scope. A flat list stays backtest-only (research contract in
# scoring.get_blocked_trend_states) — it must NOT demote live scans.
ENGINE_A_V3_LEGACY_FILTERS:
  ENABLED: true
  FOREX_EMA_CLUSTER: true
  CRYPTO_LATE_TREND: true
  BLOCKED_TREND_STATES: true
# Commodity setup lookback / touch / extension (overrides hardcoded defaults).
ENGINE_A_V3_COMMODITY_SETUP_PARAMS:
  energy_oil: { lookback: 16, touch_distance_atr: 0.45, max_extension_atr: 1.35 }
  nat_gas: { lookback: 12, touch_distance_atr: 0.60, max_extension_atr: 1.50 }
  copper: { lookback: 20, touch_distance_atr: 0.40, max_extension_atr: 1.25 }
  pgm_metals: { lookback: 24, touch_distance_atr: 0.45, max_extension_atr: 1.25 }
  base_metals: { lookback: 24, touch_distance_atr: 0.40, max_extension_atr: 1.20 }
  softs: { lookback: 18, touch_distance_atr: 0.55, max_extension_atr: 1.40 }
  commodity_other: { lookback: 20, touch_distance_atr: 0.35, max_extension_atr: 1.25 }
# Equities/ETFs: no TRADE when volume component quality is below floor.
ENGINE_A_V3_EQUITY_VOLUME_FLOOR:
  ENABLED: true
  MIN_QUALITY: 0.15
# Crypto funding/OI conflict demotion (off until analyze_pair wires context).
ENGINE_A_V3_CRYPTO_DERIV_GUARD:
  ENABLED: false
  REQUIRE_FRESH: true
# Optional orthogonal subsystem factors for V3 quant scoring (default OFF).
# When ENABLED, carry/sentiment/microstructure context entries feed direction/confluence
# using the hybrid denominator policy from the ablation harness.
ENGINE_A_V3_SUBSYSTEMS:
  ENABLED: true
  WEIGHTS_BY_FAMILY:
    crypto:
      microstructure: 0.08

# Live crypto microstructure subsystem for Engine A V3 (crypto pairs only).
ENGINE_A_V3_MICROSTRUCTURE:
  ENABLED: true
  MAX_AGE_SEC: 120
  # EXCHANGE: binance is a deliberate opt-in (MICROSTRUCTURE_BINANCE_FEEDS_ENABLED
  # + TRADE_BUCKET_EXCHANGE: binance). microstructure.db currently holds binance
  # rows only - flipping this to bybit would silently disable the subsystem.
  EXCHANGE: binance

# Richer momentum blend: RSI extremity + DI alignment + MACD histogram slope.
ENGINE_A_V3_MOMENTUM_BLEND:
  ENABLED: true
  RSI_WEIGHT: 0.35
  DI_WEIGHT: 0.35
  MACD_SLOPE_WEIGHT: 0.30

# Per-component volatility sensitivity and adaptive structural TP2 sizing.
ENGINE_A_V3_VOLATILITY_GATING:
  ENABLED: true
  TP2_R_MIN: 1.5
  TP2_R_MAX: 2.5
  ATR_PCT_LOW: 0.3
  ATR_PCT_HIGH: 0.9
  # Apply the per-component volatility multiplier (0.85-1.12) to the confluence
  # divisor as well as the numerator, so the score stays a true weighted average.
  # Previously it scaled only the numerator: MAX_SCORE was unreachable in low-ADX
  # regimes and saturated-then-clamped in high-ADX ones, so the "/3.00" shown on
  # the card was not the achievable maximum. Reversible: set false.
  NORMALIZE_DENOMINATOR: true

# Trend-health decay: penalize stale EMA alignment and weakening ADX.
ENGINE_A_V3_TREND_HEALTH:
  ENABLED: true
  STALE_ALIGNMENT_BARS: 8
  BAR_PENALTY: 0.03
  FLOOR: 0.75
  ADX_WEAKENING_PENALTY: 0.15

# Engine A quant scorer (ground-up rebuild) per-score_group component weights.
# Core components only: trend, momentum, location, volume (the V3 profile schema
# rejects anything else; subsystem signals are research-only, see
# athena_research/engine_a_ablation). Partial overrides are merged over the
# family default in engine_a_v3/profile.py and renormalized to sum 1.0; unknown
# keys and invalid values are ignored (fall back to the family default). Empty
# {} -> per-family defaults (_FAMILY_WEIGHTS). TRADE cutoff reuses
# ENGINE_A_SCORE_GROUP_THRESHOLDS. Without authoritative timeframe policy, the
# legacy fallback is intraday H1 entry/H4 momentum and swing H4 entry/D1 bias.
# Under enforced policy, Engine A consumes policy setup/trigger and
# regime/bias/structure roles instead.
# Tunable live with no code change, e.g.:
#   crypto_btc: { trend: 0.40, momentum: 0.25, location: 0.15, volume: 0.20 }
ENGINE_A_QUANT_WEIGHTS_BY_GROUP:
  us_indices_trackers: { trend: 0.45, momentum: 0.22, location: 0.18, volume: 0.15 }
  eu_indices: { trend: 0.45, momentum: 0.22, location: 0.18, volume: 0.15 }
  asian_indices: { trend: 0.45, momentum: 0.22, location: 0.18, volume: 0.15 }
  forex_exotics: { trend: 0.40, momentum: 0.26, location: 0.22, volume: 0.12 }

# Per-TF candle freshness diagnostic (stalenessSeverity, bucketLag, etc.).
# Always populated for production visibility (unlike candleMeta which is debug-only).
CANDLE_FRESHNESS_ENABLED: true

# Crypto-specific D1 staleness threshold: max hours since last D1 bar open before
# blocking scoring. Crypto trades 24/7 but Bybit REST can have delays.
CRYPTO_D1_MAX_STALE_HOURS: 25

THRESHOLD_AUDIT:
  ENABLED: true
  SHADOW_THRESHOLDS:
    ENGINE_A:
      - current
      - current_minus_5pct
      - current_minus_10pct
      - current_minus_15pct
    ENGINE_B:
      - current
      - current_minus_5pct
      - current_minus_10pct
      - current_minus_15pct
    ENGINE_C:
      - current
      - current_minus_5pct
      - current_minus_10pct

# Diagnostic-only Engine A/B calibration telemetry. When enabled it appends
# report rows and must not alter thresholds, scores, gates, or execution
# behavior (see calibration_diagnostics.py).
# Enabled 2026-05-19 for demo calibration collection per final_calibration_decision_report.md
# (PC-RES-001). Gate/threshold overlay proposals remain apply:false.
CALIBRATION_DIAGNOSTICS_ENABLED: true
CALIBRATION_DIAGNOSTICS_PATH: "logs/calibration_diagnostics/calibration_events.jsonl"

# Research-only portfolio/position volatility targeting diagnostics. Disabled
# by default and not used by live order sizing.
RESEARCH_VOL_TARGETING_ENABLED: false
RESEARCH_VOL_TARGET_ANNUALIZED: 0.12
RESEARCH_VOL_TARGET_MAX_MULTIPLIER: 1.50
RESEARCH_VOL_TARGET_MIN_MULTIPLIER: 0.25
RESEARCH_VOL_TARGET_LOOKBACK: 20

# MT5 broker server UTC offset. Change when DST shifts (EET=2, EEST=3).
# Used by fetch_mt5() timezone detection and H4 grid offset derivation.
MT5_BROKER_UTC_OFFSET: 3

# MT5 forex H4 policy grid offset (hours). Derived from broker offset: (24 - broker_offset) % 4.
# GMT+3 → 1h offset (01/05/09/13/17/21 UTC). GMT+2 → 2h (02/06/10/14/18/22 UTC).
# Set to "auto" or remove to let market_state.py compute from MT5_BROKER_UTC_OFFSET.
FOREX_H4_RESAMPLE_OFFSET_HOURS: 1.0

# Read-only diagnostic: log raw MT5 copy_rates H4 bar stamps + the chosen time-shift
# decision (shiftTag) for forex into debug NDJSON, to distinguish broker-stamped
# (GMT+3) unshifted bars from a genuinely lagging feed. No behavior change. Toggle off
# once the forex H4 stale_multi_bucket false-positive cause is confirmed.
MT5_H4_ALIGN_DIAG_ENABLED: true

# Forex H4 one-shot refetch: MT5 can briefly omit the just-closed/forming H4 bar right
# after a boundary, which surfaces as a STALE_DATA_PRE_SCORING:H4 false positive. When
# the newest fetched H4 bar lags 2..MAX_LAG buckets, refetch once (after SLEEP_MS) to
# pick up the missing recent bar. The lag cap keeps weekend / dead-feed gaps from being
# retried. Read-only refetch — does not change gates, scoring, or timestamp handling.
MT5_H4_FETCH_RETRY_ENABLED: true
MT5_H4_FETCH_RETRY_MAX_LAG: 3
MT5_H4_FETCH_RETRY_SLEEP_MS: 400

# Forex H1 one-shot refetch: same MT5 stale-history quirk as H4 (boundary omission or
# lazy chart re-sync right after a terminal/server restart) surfacing as
# STALE_DATA_PRE_SCORING:H1. Lag cap 6 stays far below the ~48-bucket H1 weekend gap,
# so weekend / dead-feed gaps are never retried. Reuses MT5_H4_FETCH_RETRY_SLEEP_MS.
MT5_H1_FETCH_RETRY_ENABLED: true
MT5_H1_FETCH_RETRY_MAX_LAG: 6

# MT5 D1 one-shot refetch: repairs lazy terminal history such as a 5-bar D1 slice
# ending several sessions behind before risk evaluates freshness. If retry remains
# stale, the stale-data execution block still rejects the signal.
MT5_D1_FETCH_RETRY_ENABLED: true
MT5_D1_FETCH_RETRY_MAX_LAG: 7

# Broker candle safety: do not turn MT5 error payloads with Polygon/yfinance
# fallback candles into execution-eligible Engine A candles.
MT5_CANDLE_FALLBACK_ENABLED: false

# Bars older than this vs wall-clock skip tick-TZ heuristic in fetch_mt5 (illiquid exotic guard).
# Code default is 129600 (36 hours) if omitted.
MT5_FETCH_STALE_UNSHIFTED_AGE_SEC: 129600

# MT5 D1 bar-start offset (hours UTC). Duplicate under SCALP_ENGINE for Engine D UX; root wins.
D1_RESAMPLE_OFFSET_HOURS: 0.0

# Crypto paper execution is Bybit; use Bybit public data for Engine A live
# SL/TP ATR and derivative context. Binance fallback is off by default so venue
# basis drift cannot silently size Bybit paper trades.
ENGINE_A_CRYPTO_LEVELS_FEED: bybit
ENGINE_A_CRYPTO_LEVELS_SIGNAL_FEED_FALLBACK: false
ENGINE_A_CRYPTO_DERIVATIVES_FEED: bybit
ENGINE_A_CRYPTO_DERIVATIVES_BINANCE_FALLBACK: true
ENGINE_A_OI_MAX_AGE_SEC: 300
ENGINE_A_BT_OI_MAX_AGE_MS: 86400000
ENGINE_A_CRYPTO_BT_LEVEL_ATR_USE_SIGNAL_FEED: false
# Engine A scoring OHLC: Bybit when paper execution is Bybit (chart parity).
ENGINE_A_CRYPTO_SIGNAL_FEED: bybit
# Crypto late-trend continuation: diagnostics + conservative score multiplier when
# full EMA alignment meets weak/falling ADX and stretched VWAP (volume not required).
ENGINE_A_CRYPTO_LATE_TREND_DIAGNOSTICS_ENABLED: true
ENGINE_A_CRYPTO_LATE_TREND_ADJUSTMENT_ENABLED: true
ENGINE_A_CRYPTO_ADX_STRONG_THRESHOLD: 25
ENGINE_A_CRYPTO_LATE_TREND_MULT: 0.85
ENGINE_A_CRYPTO_VWAP_EXTENSION_ATR_WARN: 3.0
ENGINE_A_CRYPTO_VOLUME_MA_LOOKBACK: 20
ENGINE_AB_CRYPTO_SIGNAL_FEED: bybit
ENGINE_AB_CRYPTO_SIGNAL_FEED_FALLBACK: false
ENGINE_B_CRYPTO_LEVELS_FEED: bybit
# C4: fail-closed. When Bybit ATR is unavailable, do NOT silently fall back to
# the signal-feed (Binance) candle ATR — that would produce SL/TP from a
# different venue than the signal candles (execution-level mismatch, audit
# MED #10). Pairs are rejected with invalid_atr instead.
ENGINE_B_CRYPTO_LEVELS_SIGNAL_FEED_FALLBACK: false
ENGINE_B_CRYPTO_BT_LEVEL_ATR_USE_SIGNAL_FEED: false
# Engine B Hot Bench (read-only discovery shortlist) sticky-slot hysteresis.
# Keeps the displayed symbol per group stable across hotlist polls so the card
# does not jump between weak pairs. Demo/diagnostic only — never primes Engine B
# or executes; just controls which symbol is surfaced for review.
ENGINE_B_HOTLIST_SWITCH_MARGIN: 15        # new candidate must beat current by this many points to replace it
