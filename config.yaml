ENGINE_A_SCORING_PROFILE:
  ENABLED: true
  # Live entry timing only. D1/H4/H1 trend layers and backtest routing remain unchanged.
  LIVE_ENTRY_TF_BY_STYLE:
    intraday: { forex: M30 }
  DEFAULT_BY_CLASS:
    default:
      trend_layers:
        - { tf: D1, weight_key: d1_ema_trend, fast_ema: ema21, slow_ema: ema200 }
        - { tf: H4, weight_key: h4_ema_trend, fast_ema: ema21, slow_ema: ema50 }
        - { tf: H1, weight_key: ema_trend, fast_ema: ema21, slow_ema: ema50 }
      momentum_tf: H4
      regime_tf: H4
  BY_STYLE:
    swing:
      trend_weights: { d1_ema_trend: 0.50, h4_ema_trend: 0.30, ema_trend: 0.20 }
      execution_tf: D1
      chart_tf: D1
    intraday:
      trend_weights: { d1_ema_trend: 0.42, h4_ema_trend: 0.33, ema_trend: 0.25 }
      execution_tf: H4
      chart_tf: H4
    scalp:
      trend_weights: { d1_ema_trend: 0.25, h4_ema_trend: 0.35, ema_trend: 0.40 }
      execution_tf: H1
      chart_tf: H1
  BY_SCORE_GROUP:
    energy_oil:
      trend_layers:
        - { tf: D1, weight_key: d1_ema_trend, fast_ema: ema21, slow_ema: ema200 }
        - { tf: H4, weight_key: h4_ema_trend, fast_ema: ema21, slow_ema: ema50 }
        - { tf: H1, weight_key: ema_trend, fast_ema: ema21, slow_ema: ema50 }
      trend_weights: { d1_ema_trend: 0.20, h4_ema_trend: 0.45, ema_trend: 0.35 }
      momentum_tf: H4
      regime_tf: H4
    commodity_other:
      trend_layers:
        - { tf: D1, weight_key: d1_ema_trend, fast_ema: ema21, slow_ema: ema200 }
        - { tf: H4, weight_key: h4_ema_trend, fast_ema: ema21, slow_ema: ema50 }
        - { tf: H1, weight_key: ema_trend, fast_ema: ema21, slow_ema: ema50 }
      trend_weights: { d1_ema_trend: 0.20, h4_ema_trend: 0.45, ema_trend: 0.35 }
      momentum_tf: H4
      regime_tf: H4
    # Restores stock/index D1 weight to 0.40 (vs 0.50 profile default).
    # INDICATOR_WEIGHTS.trend had these values but was silently bypassed by
    # SCORING_PROFILE: ENABLED: true. Explicitly set here to preserve intent.
    us_stock_single:
      trend_weights: { d1_ema_trend: 0.40, h4_ema_trend: 0.35, ema_trend: 0.25 }
    stock_other:
      trend_weights: { d1_ema_trend: 0.40, h4_ema_trend: 0.35, ema_trend: 0.25 }
    us_indices_trackers:
      trend_weights: { d1_ema_trend: 0.40, h4_ema_trend: 0.35, ema_trend: 0.25 }
