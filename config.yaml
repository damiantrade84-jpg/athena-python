# Engine A scoring profile: trend TF stack, style weights, momentum/regime anchors.
# D1/H4/H1 layers are unchanged by default; style adjusts trend weights only.
ENGINE_A_SCORING_PROFILE:
  ENABLED: true
  DEFAULT_BY_CLASS:
    default:
      trend_layers:
        - { tf: D1, weight_key: d1_ema_trend, fast_ema: ema21, slow_ema: ema200 }
        - { tf: H4, weight_key: h4_ema_trend, fast_ema: ema21, slow_ema: ema50 }
        - { tf: H1, weight_key: ema_trend, fast_ema: ema21, slow_ema: ema50 }
      momentum_tf: H4
      regime_tf: H4
  BY_STYLE:
    swing:
      trend_weights: { d1_ema_trend: 0.50, h4_ema_trend: 0.30, ema_trend: 0.20 }
      execution_tf: D1
      chart_tf: D1
    intraday:
      trend_weights: { d1_ema_trend: 0.42, h4_ema_trend: 0.33, ema_trend: 0.25 }
      execution_tf: H4
      chart_tf: H4
    scalp:
      trend_weights: { d1_ema_trend: 0.25, h4_ema_trend: 0.35, ema_trend: 0.40 }
      execution_tf: H1
      chart_tf: H1
  BY_SCORE_GROUP:
    energy_oil:
      trend_layers:
        - { tf: H4, weight_key: h4_ema_trend, fast_ema: ema21, slow_ema: ema50 }
        - { tf: H1, weight_key: ema_trend, fast_ema: ema21, slow_ema: ema50 }
      trend_weights: { h4_ema_trend: 0.55, ema_trend: 0.45 }
      momentum_tf: H4
      regime_tf: H4
    commodity_other:
      trend_layers:
        - { tf: H4, weight_key: h4_ema_trend, fast_ema: ema21, slow_ema: ema50 }
        - { tf: H1, weight_key: ema_trend, fast_ema: ema21, slow_ema: ema50 }
      trend_weights: { h4_ema_trend: 0.55, ema_trend: 0.45 }
      momentum_tf: H4
      regime_tf: H4
    # #6 (2026-05-28): per-group momentum/regime anchor. bond_tlt (TLT) trends
    # slowly, so anchor momentum + regime on D1 instead of the universal H4 — D1
    # RSI/MACD are smoother and better matched to a slow-swing instrument. Only
    # momentum_tf/regime_tf are overridden; trend_layers fall back to the D1/H4/H1
    # default stack. UNVALIDATED judgment value (NOT n>=30 outcome-backed).
    # DELIBERATELY HELD: crypto stays on H4 momentum (an H1 retune is a large,
    # noisier live change reserved for the evidence path) and equity session-aware
    # TF handling is unchanged. Reversible: delete this block to restore H4/H4.
    bond_tlt:
      momentum_tf: D1
      regime_tf: D1

