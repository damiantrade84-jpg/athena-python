NAKED_ENGINE:

  # 2026-07-16: removed deprecated LIVE_TRIGGER_TF_BY_STYLE (intraday forex M30).
  # Timeframe roles are owned by timeframe_policy.py; runtime profiles ignored
  # the override, so the key only misdocumented the live trigger (policy M15).

  # 2026-07-02 audit: aligned to the effective value. engine_b_config.yaml
  # (crypto_aggtrade.alignment_bonus) merges last and was already 0.5; the 1.0
  # here was dead. Keep the two files in sync when tuning.
  aggtrade_cvd_bonus: 0.5

  bos_volume_multiplier: 1.3

  # Order Block displacement lookforward bars per timeframe
  ob_displacement_bars:
    D1: 10
    H4: 6
    H1: 5

  # Audit fixes — ATR multipliers previously hardcoded as literals. Each accepts a
  # scalar or a per-asset dict ({crypto: x, forex: y, default: z}). Values below are
  # the in-code defaults; uncomment / edit to tune.
  # C-1: zone-touch tolerance (was 0.1 ATR — too tight on wide-ATR instruments).
  zone_touch_tolerance_atr_mult: 0.2
  # #3: zone-detection prominence (was atr * 1.5).
  zone_prominence_atr_mult: 1.5
  # #4: zone merge distance (was zone_atr * 0.5).
  zone_merge_atr_mult: 0.5
  # C-2: max distance (ATR) from the broken BOS level for the trend-pullback path to
  # still count as a valid structural location.
  trend_pullback_bos_proximity_atr_mult: 1.0
  # L-3: backward order-block scan span per structure TF (was 20).
  ob_lookback_bars:
    D1: 20
    H4: 20
    H1: 20

  # When true, commodity swing forces require_macro_align regardless of style YAML.
  # Default false so NAKED_ENGINE.style_profiles.swing.require_macro_align wins.
  commodity_swing_force_macro_align: false

  # Zone proximity threshold as multiple of ATR (near_zone / location gate input).
  # Resolved per score_group, then asset_type, then default via scoring._resolve_class_keyed.
  # near_zone is distance-based (direction-agnostic): widening helps LONG and SHORT
  # symmetrically. Values widened 2026-06-26 from Engine B gate-funnel diagnostics
  # (328 live scans, 2026-05-21→2026-06-26): LOCATION_OK was the binding gate for
  # these groups (copper LONG 15%, base_metals LONG 33%, asian_indices 63%,
  # us_indices_trackers 67%, etf_other 65%, pgm_metals 69% location pass). Widened
  # toward the existing wide-end precedent (crypto_btc 0.65). PROVISIONAL pending
  # vectorbt outcome validation (gate-funnel shows where signals are blocked, not
  # whether releasing them is profitable). Reversible: delete the per-group rows.
  zone_proximity_atr_mult:
    default: 0.5
    forex: 0.40
    crypto: 0.60
    commodity: 0.55
    forex_majors: 0.38
    crypto_btc: 0.65
    precious_trackers: 0.50
    # Location-starved groups (data-backed, see comment above):
    copper: 0.70              # was commodity 0.55; location pass 15% (severe)
    base_metals: 0.70         # was commodity 0.55; location pass 33% (severe)
    asian_indices: 0.65       # was default 0.50; location pass 63%
    us_indices_trackers: 0.65 # was default 0.50; location pass 67%
    etf_other: 0.65           # was default 0.50; location pass 65%
    pgm_metals: 0.65          # was commodity 0.55; location pass 69%

  # D1 PD-array conflict scan distance as a multiple of D1 ATR.
  # Reduced from 3.0 to 1.5 to prevent persistent score drag — 3.0 ATR window
  # caught nearly every pair's opposing D1 OB/FVG, creating a constant -0.25 penalty.
  d1_pd_array_conflict_window_atr_mult: 1.5

  # Rejection trigger wick/body requirement.
  # Default preserves current behavior; lower only after backtest/shadow validation.
  rejection_wick_body_ratio: 1.2

  # 2026-07-02 audit: engulfing trigger displacement floor — the engulfing body
  # must be at least this multiple of the style ATR to fire (doji-engulfs-doji
  # noise no longer counts as an entry trigger). Scalar or per-asset dict.
  # Set 0.0 to restore legacy body-agnostic engulfing.
  engulfing_min_body_atr_mult: 0.2

  # Sweep / equal-extrema / structural TP distance (ATR multiples; was hardcoded).
  sweep_wick_atr_mult: 0.3
  equal_extrema_atr_mult: 0.15
  structural_tp_min_distance_atr: 0.5

  # D1 PD-array conflict penalty (points deducted from score; gate_score unchanged)
  d1_pd_array_penalty: 0.25

  # hard_counter_mode: "penalty" (default) subtracts hard_counter_penalty from total_score only.
  # "veto" zeroes structure_ok even when BOS/sweep confirmed — use only with explicit intent.
  hard_counter_mode: penalty
  hard_counter_penalty: 1.0

  # Overlay observability (logs / engine_b_overlay / calculate_confidence.engine_b_diagnostics):

  # stable reason codes in market_structure - resistance_too_close, support_too_close,

  # adverse_dxy_correlation, structural_sl_rejected_hard_cap (no extra alpha weights).

  # Per-style min_score thresholds - tune here after backtesting.

  # These override the hardcoded defaults in _naked_scan_style_profile().

  # Hold limits (H4 bars): scalp=12 (48h), intraday=24 (4d), swing=60 (10d)

  # Dashboard: Backtest tab → ENGINE B THRESHOLDS → saves via POST /api/naked-style-thresholds (no restart).

  style_profiles:

    scalp:

      min_score: 4.0

      min_rr: 1.5

      fallback_rr: 1.8

    intraday:

      min_score: 4.5

      min_rr: 1.5

      fallback_rr: 1.8

    swing:

      min_score: 5.0

      min_rr: 2.0

      fallback_rr: 2.5

      require_macro_align:

        forex: false

        crypto: false

        stock: false

        index: false

        commodity: true



  zone_multipliers:

    TRENDING:        {upper: 0.3, lower: 1.0, sl: 1.5}

    RANGING:         {upper: 0.5, lower: 1.2, sl: 1.0}

    HIGH_VOLATILITY: {upper: 0.4, lower: 1.5, sl: 1.8}

    LOW_VOLATILITY:  {upper: 0.2, lower: 0.8, sl: 1.0}


  # ATR buffer inside opposing zones for structural TP selection.
  # Kept separate from zone_multipliers.*.sl so stop width does not suppress tight targets.
  structural_tp_buffer_atr_mult: 0.25

  # ATR buffer placed BEYOND the swing pivot when building the structural stop.
  # zone_multipliers.*.sl (1.0-1.8) is a standalone ATR stop multiple — the same
  # magnitude as STYLE_ATR_MULTS — so using it as a pivot buffer made the
  # structural stop >= 1.5 ATR wide even with the pivot sitting at price. It
  # could then never clear min_rr, always lost the tighter-of comparison to the
  # ATR stop, and structure never set the stop. Regime ordering is preserved.
  # Gated by ENGINE_B_STRUCTURAL_SL_PIVOT_BUFFER_ENABLED.
  structural_sl_pivot_buffer_atr:
    TRENDING:        0.35
    RANGING:         0.25
    HIGH_VOLATILITY: 0.45
    LOW_VOLATILITY:  0.25


  # Order Block minimum strength (0-100) to count as valid confluence

  # Strength = 60% displacement + 40% volume. Below this = weak/ignored.

  ob_min_strength: 50



  score_group_overrides:

    # min_score is intentionally omitted from most overrides below; groups
    # inherit style_profiles.* unless an explicit compatibility override is
    # required. Only min_rr and min_room_atr normally need per-group
    # differentiation here.
    # Exception: nat_gas/crypto_doge keep explicit style min_score values to
    # suppress stale per-group code defaults.

    forex_majors:

      intraday: {min_rr: 1.3}

      swing: {min_rr: 1.8}

    forex_crosses:

      intraday: {min_rr: 1.3}

      swing: {min_rr: 1.8}

    forex_exotics:

      scalp: {min_room_atr: 0.5, min_rr: 1.5}

      intraday: {min_room_atr: 0.85, min_rr: 1.5}

      swing: {min_room_atr: 1.2, min_rr: 2.0}

    nat_gas:

      intraday: {min_rr: 1.6, min_room_atr: 0.6}

      swing: {min_score: 5.0, min_rr: 2.0, min_room_atr: 1.0}

    energy_oil:

      intraday: {min_rr: 1.3, min_room_atr: 0.5}

      swing: {min_rr: 1.8, min_room_atr: 0.8}

    crypto_doge:

      scalp: {min_room_atr: 0.5}

      intraday: {min_room_atr: 0.9, min_rr: 1.5}

      swing: {min_score: 5.0, min_room_atr: 1.2, min_rr: 1.9}

    # 2026-07-02 audit: crypto min_room_atr rows wire the room-gate values the
    # code intended contextually (crypto intraday 0.25 / swing 0.40) but which
    # were dead — live profiles always carried the flat style defaults (0.7/1.0).
    # Mirrors engine_b_config.yaml. crypto_doge keeps stricter explicit rows.
    crypto_btc:

      intraday: {min_rr: 1.3, min_room_atr: 0.25}

      swing: {min_rr: 1.8, min_room_atr: 0.4}

    crypto_eth:

      intraday: {min_rr: 1.3, min_room_atr: 0.25}

      swing: {min_rr: 1.8, min_room_atr: 0.4}

    crypto_alt_majors:

      intraday: {min_rr: 1.4, min_room_atr: 0.25}

      swing: {min_rr: 1.9, min_room_atr: 0.4}

    crypto_other:

      intraday: {min_rr: 1.4, min_room_atr: 0.25}

      swing: {min_rr: 1.9, min_room_atr: 0.4}

    precious_trackers:

      intraday: {min_rr: 1.3}

      swing: {min_rr: 1.8}

    # energy_oil is defined once above (with min_room_atr rows). A duplicate
    # plain-min_rr block here silently shadowed it via YAML last-wins — removed
    # 2026-07-10 audit; the duplicate-key guard only scans top-level keys.

    us_stock_single:

      intraday: {min_rr: 1.4}

      swing: {min_rr: 1.9}

    stock_other:

      intraday: {min_rr: 1.4}

      swing: {min_rr: 1.9}

    smallcap_em_etf:

      intraday: {min_rr: 1.4}

      swing: {min_rr: 1.9}

    bond_tlt:

      intraday: {min_rr: 1.3}

      swing: {min_rr: 1.8}

    # 2026-07-02 audit: index intraday min_room_atr 0.2 wires the dead contextual
    # index room value (see crypto comment above). Swing keeps the 1.0 default.
    us_indices_trackers:

      scalp: {min_score: 4.0}

      intraday: {min_score: 4.5, min_rr: 1.3, min_room_atr: 0.2}

      swing: {min_score: 5.0, min_rr: 1.8}

    index_other:

      scalp: {min_score: 4.0}

      intraday: {min_score: 4.5, min_rr: 1.4, min_room_atr: 0.2}

      swing: {min_score: 5.0, min_rr: 1.9}



# Regime multipliers adjust the Engine B min_score floor
# (base_min_score * regime_multiplier, 1dp ceil).

ENGINE_B_REGIME_MULTIPLIERS_ENABLED: true
ENGINE_B_REGIME_MULTIPLIERS_APPLY_TO_MIN_SCORE: true

ENGINE_B_REGIME_MULTIPLIERS:

  TRENDING: 0.95

  RANGING: 1.10

  HIGH_VOLATILITY: 1.10

  # 2026-07-02 audit: was 0.90. No min_score discount in low-vol chop — that is
  # where false BOS and doji-noise triggers cluster. Mirrors engine_b_config.yaml.
  LOW_VOLATILITY: 1.0

  # 2026-07-29: the 2026-07-28 per-asset forex block (RANGING x1.25) is REMOVED.
  # It raised the forex intraday floor to 5.7 (swing 6.3), which is above the
  # entire observed forex score distribution: 0 of 1723 forex Engine B rows in
  # ~10 days of live scans reached 5.7 (all-time max 5.4565). It did not make
  # the floor bind, it made it unreachable — in the 2026-07-29 07:45Z scan
  # USD/PLN 5.26, USD/HUF 5.26 and EUR/CHF 4.98 passed every mandatory gate and
  # were rejected by the floor alone, and no forex signal cleared it in any scan
  # after the change. Forex now uses the flat table again (RANGING 1.10 -> 4.95
  # intraday floor). Do not re-add a forex floor above ~5.4 without outcome
  # evidence that scores in that band exist.

ENGINE_B_STYLE_MIN_SCORE_DIFFERENTIATION_ENABLED: true
# NOTE (2026-07-25 audit): these floors are compared against confidence.score
# (mandatory gates + quality bonuses). Engine B only sets `passed` when every
# mandatory gate is true, so gate_score always equals gate_max_possible (5.0, or
# 6.0 with the macro gate) for a passing signal. The floor is therefore only
# binding where floor x ENGINE_B_REGIME_MULTIPLIERS exceeds gate_max_possible.
# With APPLY_TO_MIN_SCORE: true that is exactly two combinations:
#   swing x RANGING         -> 5.50, needs ~54% of the quality headroom
#   swing x HIGH_VOLATILITY -> 5.50, needs ~54% of the quality headroom
# All ten other style/regime combinations sit at or below 5.00 and can only bite
# when penalties (aggtrade 0.5 / D1 conflict 0.25 / hard_counter) exceed the
# earned quality — they cannot reject a clean but low-quality setup, which is
# what a min-score floor is for.
# The binding 54% is an artifact of (5.0 x 1.10 - 5.0) / quality_headroom, not a
# calibrated quality requirement, so it also moves whenever the quality weight
# table changes: APPLY_COMPONENT_MAX: false shifted it from ~52% to ~54%.
# ENGINE_B_MIN_SCORE_BASIS below expresses the floor directly on the quality
# ratio, removing that coupling. It stays OFF until the ratios are calibrated
# (n>=30 evidence), because switching basis changes which signals pass.
ENGINE_B_STYLE_MIN_SCORE_BY_STYLE:
  scalp: 4.0
  intraday: 4.5
  swing: 5.0

# Basis for the Engine B style/regime score floor.
#   total         — legacy: compare ENGINE_B_STYLE_MIN_SCORE_BY_STYLE against
#                   confidence.score (currently non-binding, see note above).
#   quality_ratio — compare confidence.quality_pct/100 against
#                   ENGINE_B_MIN_QUALITY_RATIO_BY_STYLE.
# The quality ratios below are PLACEHOLDERS, not calibrated values. Do not switch
# the basis to quality_ratio until they are backed by outcome evidence.
ENGINE_B_MIN_SCORE_BASIS: total
ENGINE_B_MIN_QUALITY_RATIO_BY_STYLE:
  scalp: 0.30
  intraday: 0.35
  swing: 0.40

# Ranking / conviction basis for Engine B (blends, sorting, execution gates).
#   quality — confidence.quality_pct (0-100, full range for passing signals)
#   total   — legacy confidence.score / max_possible, whose lower ~83% is
#             constant for every passing signal and saturated the A/B blend.
# Gate decisions still come from `passed` / `checklist_passed`, never from this.
ENGINE_B_CONVICTION_BASIS: quality



# Engine B AI news context - feeds news into AI advisory review (not checklist)

ENGINE_B_NEWS_CONTEXT_ENABLED: true

ENGINE_B_ZONE_PERSISTENCE: false

# See ENGINE_B_STRIP_FORMING_STRUCT (above) for structure vs trigger forming-bar split.
ENGINE_B_USE_FORMING_FOR_STRUCTURE: false

# The forming series is used for lower-TF freshness and advisory confidence
# context. Trigger-pattern detection receives a separate confirmed-only map so
# a forming candle cannot create a scan/execute trade-signal flip.
ENGINE_B_USE_FORMING_FOR_TRIGGER: true

# Trigger/setup TF only (M5/M15/M30): faster ATR/ADX periods + candle thresholds.
# H1 structure ATR(14), H4 bias ATR, and D1/H4 regime ADX(14) are unchanged.
# Missing score_group → hardcoded fallback (ATR 14, ADX 14, wick 1.2, engulf 0.2, close 0.70).
# Applied only when the resolved trigger/setup TF is M5/M15/M30. A group's
# trigger TF is NOT constant: symbol overrides and SLOW speed adaptation move it
# between M5/M15/M30 inside the same group (e.g. forex_majors covers EUR/USD at
# M15 and GBP/USD at M5), so a row calibrated at one rung is currently reused at
# the others. Optional per-TF sub-rows override the flat values when present:
#   forex_majors:
#     trigger_atr: 10          # flat defaults, still used for unlisted TFs
#     M5:  { trigger_atr: 12 } # merged over the flat values when trigger TF = M5
