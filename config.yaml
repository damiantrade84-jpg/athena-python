# (breakout location path, BOS leg of trend-pullback, MTF-BOS structure rescue in
# the both-sequences-oppose case) no longer satisfies the structure/location
# gates — those entries bought the range extreme and systematically lost. Only
# reversal evidence (direction-aligned sweep / CHoCH) may carry an entry there,
# and sweep-aligned fades are exempt from the hard-counter score penalty.
# Reversible: false.
ENGINE_B_FOREX_RANGING_CONTINUATION_BLOCK_ENABLED: true
ENGINE_B_RR_CAN_SATISFY_SPACE_GATE:
  default: false
  forex: true
  stock: true
  index: true
  commodity: true
  etf: true
  etf_bond: true
  crypto: true
# Disabled 2026-06-24: verified binding constraint. In the latest gate funnel,
# 95 of 120 evaluated signals (79%) were blocked solely by this 0.5-ATR floor —
# all had room_ok=False, rr_ok=True, a TP-qualified rr_source, and the RR
# substitute enabled, so floor_ok=False was the only failing AND-term
# (market_structure.py:4657-4662). The 0.5 default shipped without calibration.
# Reverts space gate to: room_ok OR (rr_ok AND tp_qualified). rr_ok, SL/TP
# validation, room_ok, and freshness gates are all unchanged. Re-enable only
# with OOS edge evidence for a calibrated floor value.
ENGINE_B_SPACE_RR_SUBSTITUTE_MIN_ATR_FLOOR_ENABLED: false
ENGINE_B_SPACE_RR_SUBSTITUTE_MIN_ATR_FLOOR: 0.5
# 2026-07-02 audit: targeted replacement for the blunt floor above. A synthetic
# fallback TP that replaced a structural TP capped by a nearby opposing zone may
# NOT substitute for the room gate (the wall is still in front of price).
# Synthetic TPs created because no opposing wall existed still qualify, so the
# 2026-06-24 "no opposing zone" over-block does not recur. Set false to revert.
ENGINE_B_SPACE_RR_SUBSTITUTE_BLOCK_CAPPED_STRUCTURAL_TP: true
ENGINE_B_ATR_SL_CLAMPS_ENABLED: true
ENGINE_B_MIN_SL_ATR_DEFAULT: 0.75
ENGINE_B_MAX_SL_ATR_DEFAULT: 3.0
ENGINE_B_ATR_SL_CLAMP_SCORE_GROUP_OVERRIDES: {}

# ── Engine B SL/TP geometry (2026-07-25 audit) ──────────────────────────────
# Measured before these flags, on EUR/USD intraday (H1 ATR 11p, min_rr 1.3):
# the structural stop only won the tighter-of comparison when the swing pivot
# sat within 0.25 ATR of entry, so sl_source came back "atr" on effectively
# every signal and SMC structure had no influence on the stop at all.
#
# true: structural stop = pivot + NAKED_ENGINE.structural_sl_pivot_buffer_atr
#       (0.25-0.45 ATR). false: legacy pivot + zone_multipliers[regime].sl
#       (1.0-1.8 ATR), which is a standalone stop multiple, not a pivot buffer.
ENGINE_B_STRUCTURAL_SL_PIVOT_BUFFER_ENABLED: true
# The clamp's minimum leg widens the stop and could override the
# _keep_structural_sl decision taken immediately before it: a structural stop at
# 0.30 ATR clearing the gate at RR 3.33 was pushed to 0.75 ATR at RR 1.33, 2.5x
# the risk. true: only the maximum leg (risk cap) applies once structure has
# already cleared min_rr. false restores legacy.
ENGINE_B_ATR_SL_CLAMP_MIN_RESPECTS_STRUCTURAL: true
# Hard lower bound that survives the waiver above — risk_engine sizes volume from
# stop distance, so without it a 0.05 ATR structural stop was reachable, which
# both gets hit by ordinary bar noise and inflates position size.
# NOT CALIBRATED: half the preferred 0.75 minimum. Validate against backtest
# stop-out rates. Clamped to <= ENGINE_B_MIN_SL_ATR_DEFAULT.
ENGINE_B_ABSOLUTE_MIN_SL_ATR: 0.35
# Target RR for a synthetic fallback TP. "min_rr" clears the gate and stops.
# "fallback_rr" is legacy max(fallback_rr, min_rr): on swing forex it replaced a
# structural target 0.02 RR short of the 1.8 gate with one at 2.5 RR — 41%
# further out, with no structural level behind the extra distance.
ENGINE_B_SYNTHETIC_TP_RR_BASIS: min_rr
# true: when a structural TP misses min_rr, first try tightening the stop to the
# distance that target implies (floored at ENGINE_B_MIN_SL_ATR_DEFAULT, never
# widened, still subject to MAX_SL_PCT) and keep the real structural target,
# instead of extending the target to manufacture RR. Emits sl_tightened_for_rr.
ENGINE_B_PREFER_SL_TIGHTEN_OVER_TP_EXTENSION: true

