# Confidence engine

CONFIDENCE_THRESHOLD: 0.55

POSITION_SIZE_CONFIDENCE_SCALING: true

MICROSTRUCTURE_FEEDS_ENABLED: true

# Binance futures remains the preferred crypto microstructure venue because the

# Engine A candle/live-price path also uses Binance. Keep Bybit WS fallback off

# by default to avoid duplicate per-symbol sockets on Windows/VPN networks.

MICROSTRUCTURE_BYBIT_FEEDS_ENABLED: false

# F1: One multiplexed Binance Futures micro WS for ALL crypto symbols (depth+trade+aggTrade)
# instead of one socket per symbol. The per-symbol fan-out intermittently left individual
# streams half-closed (no close frame) without tripping the socket-level recv timeout, so
# BTCUSDT/ETHUSDT/XRPUSDT could go silent for >15 min while the global feed kept writing
# other symbols. Set to false to roll back to the legacy per-symbol fan-out (BinanceWS).
MICROSTRUCTURE_BINANCE_COMBINED_STREAM: true

# Per-symbol liveness watchdog inside the multiplexed connection: when any subscribed
# symbol has been silent for longer than this many seconds (and the connection has been
# up at least that long, to avoid cold-start flapping), force a full reconnect. This
# catches the half-closed-but-quiet stream case the socket-level recv timeout missed.
MICROSTRUCTURE_BINANCE_STALE_SYMBOL_SEC: 120

# Public market-data websockets only. Keep certificate verification enabled.

# If a local proxy/CA issue blocks market data, fix the CA store or set

# ATHENA_MARKET_DATA_WS_SSL_VERIFY=false only as a temporary diagnostic override.

MARKET_DATA_WS_SSL_VERIFY: true

# Avoid Bybit /v5/market/time startup calls on networks that reject the local CA

# chain. recvWindow is widened in bybit_executor.py instead.

BYBIT_TIME_SYNC_ENABLED: false

BYBIT_RECV_WINDOW_MS: 30000

# Crypto live tick: prefer Bybit WebSocket tickers; REST is fallback when WS missing/stale.
CRYPTO_LIVE_TICK_PROVIDER_PREFERENCE: bybit_ws
BYBIT_WS_ENABLED: true
BYBIT_REST_FALLBACK_ENABLED: true
BYBIT_WS_STALE_AFTER_SECONDS: 10
BYBIT_REST_FALLBACK_WARN: true


