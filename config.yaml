# Research lab candidate factors may upgrade entry_ok/location_ok only when ALLOW_GATE_UPGRADE true.
# Protected gates (never upgraded by research lab): structure_ok, room_ok/space_gate_ok, rr_ok, macro_ok.
ENGINE_B_RESEARCH_LAB_FACTORS:
  ENABLED: true
  # Gate upgrade stays OFF: these factors are DIAGNOSTIC-only (raw_entry_ok /
  # raw_location_ok are computed and surfaced in research_lab_detail but never
  # flip a gate to pass). Expanding GROUPS gives every score group a micro-
  # structure indicator reading for review without changing any pass verdict.
  # Flip ALLOW_GATE_UPGRADE to true only after per-group backtest validation.
  ALLOW_GATE_UPGRADE: false
  # Factor data dependencies (each factor fails closed — returns insufficient/
  # missing — when its input is unavailable, so listing it is always safe):
  #   micro_breakout   : OHLC only (any market)
