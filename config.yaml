# (0.005-0.025) was crypto-scale and silently boosted forex on every bar.
# Falls back to VOLATILITY_SCALER_ATR_PCT_LOW/HIGH keys (or code defaults)
# if asset_type missing.
VOLATILITY_SCALER_BANDS:
  forex:     { low: 0.0005, high: 0.0025 }   # EUR/USD H4 ATR ≈ 0.0006-0.0015
  crypto:    { low: 0.010,  high: 0.040 }    # BTC H4 ATR% ~1-2.5% normal, >4% chaotic
  commodity: { low: 0.003,  high: 0.015 }    # XAU/XAG/oil span; nat_gas naturally hits high
  stock:     { low: 0.005,  high: 0.020 }    # US single-name H4 typical 0.5-1.5%
  index:     { low: 0.002,  high: 0.010 }    # SPX/NDX H4 ATR% 0.2-0.6%

  # Score-group overrides (beat asset_type when present) — aligns scaler with RSI routing
  precious_trackers: { low: 0.003, high: 0.015 }
  energy_oil:        { low: 0.003, high: 0.015 }

ENGINE_A_RESEARCH_LAB_FACTORS:
  ENABLED: true
  BONUS: 0.15
  PENALTY: -0.10
  MAX_ABS: 0.20
  ROC_VOL_NORM: false
  FACTORS:
    - obv_divergence
    - bollinger_touch
    - price_momentum
    - stochastic_cross
  STOCHASTIC_CROSS:
    ENABLED: true
    PAPER_TOOL_ONLY: true
    TIMEFRAME: H4
    ASSET_TYPES:
      - crypto
    SYMBOLS: []   # empty = all crypto pairs; no BTC/ETH block
    K_PERIODS:
      - 5
      - 14
    K_SMOOTH: 3
    D_SMOOTH: 3
  # Bollinger band touch factor params. Defaults (period 20, mult 2.0) preserve
  # the prior hardcoded values exactly. Tunable so calibration can adjust band
  # sensitivity without code changes. factor_scoring._research_bollinger_value
  # consumes this block.
  BOLLINGER_TOUCH:
