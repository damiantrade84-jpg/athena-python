  ZINC: 0.0021        # resting ~0.15%
  COFFEE: 0.0030      # resting ~0.21% (measured 2026-07-21: 0.2100-0.2106%)
  # US CFD stocks (Pepperstone MT5). Global stock cap 0.20% rejects normal resting spreads.
