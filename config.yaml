  V: 0.0030
  XOM: 0.0030
  NFLX: 0.0030
  AMD: 0.0030
  CRM: 0.0030
  DIS: 0.0030
  BA: 0.0030
  COIN: 0.0030
  PYPL: 0.0030
  INTC: 0.0030
  UBER: 0.0030
  PLTR: 0.0030
  # Forex exotics / crosses — resting spread above the 0.05% forex class cap.
