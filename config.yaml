# Athena v3.0 — Tunable thresholds (override CONFIG defaults)
# Edit this file and restart to apply changes — no code deploy needed.

# Per-class D1 ADX trend minimum
ADX_TREND_MIN_CLASS:
  crypto: 15
  forex: 25    # Wilder (1978): ADX > 25 = trending; was 40 (too strict, missed most trends)
  commodity: 25
  stock: 25
  index: 25

# Per-class counter-trend penalty (standardized — Trend Gate already handles direction)
COUNTER_TREND_PEN:
  crypto: -1.0
  forex: -1.0
  commodity: -1.0
  stock: -1.0
  index: -1.0

# Per-class RSI bounds
RSI_BOUNDS:
  crypto:    { ob: 70, os: 30 }
  forex:     { ob: 70, os: 30 }
  commodity: { ob: 70, os: 30 }
  stock:     { ob: 70, os: 30 }
  index:     { ob: 70, os: 30 }

# Per-class backtest macro lookback (D1 bars)
MACRO_LOOKBACK:
  crypto: 15
  forex: 30
  commodity: 50
  stock: 50
  index: 50

# Per-class Weinstein lookback (D1 bars)
WEINSTEIN_LOOKBACK:
  crypto: 60
  forex: 100
  commodity: 150
  stock: 150
  index: 150

# Per-class backtest minimum score
# Recalibrated for multiplicative factor formula (score = abs(dir) * (0.6 + nondir/3 * 0.4))
# BT_MIN MUST equal MIN_CONFLUENCE_CLASS — lower BT_MIN counts trades the live system rejects,
# inflating trade count and distorting SQN.
# Threshold set to 0.70 to match multiplicative formula scale (old 0.90–0.95 was calibrated for
# the old additive formula which produced higher raw scores; 0.70 here ≈ 0.95 old-formula gate).
# Tune up per-class after running backtests to find first-profitable threshold.
BT_MIN:
  crypto:    0.70   # must equal MIN_CONFLUENCE_CLASS.crypto
  commodity: 0.70   # must equal MIN_CONFLUENCE_CLASS.commodity
  forex:     0.60   # must equal MIN_CONFLUENCE_CLASS.forex — forex engine 0–1 scale
  stock:     0.70   # must equal MIN_CONFLUENCE_CLASS.stock
  index:     0.70   # must equal MIN_CONFLUENCE_CLASS.index

# Backtest must not alter live pair enable/disable state
BT_AUTO_TOGGLE: false
BT_PERCENTILE_FILTER: false

# ── Engine B (Naked Market Structure) thresholds ──────────────────────────────
# Engine B min_score per style is set in NAKED_ENGINE.style_profiles below (scalp/intraday/swing).
# Both backtest and live scan read from _naked_scan_style_profile() — single source of truth.
# NAKED_MAX_DAILY: Max Engine B trades per pair per day (live auto-trade cap)
NAKED_MAX_DAILY: 3


# Per-class live scan minimum confluence — execute button threshold
# Recalibrated for multiplicative factor formula. Old additive thresholds (1.10–1.20) mapped
# to ~0.88–0.96 in the new formula (multiplicative compresses inflated quality-driven scores).
# BT_MIN is set equal to MIN_CONFLUENCE_CLASS so backtest and live scan use identical gates.
# Set to 0.70 to match new formula scale; tune up after data-driven threshold analysis.
MIN_CONFLUENCE_CLASS:
  crypto:    0.70   # factor engine (0–3 scale): ~23% of max — moderate conviction
  commodity: 0.70   # factor engine (0–3 scale)
  forex:     0.60   # forex engine (0–1 scale): 60% of max — matches MIN_FOREX_CONFLUENCE
  stock:     0.70   # factor engine (0–3 scale)
  index:     0.70   # factor engine (0–3 scale)

# Forex scan threshold — forex_scoring engine outputs 0–1.0 (not 0–3.0)
# 0.60 = 60% of max; a TREND_PULLBACK with good RSI pullback and no COT boost scores ~0.60–0.75
# MIN_CONFLUENCE_CLASS.forex must match this — they are the same gate
MIN_FOREX_CONFLUENCE: 0.60      # used as MIN_CONFLUENCE_CLASS.forex below — keep in sync

# Risk settings
RISK_PCT: 0.01
MIN_CONFLUENCE: 1.0
VOLUME_THRESHOLD: 1.5
VOLUME_THRESHOLD_BACKTEST: 1.2

# Round-trip fee per trade as fraction of notional (entry + exit commission)
# Bybit taker 0.055% × 2 sides = 0.11%; forex ECN ~0.02% × 2 = 0.04%
FEE_PCT:
  crypto:    0.0011
  forex:     0.0004
  commodity: 0.0004
  stock:     0.0006
  index:     0.0004

# ── Execution Engine ──────────────────────────────────────
# Indicator correlation filter — expensive O(n²) operation, disable for backtest speed
# Enable only when doing deep live analysis; backtest accuracy unaffected without it
INDICATOR_CORRELATION_ENABLED: false

EXECUTION_ENABLED: true       # Enable manual execution via dashboard
AUTO_EXECUTE: false            # Manual click only (no auto-fire)

# ── Auto-Trader ────────────────────────────────────────────
AUTO_TRADE_ENABLED: true          # Start auto-trader on server boot
# Effective gate = max(AUTO_TRADE_MIN_SCORE, MIN_CONFLUENCE_CLASS[asset_type])
# With all MIN_CONFLUENCE_CLASS set to 0.90–0.95, this 0.90 floor is functionally
# overridden by the per-class MIN_CONFLUENCE_CLASS for most asset types.
# Per-class auto-trade minimum score (must be >= matching MIN_CONFLUENCE_CLASS)
# Factor engine (crypto/stock/commodity/index) outputs 0–3.0
# Forex engine outputs 0–1.0  — threshold must be calibrated to its own scale
AUTO_TRADE_MIN_SCORE:
  crypto:    0.80   # factor engine: strong directional + moderate quality required
  commodity: 0.80   # factor engine
  stock:     0.85   # factor engine: higher bar — single stocks more volatile/gappy
  index:     0.80   # factor engine
  forex:     0.65   # forex engine (0–1): ~65% of max, above scan gate of 0.60
AUTO_TRADE_MAX_DAILY: 3            # Max auto-executions per day
AUTO_TRADE_MAX_PER_SCAN: 1         # Max per scan cycle; raise to 2 only with >10 active pairs
AUTO_TRADE_SCAN_INTERVAL_MIN: 30   # Scan every 30 minutes
MAX_PORTFOLIO_HEAT: 0.06      # 6% total risk across all positions
MAX_OPEN_POSITIONS: 5          # Production setting
MAX_CORRELATED_POSITIONS: 2    # Production setting — prevents concentration risk
SIGNAL_MAX_AGE_SEC: 300       # 5 min freshness window
FOREX_SESSION_FILTER: true    # true = London+NY+Asian only; false = 24h (disable for testing)
SERVER_TZ_OFFSET_HOURS: 2    # Your local timezone UTC offset — SAST = 2 (GMT+2)
MAX_RISK_PER_TRADE: 0.03      # Hard cap 3% per trade
DRAWDOWN_REDUCE_THRESHOLD: 0.10   # Halve size at 10% drawdown
DRAWDOWN_STOP_THRESHOLD: 0.15     # Stop all trading at 15% drawdown

# ── EODHD Sentiment Gate ──────────────────────────────────
SENTIMENT_GATE_ENABLED: true       # Check news sentiment before auto-trades
SENTIMENT_BLOCK_THRESHOLD: 0.4     # Block if sentiment opposes direction by >0.4

# ── EODHD Event Risk Filter ──────────────────────────────
EVENT_RISK_ENABLED: true           # Block trades near high-impact events (NFP/CPI/FOMC)
EVENT_RISK_HOURS: 4                # Hours ahead to check for events

# ── Adaptive Kelly Position Sizing ────────────────────────
ADAPTIVE_KELLY_ENABLED: true       # Use fractional Kelly for dynamic position sizing
KELLY_FRACTION: 0.5                # Half-Kelly (safety proven)

# ── Signal Debate (Bull/Bear/Judge) ───────────────────────
SIGNAL_DEBATE_ENABLED: true        # Run LLM debate before auto-trades (needs ANTHROPIC_API_KEY)

# ── AI Learning ───────────────────────────────────────────
LEARNING_ENABLED: true             # Enable AI self-learning (outcome extraction + prompt injection)
LEARNING_LOOKBACK_DAYS: 90         # How many days of trade history to use for learning context
LEARNING_MIN_TRADES: 30            # Minimum trades required before injecting learning context into AI prompts

# ── EODHD Insider / Fundamentals Enrichment ───────────────
INSIDER_TRADING_ENABLED: true      # Check SEC Form 4 insider activity for stock signals
FUNDAMENTALS_ENABLED: true         # Enrich stock signals with fundamental data
# Ranging penalties — halved (ADX vote=0 already penalises, one penalty per condition)
RANGING:
  crypto:
    dead: 14
    dead_pen: 1.5
    choppy: 18
    choppy_pen: 0.5
  forex:
    dead: 18
    dead_pen: 1.5
    choppy: 23
    choppy_pen: 1.0
  commodity:
    dead: 18
    dead_pen: 1.5
    choppy: 23
    choppy_pen: 0.5
  stock:
    dead: 16
    dead_pen: 1.5
    choppy: 21
    choppy_pen: 0.5
  index:
    dead: 16
    dead_pen: 1.5
    choppy: 21
    choppy_pen: 0.5

# Factor weights per asset class (base)
# microstructure weight reduced for non-crypto: candle-based proxies (body ratios) are correlated
# with momentum (RSI/MACD) and add noise rather than signal for non-live-orderbook instruments.
# Crypto keeps 1.5 because real WS order book data is injected from Binance/Bybit feeds.
# Forex trend raised to 2.0 (primary edge) and momentum to 1.0 (was under-weighted).
FACTOR_WEIGHTS:
  crypto:    { trend: 2.0, momentum: 1.5, volatility: 1.0, volume: 1.0, structure: 1.0, derivatives: 1.5, microstructure: 1.5, carry: 1.0 }
  forex:     { trend: 2.0, momentum: 1.0, volatility: 1.0, volume: 0.5, structure: 1.5, derivatives: 0.5, microstructure: 0.5, carry: 0.7 }
  stock:     { trend: 2.0, momentum: 1.5, volatility: 1.0, volume: 1.5, structure: 1.0, derivatives: 0.5, microstructure: 0.75, carry: 1.0 }
  commodity: { trend: 2.0, momentum: 1.3, volatility: 1.5, volume: 1.0, structure: 1.3, derivatives: 0.7, microstructure: 0.75, carry: 0.5 }
  index:     { trend: 2.0, momentum: 1.4, volatility: 1.2, volume: 0.8, structure: 1.0, derivatives: 1.2, microstructure: 0.75, carry: 1.0 }

# Per-indicator weights WITHIN each factor group.
# These control how individual indicators contribute to their parent factor score.
# Keys must match indicator names in factor_scoring.py directional_factors and nondirectional_factors.
# Missing keys default to 1.0 (equal weight). Set to 0.0 to disable an indicator.
INDICATOR_WEIGHTS:
  # TREND factor: D1 is the tide (dominant), H4 is momentum, H1 is entry timing
  # Equal weighting treats a normal H1 pullback as weak direction — wrong for trend-following.
  # D1-dominant: pullback in strong D1 trend scores 0.60 instead of 0.33.
  trend:
    crypto:
      d1_ema_trend: 0.5
      h4_ema_trend: 0.3
      ema_trend: 0.2
    forex:
      d1_ema_trend: 0.5
      h4_ema_trend: 0.3
      ema_trend: 0.2
    commodity:
      d1_ema_trend: 0.34
      h4_ema_trend: 0.33
      ema_trend: 0.33
    stock:
      d1_ema_trend: 0.4
      h4_ema_trend: 0.35
      ema_trend: 0.25
    index:
      d1_ema_trend: 0.4
      h4_ema_trend: 0.35
      ema_trend: 0.25
  # MOMENTUM: RSI is more responsive for forex; MACD lags but confirms
  momentum:
    rsi_z: 0.6
    macdLine_z: 0.4
  # DERIVATIVES: COT is weekly (lagging), funding is crypto-only
  # When only one fires (e.g. funding only for crypto), it gets full weight automatically.
  derivatives:
    cot_z: 0.6
    funding_rate: 0.4       # Only fires for crypto
  # MICROSTRUCTURE: For non-crypto (candle proxies), OBI is the strongest signal.
  # OFD and LP are derived from the same OHLC data — correlated, so down-weighted.
  # For crypto (real WS orderbook), liquidity_wall_detection gets meaningful weight.
  microstructure:
    order_book_imbalance: 0.4
    liquidity_wall_detection: 0.25
    orderflow_delta: 0.2
    liquidity_pressure: 0.15
  # VOLATILITY: ATR is the primary vol measure; BB width and realized vol confirm
  volatility:
    atr_z: 0.5
    bbWidth_z: 0.3
    realized_vol_z: 0.2
  # VOLUME: volume_ratio is the primary signal; OBV confirms trend
  volume:
    volume_ratio: 0.7
    obv_trend: 0.3
  # STRUCTURE + TREND_STRENGTH: single indicators, weights don't matter (1.0 default)
  # CARRY: single indicator, weight doesn't matter (1.0 default)
  carry:
    carry_z: 1.0

# Factor scoring gates
# FACTOR_MIN_DIRECTIONAL: if abs(dir_score) < this, score=0 regardless of quality.
# Prevents trades where direction is near-random but volatility/ADX inflates the total score.
FACTOR_MIN_DIRECTIONAL: 0.25

# Regime smoothing: number of consecutive H4 bars that must agree on a new regime
# before the committed regime switches. Prevents regime whipsawing from bar to bar.
REGIME_SMOOTHING_BARS: 3

# Regime-aware factor weights
REGIME_WEIGHTS:
  TRENDING:       { trend: 2.0, momentum: 1.5, volatility: 1.0, volume: 1.0, structure: 0.5, derivatives: 1.2, microstructure: 1.5, carry: 1.0 }
  RANGING:        { trend: 0.5, momentum: 1.5, volatility: 1.0, volume: 1.0, structure: 2.0, derivatives: 1.0, microstructure: 1.5, carry: 1.0 }
  HIGH_VOLATILITY: { trend: 1.0, momentum: 1.0, volatility: 2.0, volume: 1.5, structure: 1.0, derivatives: 1.5, microstructure: 1.5, carry: 1.0 }
  LOW_VOLATILITY: { trend: 1.2, momentum: 1.0, volatility: 0.5, volume: 1.0, structure: 1.0, derivatives: 1.0, microstructure: 1.5, carry: 1.0 }

# Normalization
NORMALIZATION_LOOKBACK:
  crypto:    300
  forex:     400
  commodity: 300
  stock:     350
  index:     350

# Realized volatility
REALIZED_VOL_LOOKBACK: 30
REALIZED_VOL_ANNUALIZATION:
  crypto: 365
  forex: 252
  stock: 252
  index: 252
  commodity: 252

# Microstructure datafeed configuration
MICROSTRUCTURE:
  exchanges:
    - binance
    - bybit
  orderbook_depth:
    binance: 20
    bybit: 50
  update_interval_seconds: 1
  liquidity_wall_threshold: 5

# Indicator correlation
INDICATOR_CORRELATION_WINDOW: 200

# Confidence engine
CONFIDENCE_THRESHOLD: 0.55
POSITION_SIZE_CONFIDENCE_SCALING: true
MICROSTRUCTURE_FEEDS_ENABLED: true

# When true, each ENGINE C scan logs ALIGNED tradeable consensus rows to shadow_signals (audit.db).
SHADOW_LEDGER_ENABLED: true 

# Demo testing: increase max simultaneous open trades from default 20 to 40
MAX_OPEN_POSITIONS: 40

# Pair-specific routing. Use this to disable filters that do not help a pair,
# zero out weak votes, or tighten thresholds without touching the whole asset class.
# Valid vote keys: d1_trend, h1_ema, d1_adx, h4_macd, h4_oscillator, volume,
# funding, session, h4_fib, h1_bb, weinstein, divergence
# Valid filter keys: weinstein, session, regime_transition, obv, funding,
# squeeze, mean_revert, btc_bias, divergence_warning
PAIR_PROFILES:
  XAU/USD:
    disable_filters: [obv, session]
    weight_overrides:
      h4_fib: 1.5
      h1_bb: 0.5
    min_confluence: 0.55
    bt_min: 0.55
  XAG/USD:
    disable_filters: [obv, session]
    weight_overrides:
      h4_fib: 1.5
    min_confluence: 0.55
    bt_min: 0.55
  LINK/USDT:
    disable_filters: [mean_revert]
    weight_overrides:
      funding: 1.25
  SUI/USDT:
    disable_filters: [mean_revert]
  APT/USDT:
    disable_filters: [mean_revert]
  LTC/USDT:
    disable_filters: [mean_revert]
  USD/CHF:
    disable_filters: [obv]
    weight_overrides:
      h4_fib: 1.5
      h1_bb: 0.75
  USD/MXN:
    disable_filters: [obv]
    weight_overrides:
      session: 1.25

# Telegram Notifications ────────────────────────────────────────────────
TELEGRAM:
  # Token and chat_id loaded from environment variables (TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID)
  # NEVER commit real tokens to config.yaml — revoke and regenerate if exposed.
  token: ""
  chat_id: ""
  enabled: true

# ── External API Keys ────────────────────────────────────────────────
TWELVEDATA_KEY: "9087d0ff6aeb49d1a0c5eaffce5d81a0"

# ── Auto-Exit ────────────────────────────────────────────────────────
# Automatically close passing trades if their confluence score decays significantly (e.g. drop from 3.0 to 0.0)
AUTO_EXIT_ON_DECAY: false

# ── Engine B (Naked Scalp) ───────────────────────────────────────────
NAKED_ENGINE:
  # Per-style min_score thresholds — tune here after backtesting.
  # These override the hardcoded defaults in _naked_scan_style_profile().
  # Hold limits (H4 bars): scalp=12 (48h), intraday=24 (4d), swing=60 (10d)
  style_profiles:
    scalp:
      min_score: 1.5
      min_rr: 1.5
    intraday:
      min_score: 2.0
      min_rr: 1.5
    swing:
      min_score: 2.5
      min_rr: 1.8

  zone_multipliers:
    TRENDING:        {upper: 0.3, lower: 1.0, sl: 1.5}
    RANGING:         {upper: 0.5, lower: 1.2, sl: 1.0}
    HIGH_VOLATILITY: {upper: 0.4, lower: 1.5, sl: 1.8}
    LOW_VOLATILITY:  {upper: 0.2, lower: 0.8, sl: 1.0}

  # Order Block minimum strength (0-100) to count as valid confluence
  # Strength = 60% displacement + 40% volume. Below this = weak/ignored.
  ob_min_strength: 50

# Engine B AI news context — feeds news into AI advisory review (not checklist)
ENGINE_B_NEWS_CONTEXT_ENABLED: true

# Forex structure timeframe for Engine B naked trading.
# "D1" = use daily candles for swing/BOS/CHoCH detection (filters H1 noise).
# "H1" = original behaviour (noisier on forex, fine for crypto/stocks).
# H4 is always used for zones and entry triggers regardless of this setting.
ENGINE_B_FOREX_STRUCTURE_TF: "D1"

# Engine B backtest SL/TP mode:
# "atr" = use Engine A calc_levels (ATR × multiplier) — proven, matches bar resolution
# "structural" = use Engine B naked zone placement (behind swing lows) — wider stops
ENGINE_B_BT_SL_MODE: "atr"

# AI usage control — when true, AI only runs on explicit user actions
# (manual analysis clicks, compare engines) — NOT on automatic scans
AI_ON_DEMAND_ONLY: true
