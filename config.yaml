FX_FACTOR_VOL_REDUCE_Z: 1.0                # new carry entries sized 50% above this vol z
FX_FACTOR_VOL_BLOCK_Z: 2.0                 # block new entries / cut existing sleeve 50%
FX_FACTOR_VOL_FLATTEN_Z: 3.0               # flatten existing carry sleeve
FX_FACTOR_VOL_JUMP_FLATTEN: 2.0            # 20d vol doubling within 5 sessions -> flatten
FX_FACTOR_VOL_RESUME_Z: 0.5                # hysteresis: resume only below this...
FX_FACTOR_VOL_RESUME_CLOSES: 3             # ...for this many consecutive daily closes
# Cost hard gate
FX_FACTOR_SLIPPAGE_PIPS: 0.3
FX_FACTOR_COST_MAX_ATR_FRACTION: 0.10      # total one-way cost must stay under this fraction of ATR
# Decision engine / backtest sizing
