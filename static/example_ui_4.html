<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Visual Quant Grid - Sentinel</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;700&family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
  :root {
    --bg: #0b0e14;
    --surface: #151a24;
    --border: #262d3d;
    --text: #ffffff;
    --text-mut: #828c9b;
    --bull: #00e676;
    --bear: #ff3b5c;
    --accent: #2962ff;
  }
  * { margin:0; padding:0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; padding: 30px; }
  
  h1 { font-weight: 800; font-size: 28px; margin-bottom: 30px; letter-spacing: -0.5px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(600px, 1fr)); gap: 30px; }
  
  .card { 
    background: var(--surface); 
    border-radius: 16px; 
    border: 1px solid var(--border); 
    display: flex; 
    overflow: hidden;
    height: 380px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
  }

  .chart-pane { flex: 1.2; position: relative; border-right: 1px solid var(--border); background: #0e1219; }
  .chart-container { width: 100%; height: 100%; }

  .data-pane { flex: 1; padding: 24px; display: flex; flex-direction: column; }
  
  .header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 24px; }
  .asset { font-size: 24px; font-weight: 800; font-family: 'Inter', sans-serif; letter-spacing: -1px; }
  .type { font-size: 11px; text-transform: uppercase; color: var(--text-mut); font-weight: 700; letter-spacing: 1px; }
  
  .badge { padding: 6px 12px; border-radius: 4px; font-family: 'Roboto Mono', monospace; font-size: 13px; font-weight: 700; }
  .badge.long { background: rgba(0, 230, 118, 0.1); color: var(--bull); border: 1px solid rgba(0, 230, 118, 0.3); }

  .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: auto; }
  .stat-box { background: rgba(0,0,0,0.2); border: 1px solid var(--border); padding: 12px; border-radius: 8px; }
  .s-label { font-size: 10px; text-transform: uppercase; color: var(--text-mut); font-weight: 700; margin-bottom: 4px; }
  .s-val { font-family: 'Roboto Mono', monospace; font-size: 16px; font-weight: 500; }

  .gauge-container { height: 90px; display: flex; align-items: center; gap: 16px; margin-bottom: 20px; }
  .gauge-chart-wrapper { width: 90px; height: 90px; position: relative; }
  .gauge-text { position: absolute; inset:0; display:flex; align-items:center; justify-content:center; flex-direction: column; }
  .gauge-text .sc { font-size: 20px; font-weight: 800; font-family: 'Roboto Mono', monospace; color: var(--bull); }
  
  .execute-btn { width: 100%; background: var(--accent); color: white; border: none; padding: 16px; border-radius: 8px; font-size: 14px; font-weight: 700; letter-spacing: 0.5px; cursor: pointer; transition: 0.2s; }
  .execute-btn:hover { background: #3b71ff; transform: translateY(-2px); }
</style>
</head>
<body>

  <h1>Visual Quant Layout</h1>

  <div class="grid">
    <div class="card">
      <div class="chart-pane">
        <div id="lwc-1" class="chart-container"></div>
      </div>
      
      <div class="data-pane">
        <div class="header">
          <div>
            <div class="asset">BTC/USDT</div>
            <div class="type">Crypto • Trending</div>
          </div>
          <div class="badge long">LONG</div>
        </div>

        <div class="gauge-container">
          <div class="gauge-chart-wrapper">
            <canvas id="gauge-1"></canvas>
            <div class="gauge-text">
              <span class="sc">2.5</span>
            </div>
          </div>
          <div>
            <div style="font-weight:700;font-size:14px;margin-bottom:4px">High Confluence</div>
            <div style="font-size:12px;color:var(--text-mut);line-height:1.4">Engine A and B are fully aligned on the micro structure.</div>
          </div>
        </div>

        <div class="stats-grid">
          <div class="stat-box">
            <div class="s-label">Reward:Risk</div>
            <div class="s-val" style="color:#fff">2.1 : 1</div>
          </div>
          <div class="stat-box">
            <div class="s-label">Entry</div>
            <div class="s-val" style="color:#fff">96,250</div>
          </div>
          <div class="stat-box">
            <div class="s-label">Stop Loss</div>
            <div class="s-val" style="color:var(--bear)">95,100</div>
          </div>
          <div class="stat-box">
            <div class="s-label">Take Profit</div>
            <div class="s-val" style="color:var(--bull)">98,400</div>
          </div>
        </div>

        <button class="execute-btn">EXECUTE TRADE</button>
      </div>
    </div>
  </div>

<script>
  // Draw Lightweight Chart
  const chartProps = { layout: { background: { type: 'solid', color: '#0e1219' }, textColor: '#828c9b' }, grid: { vertLines: { color: '#1a202c' }, horzLines: { color: '#1a202c' } }, rightPriceScale: { borderVisible: false }, timeScale: { borderVisible: false } };
  const chart = LightweightCharts.createChart(document.getElementById('lwc-1'), chartProps);
  const series = chart.addCandlestickSeries({ upColor: '#00e676', downColor: '#ff3b5c', borderVisible: false, wickUpColor: '#00e676', wickDownColor: '#ff3b5c' });
  
  // Fake data
  const data = [];
  let price = 95000;
  for(let i=0; i<50; i++) {
    const open = price;
    const close = price + (Math.random() - 0.45) * 500;
    const high = Math.max(open, close) + Math.random() * 200;
    const low = Math.min(open, close) - Math.random() * 200;
    data.push({ time: Date.now() / 1000 - (50-i)*3600, open, high, low, close });
    price = close;
  }
  series.setData(data);

  // Draw SL/TP Lines
  series.createPriceLine({ price: 95100, color: '#ff3b5c', lineWidth: 2, lineStyle: LightweightCharts.LineStyle.Dashed, axisLabelVisible: true, title: 'SL' });
  series.createPriceLine({ price: 98400, color: '#00e676', lineWidth: 2, lineStyle: LightweightCharts.LineStyle.Dashed, axisLabelVisible: true, title: 'TP' });
  chart.timeScale().fitContent();

  // Draw Gauge
  new Chart(document.getElementById('gauge-1'), {
    type: 'doughnut',
    data: { datasets: [{ data: [2.5, 0.5], backgroundColor: ['#00e676', '#262d3d'], borderWidth: 0, hoverOffset: 0 }] },
    options: { cutout: '80%', responsive: true, maintainAspectRatio: false, animation: { duration: 1500, easing: 'easeOutBounce' }, plugins: { tooltip: { enabled: false } } }
  });
</script>
</body>
</html>
