<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pro UI Mockup - Sentinel</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --border: #30363d;
    --text: #c9d1d9;
    --text-muted: #8b949e;
    --accent: #58a6ff;
    --bull: #3fb950;
    --bear: #f85149;
    --warn: #d29922;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; font-size: 13px; padding: 20px; }
  
  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
  .header h1 { font-size: 18px; font-weight: 600; color: #fff; }
  .header .controls { display: flex; gap: 12px; }
  .btn { background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 6px 16px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 500; }
  .btn.primary { background: var(--bull); color: #fff; border-color: transparent; }

  /* Data Table Approach instead of Cards */
  table { width: 100%; border-collapse: collapse; background: var(--surface); border-radius: 8px; overflow: hidden; border: 1px solid var(--border); }
  thead { background: rgba(255,255,255,0.02); border-bottom: 1px solid var(--border); }
  th { text-align: left; padding: 12px 16px; color: var(--text-muted); font-weight: 500; font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; border-bottom: 1px solid var(--border); }
  td { padding: 16px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tr:hover { background: rgba(255,255,255,0.02); }

  .pair { display: flex; align-items: center; gap: 12px; }
  .pair-icon { width: 32px; height: 32px; border-radius: 6px; background: rgba(88, 166, 255, 0.1); color: var(--accent); display: flex; align-items: center; justify-content: center; font-weight: 600; font-family: 'JetBrains Mono', monospace; }
  .pair-name { font-weight: 600; font-size: 14px; color: #fff; }
  .pair-type { font-size: 11px; color: var(--text-muted); text-transform: uppercase; }

  .dir-badge { display: inline-flex; padding: 4px 10px; border-radius: 4px; font-weight: 600; font-size: 11px; font-family: 'JetBrains Mono', monospace; }
  .dir-badge.long { background: rgba(63, 185, 80, 0.1); color: var(--bull); border: 1px solid rgba(63, 185, 80, 0.2); }
  .dir-badge.short { background: rgba(248, 81, 73, 0.1); color: var(--bear); border: 1px solid rgba(248, 81, 73, 0.2); }

  .score-bar { width: 120px; height: 4px; background: var(--border); border-radius: 2px; margin-top: 6px; overflow: hidden; }
  .score-fill { height: 100%; background: var(--accent); }
  .score-text { font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 500; color: #fff; }

  .levels { font-family: 'JetBrains Mono', monospace; }
  .level-row { display: flex; justify-content: space-between; margin-bottom: 4px; font-size: 12px; }
  .level-val { color: #fff; }
  .level-type { color: var(--text-muted); }
  .sl { color: var(--warn); }
  .tp { color: var(--accent); }

  .votes { display: flex; gap: 4px; }
  .vote { width: 8px; height: 24px; border-radius: 2px; background: var(--border); }
  .vote.bull { background: var(--bull); }
  .vote.bear { background: var(--bear); }

  .action-cell { text-align: right; }
</style>
</head>
<body>

<div class="app">
  <div class="header">
    <h1>Institutional Density Layout</h1>
    <div class="controls">
      <button class="btn">Filter</button>
      <button class="btn primary">Run Scan</button>
    </div>
  </div>

  <table>
    <thead>
      <tr>
        <th>Asset</th>
        <th>Signal</th>
        <th>Confluence</th>
        <th>Multi-TF Votes</th>
        <th>Key Levels</th>
        <th>RR Ratio</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>
          <div class="pair">
            <div class="pair-icon">B</div>
            <div>
              <div class="pair-name">BTC/USDT</div>
              <div class="pair-type">Crypto • Trending</div>
            </div>
          </div>
        </td>
        <td><span class="dir-badge long">LONG</span></td>
        <td>
          <div class="score-text">2.5 / 3.0</div>
          <div class="score-bar"><div class="score-fill" style="width: 83%; background: var(--bull)"></div></div>
        </td>
        <td>
          <div class="votes" title="H1: Bull, H4: Bull, D1: Neutral">
            <div class="vote bull"></div>
            <div class="vote bull"></div>
            <div class="vote"></div>
          </div>
        </td>
        <td class="levels">
          <div class="level-row"><span class="level-type tp">TP</span> <span class="level-val">97400.0</span></div>
          <div class="level-row"><span class="level-type sl">SL</span> <span class="level-val">95100.0</span></div>
        </td>
        <td class="levels"><span style="color:var(--text-muted)">1:</span> 1.5</td>
        <td class="action-cell"><button class="btn">Analyze</button></td>
      </tr>
      <tr>
        <td>
          <div class="pair">
            <div class="pair-icon">E</div>
            <div>
              <div class="pair-name">EUR/USD</div>
              <div class="pair-type">Forex • Ranging</div>
            </div>
          </div>
        </td>
        <td><span class="dir-badge short">SHORT</span></td>
        <td>
          <div class="score-text">1.8 / 3.0</div>
          <div class="score-bar"><div class="score-fill" style="width: 60%; background: var(--warn)"></div></div>
        </td>
        <td>
          <div class="votes" title="H1: Bear, H4: Bear, D1: Bear">
            <div class="vote bear"></div>
            <div class="vote bear"></div>
            <div class="vote bear"></div>
          </div>
        </td>
        <td class="levels">
          <div class="level-row"><span class="level-type tp">TP</span> <span class="level-val">1.0340</span></div>
          <div class="level-row"><span class="level-type sl">SL</span> <span class="level-val">1.0450</span></div>
        </td>
        <td class="levels"><span style="color:var(--text-muted)">1:</span> 2.1</td>
        <td class="action-cell"><button class="btn">Analyze</button></td>
      </tr>
    </tbody>
  </table>
</div>

</body>
</html>
