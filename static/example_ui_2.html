<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glassmorphic UI Mockup - Sentinel</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-dark: #05050a;
    --card-glass: rgba(20, 20, 30, 0.6);
    --border-glass: rgba(255, 255, 255, 0.08);
    --accent: #6d28d9;
    --accent-glow: rgba(109, 40, 217, 0.4);
    --bull: #10b981;
    --bear: #ef4444;
    --text: #f8fafc;
    --text-muted: #94a3b8;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { 
    background-color: var(--bg-dark); 
    background-image: 
      radial-gradient(circle at 15% 50%, rgba(109, 40, 217, 0.15), transparent 25%),
      radial-gradient(circle at 85% 30%, rgba(16, 185, 129, 0.1), transparent 25%);
    color: var(--text); 
    font-family: 'Outfit', sans-serif; 
    min-height: 100vh;
    padding: 40px; 
  }
  
  h1 { font-family: 'Space Grotesk', sans-serif; font-size: 28px; font-weight: 800; margin-bottom: 40px; letter-spacing: -0.02em; }
  
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 24px; }
  
  .card {
    background: var(--card-glass);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--border-glass);
    border-radius: 20px;
    padding: 24px;
    position: relative;
    overflow: hidden;
    transition: transform 0.3s, box-shadow 0.3s;
  }
  .card:hover {
    transform: translateY(-5px);
    box-shadow: 0 20px 40px rgba(0,0,0,0.4), 0 0 20px var(--accent-glow);
    border-color: rgba(255,255,255,0.15);
  }

  /* Status line at top */
  .status-line { position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--bull); }
  .card.short .status-line { background: var(--bear); }

  .header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; }
  .asset h2 { font-size: 22px; font-weight: 600; font-family: 'Space Grotesk', sans-serif; margin-bottom: 4px; }
  .asset p { color: var(--text-muted); font-size: 13px; text-transform: uppercase; letter-spacing: 0.1em; }

  .direction { padding: 6px 14px; border-radius: 30px; font-size: 12px; font-weight: 800; letter-spacing: 0.1em; }
  .card.long .direction { background: rgba(16, 185, 129, 0.15); color: var(--bull); }
  .card.short .direction { background: rgba(239, 68, 68, 0.15); color: var(--bear); }

  .metrics { display: flex; gap: 16px; margin-bottom: 24px; }
  .metric { flex: 1; background: rgba(0,0,0,0.2); padding: 12px; border-radius: 12px; border: 1px solid var(--border-glass); }
  .metric-label { font-size: 11px; color: var(--text-muted); margin-bottom: 4px; }
  .metric-val { font-size: 16px; font-weight: 600; font-family: 'Space Grotesk', sans-serif; }
  .metric-val.sl { color: var(--text-muted); }
  .metric-val.tp { color: var(--bull); }
  .card.short .metric-val.tp { color: var(--bear); }

  .analysis-bar { border-top: 1px solid var(--border-glass); padding-top: 20px; display: flex; justify-content: space-between; align-items: center; }
  .conf-wrapper { display: flex; align-items: center; gap: 12px; }
  .conf-score { font-size: 20px; font-weight: 800; }
  .conf-stars { color: var(--accent); letter-spacing: 2px; }

  .btn { width: 100%; padding: 14px; margin-top: 20px; border-radius: 12px; border: none; background: rgba(255,255,255,0.05); color: #fff; font-family: 'Outfit', sans-serif; font-weight: 600; font-size: 14px; cursor: pointer; transition: 0.2s; border: 1px solid var(--border-glass); }
  .btn:hover { background: var(--accent); color: #fff; }

</style>
</head>
<body>

  <h1>Sleek Neumorphic Layout</h1>

  <div class="grid">
    <div class="card long">
      <div class="status-line"></div>
      <div class="header">
        <div class="asset">
          <h2>BTC/USDT</h2>
          <p>Crypto • Setup</p>
        </div>
        <div class="direction">LONG</div>
      </div>
      
      <div class="metrics">
        <div class="metric">
          <div class="metric-label">Stop Loss</div>
          <div class="metric-val sl">95,100.0</div>
        </div>
        <div class="metric">
          <div class="metric-label">Take Profit</div>
          <div class="metric-val tp">97,400.0</div>
        </div>
      </div>

      <div class="analysis-bar">
        <div>
          <div class="metric-label">Confluence Score</div>
          <div class="conf-wrapper">
            <span class="conf-score">2.5</span>
            <span class="conf-stars">★★D</span>
          </div>
        </div>
        <div>
          <div class="metric-label">R:R</div>
          <div style="font-weight: 800">1 : 1.5</div>
        </div>
      </div>

      <button class="btn">View AI Analysis</button>
    </div>

    <div class="card short">
      <div class="status-line"></div>
      <div class="header">
        <div class="asset">
          <h2>EUR/USD</h2>
          <p>Forex • Swing</p>
        </div>
        <div class="direction">SHORT</div>
      </div>
      
      <div class="metrics">
        <div class="metric">
          <div class="metric-label">Stop Loss</div>
          <div class="metric-val sl">1.0450</div>
        </div>
        <div class="metric">
          <div class="metric-label">Take Profit</div>
          <div class="metric-val tp">1.0340</div>
        </div>
      </div>

      <div class="analysis-bar">
        <div>
          <div class="metric-label">Confluence Score</div>
          <div class="conf-wrapper">
            <span class="conf-score">1.8</span>
            <span class="conf-stars">★DD</span>
          </div>
        </div>
        <div>
          <div class="metric-label">R:R</div>
          <div style="font-weight: 800">1 : 2.1</div>
        </div>
      </div>

      <button class="btn">View AI Analysis</button>
    </div>
  </div>

</body>
</html>
