# Athena EdgeLab configuration (research-only; no live execution).

enabled: true
enabled_engines:
  - engine_b
  - cascade
  - engine_a
optional_engines:
  - scalp
  - ase

symbols:
  - BTCUSDT
  - ETHUSDT
timeframes:
  - H4
  - H1

freshness_max_age_hours: 48
freshness_min_bars: 200
loop_interval_seconds: 900
max_candidates_per_cycle: 1
candidate_generation_mode: none

min_score_delta: 0.05
min_trade_count: 30
max_drawdown_R: 3.0
max_symbol_concentration: 0.60
require_oos_not_worse: true
require_tests_pass: true
dry_run_default: false

baseline_command: python research/edgelab/stub_evaluator.py --scenario baseline
evaluation_command: python research/edgelab/stub_evaluator.py --scenario evaluate
test_command: pytest tests/research/edgelab -q
metrics_output_path: ""

candidate_command: ""

manual_poll_seconds: 5
manual_timeout_seconds: 3600
autostart_daemon: false

allowed_paths:
  - research/
  - config/research/
  - configs/research/
  - tests/research/
  - athena_research/
  - engine_a/research/
  - engine_b/research/
  - research/edgelab/
  - research/autoresearch/

denied_keywords:
  - live
  - broker
  - order
  - execution
  - execute
  - autotrade
  - scheduler
  - credentials
  - secret
  - key
  - mt5_login
  - account
  - trade_router
  - position_manager
  - risk_live
  - ui
  - frontend
  - dashboard
  - button
  - send_order
  - place_order
  - close_order

engine_commands:
  engine_b: python research/edgelab/stub_evaluator.py --scenario engine_b_stub
  cascade: python research/edgelab/stub_evaluator.py --scenario cascade_stub
  engine_a: python research/edgelab/stub_evaluator.py --scenario engine_a_stub
  scalp: ""
  ase: ""

detected_research_commands:
  engine_a_ablation: python -m athena_research.engine_a_ablation.run --max-symbols 4 --step 4 --out research/edgelab/logs/engine_a_eval.json
  engine_b_quality: python -m athena_research.engine_b_quality_report
  vectorbt_lab: python tools/vectorbt_research_lab.py --mode tiny

scoring_weights:
  expR: 40
  profit_factor_cap: 3.0
  profit_factor_mult: 15
  sqn_cap: 4.0
  sqn_mult: 10
  max_drawdown_mult: 8
