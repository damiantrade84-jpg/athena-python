# Engine B Configuration
# =======================
# Edit this file to tune Engine B without touching Python.
#
# Validate with:
#   python engine_b_yaml_loader.py --validate engine_b_config.yaml

base_thresholds:
  scalp:
    min_score: 4.0
    min_rr: 1.5
    fallback_rr: 2.0
  intraday:
    min_score: 4.5
    min_rr: 1.5
    fallback_rr: 2.0
  swing:
    min_score: 5.0
    min_rr: 2.0
    fallback_rr: 3.0

regime_multipliers:
  TRENDING: 0.95
  RANGING: 1.10
  HIGH_VOLATILITY: 1.10
  LOW_VOLATILITY: 0.90
  UNKNOWN: 1.0
regime_scaling_enabled: true

crypto_aggtrade:
  mode: degraded
  alignment_bonus: 0.5
  missing_penalty: 0.5

space_gate:
  rr_substitute_min_atr_floor_enabled: false
  rr_substitute_min_atr_floor: 0.5

execution_levels:
  max_sl_pct: 0.02
  max_sl_atr_default: 3.0
  min_sl_atr_default: 0.75
  synthetic_fallback_rr_tp_enabled: true

volume_profile:
  trusted_groups:
    - crypto_btc
    - crypto_eth
    - crypto_alt_majors
    - crypto_doge
    - crypto_other
    - us_stock_single
    - stock_other
    - smallcap_em_etf
    # C2: index ETFs, precious/energy/bond trackers with real RTH volume
    # (SPY/QQQ/DAX ETFs, GLD/SLV, USO/XLE, TLT) — audit MED #18.
    - us_indices_trackers
    - eu_indices
    - asian_indices
    - precious_trackers
    - energy_oil
    - bond_tlt

forex_session:
  asian_skip_enabled: true
  asian_active_currencies: [JPY, AUD, NZD, CNH, SGD, HKD]

group_overrides:
