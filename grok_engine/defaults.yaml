  dealing_lookback: 48
  ote_inner: 0.62
  ote_outer: 0.79
  cisd_lookback: 20

scoring:
  ready_threshold: 76.0
  watch_threshold: 58.0
  minimum_killzone_quality: 0.70
  minimum_raid_strength: 0.34
  minimum_impulse_strength: 0.36
  maximum_premium_for_long: 0.86
  minimum_discount_for_short: 0.14
  weights:
    killzone_clock: 12.0
    liquidity_raid: 22.0
    impulse_vector: 16.0
    void_alignment: 16.0
    dealing_range: 14.0
    cisd_state: 10.0
    geometry: 10.0

levels:
