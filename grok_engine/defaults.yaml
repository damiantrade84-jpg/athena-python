      quality: 0.22
    london_killzone:
      start_minute: 120
      end_minute: 300
      kind: killzone
      quality: 0.84
    london_silver_bullet:
      start_minute: 180
      end_minute: 240
      kind: silver_bullet
      quality: 1.0
    ny_am_killzone:
      start_minute: 420
      end_minute: 600
      kind: killzone
      quality: 0.86
    ny_am_silver_bullet:
      start_minute: 600
      end_minute: 660
      kind: silver_bullet
      quality: 1.0
    ny_lunch:
      start_minute: 720
      end_minute: 780
      kind: dead
      quality: 0.08
    ny_pm_silver_bullet:
      start_minute: 840
      end_minute: 900
      kind: silver_bullet
      quality: 0.96
    london_close:
      start_minute: 600
      end_minute: 720
      kind: killzone
