        verified_url_or_identifier: "DOI 10.1111/1468-0262.00152"
        citation: "White, H. (2000). A reality check for data snooping. Econometrica, 68(5), 1097-1126. https://doi.org/10.1111/1468-0262.00152"
        used_for: "Research validation governance for Engine B RR, fallback-target, and structure-gate sweeps."
        limitation: "Does not validate BOS/CHoCH/OB/FVG definitions, RR thresholds, fallback TP, or level-selection logic."
        directly_mapped_config_keys:
