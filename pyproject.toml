# Metadata only: dependency install for this repo is `pip install -r requirements.txt`.
# requires-python documents supported interpreters; it is not a substitute for recreating .venv.
[project]
name = "athena-python"
version = "0.0.0"
requires-python = ">=3.11,<3.15"
description = "Sentinel / Athena trading stack"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Repo-local basetemp avoids Windows permission failures under %TEMP%/pytest-of-*.
addopts = "--basetemp=.pytest_tmp"
norecursedirs = [
    "refs",
    ".git",
    ".venv",
    ".pytest_cache",
    ".pytest_tmp",
    ".ruff_cache",
    "tests/.tmp",
    "tests/manual_probes",
    ".tmp-engine-ab-boundary-commit",
    ".tmp-engine-ab-commit",
    ".tmp-engine-ab-final",
    ".tmp-engine-ab-final2",
    ".tmp-engine-b-blocker-full",
    ".tmp-tp-sl-audit",
    ".tmp-engine-d-adjacent-2",
    "_basetemp_trailing_atr_timed_exit_fresh",
    "__pycache__",
]
